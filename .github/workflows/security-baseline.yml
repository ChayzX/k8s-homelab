name: Review Oculum Security Baseline

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Oculum action v1 exposes baseline comparison, but its GitHub Action
      # entrypoint does not write .oculum/baseline.json for baseline:create.
      # Keep this workflow an auditable, non-blocking scan until the upstream
      # action implements baseline persistence; never manufacture a baseline
      # from an incomplete result.
      - name: Run reviewed security scan
        uses: OculumDev/oculum-action@d43812a73db077d03caff16b7196607d8d6d87bf # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          depth: cheap
          baseline: auto
          fail-on: none
          comment: false
          sarif: true

      - name: Verify SARIF report
        run: |
          test -s oculum-results.sarif
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('oculum-results.sarif').read_text())
          assert data.get('version') == '2.1.0'
          assert isinstance(data.get('runs'), list) and data['runs']
          print(f"sarif_results={len(data['runs'][0].get('results', []))}")
          PY

      - name: Upload reviewed scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oculum-security-scan
          path: oculum-results.sarif
          if-no-files-found: error
