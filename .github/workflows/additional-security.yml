name: Additional Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: additional-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history and print redacted finding locations
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          chmod 700 "$RUNNER_TEMP/gitleaks"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner --report-format json --report-path /reports/findings.json /repo
          scan_status=$?
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          file = Path(os.environ["RUNNER_TEMP"]) / "gitleaks" / "findings.json"
          if file.exists():
              findings = json.loads(file.read_text())
              print(f"Potential secret matches: {len(findings)}")
              for finding in findings:
                  # Deliberately never print Secret, Match, or raw line content.
                  rule = str(finding.get("RuleID", "unknown")).replace("\n", " ")[:100]
                  path = str(finding.get("File", "unknown")).replace("\n", " ")[:220]
                  line = finding.get("StartLine", "?")
                  commit = str(finding.get("Commit", ""))[:12]
                  print(f"rule={rule} file={path} line={line} commit={commit}")
              file.unlink()
          PY
          exit "$scan_status"
  trivy-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Scan dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
  trivy-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Scan Kubernetes, Docker and IaC configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
