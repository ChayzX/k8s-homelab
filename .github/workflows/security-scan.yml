name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

# Security scans are repeatable and only the newest tree for a PR/ref matters.
# Cancel superseded scans so rapid PR updates and successive main pushes do not
# consume a runner for work whose result is already obsolete.
concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Oculum Security Scan
        uses: OculumDev/oculum-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          depth: validated
          fail-on: none
          sarif: false
          oculum-api-key: ${{ secrets.OCULUM_API_KEY }}
