name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

# Security scans are repeatable and only the newest tree for a PR/ref matters.
# Cancel superseded scans so rapid PR updates and successive main pushes do not
# consume a runner for work whose result is already obsolete.
concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Use the repo-scoped homelab runner for routine scans so normal CI does
    # not consume hosted Actions minutes. This job is read-only and does not
    # receive cluster credentials.
    runs-on: [self-hosted, homelab-ci]
    steps:
      # Pin third-party actions to immutable commits; update only after review.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Oculum Security Scan
        uses: OculumDev/oculum-action@d43812a73db077d03caff16b7196607d8d6d87bf # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          depth: validated
          # Do not merge or publish a tree with an unsuppressed high/critical finding.
          # Existing reviewed findings must be narrowly suppressed with rationale.
          fail-on: high
          sarif: false
          oculum-api-key: ${{ secrets.OCULUM_API_KEY }}
