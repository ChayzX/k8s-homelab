# Builds opsbot/bot and pushes to GHCR (ghcr.io/chayzx/opsbot), same pattern
# as pantry-bot's publish.yml. Runs entirely on GitHub-hosted runners -- no
# Docker or self-hosted machine required, unlike the old localhost/ side-load
# flow this replaces.

name: Deploy opsbot

on:
  push:
    branches:
      - main
    paths:
      - opsbot/bot/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}

  # k8s-homelab-oiv.8: reaches the cluster's private API through a dedicated
  # Cloudflare Tunnel (ci-tunnel/) gated by Cloudflare Access (service
  # token). `cloudflared access tcp` does the Access handshake once and
  # proxies raw bytes after that -- kubectl talks to 127.0.0.1:16443 like
  # it's local. See ci-tunnel/MANUAL-SETUP.md for the full path. Verified
  # end-to-end manually before wiring this in.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        # Pinned version + checksum, not `latest` -- an unpinned download-and-
        # exec-with-sudo step is a real supply-chain risk. Bump both together
        # when a newer cloudflared is needed (checksum from the release's own
        # cloudflared-linux-amd64 asset, e.g. `sha256sum` against the download).
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
          CLOUDFLARED_SHA256: "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
        run: |
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Open Access-authenticated tunnel to k8s API
        # Service token via env, not CLI args -- args are visible to anything
        # reading the process table on the runner, same reasoning as this
        # repo's pantry-bot/60-deployment-cloudflared.yaml on TUNNEL_TOKEN.
        # cloudflared reads these particular env vars natively (see its own
        # --help output), so no code change needed, just dropping the flags.
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cloudflared access tcp \
            --hostname k8s-api.greeniespantry.uk \
            --url 127.0.0.1:16443 &
          sleep 3

      - name: Write scoped kubeconfig
        # Secret via env + $VAR reference, not inlined ${{ }} in the script --
        # keeps the literal secret value out of the rendered run-script text.
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"

      - name: Update deployment image
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl set image deployment/opsbot opsbot=ghcr.io/chayzx/opsbot:${{ github.sha }} -n opsbot

      - name: Wait for rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl rollout status deployment/opsbot -n opsbot --timeout=60s

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl rollout undo deployment/opsbot -n opsbot
