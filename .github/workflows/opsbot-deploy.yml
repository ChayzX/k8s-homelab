# Builds opsbot/bot and pushes to GHCR (ghcr.io/chayzx/opsbot), same pattern
# as pantry-bot's publish.yml. Runs entirely on GitHub-hosted runners -- no
# Docker or self-hosted machine required, unlike the old localhost/ side-load
# flow this replaces.

name: Deploy opsbot

on:
  push:
    branches:
      - main
    paths:
      - opsbot/bot/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}

  # TODO(k8s-homelab-oiv.8): kubectl below has no path to the cluster yet.
  # This is a GitHub-hosted runner with no route to the k3s API server --
  # the old self-hosted runner had one because it lived on the cluster's own
  # LAN. Wiring that up needs a Cloudflare Tunnel + Access route (tracked as
  # k8s-homelab-oiv.8), not yet built. Until then this job is a stub: it
  # documents the intended shape but the run step is disabled.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Update deployment image
        if: false # blocked on k8s-homelab-oiv.8
        run: kubectl set image deployment/opsbot opsbot=ghcr.io/chayzx/opsbot:${{ github.sha }} -n opsbot

      - name: Wait for rollout
        if: false # blocked on k8s-homelab-oiv.8
        run: kubectl rollout status deployment/opsbot -n opsbot --timeout=60s

      - name: Rollback on failure
        if: false # blocked on k8s-homelab-oiv.8
        run: kubectl rollout undo deployment/opsbot -n opsbot
