# Automates opsbot build, side-load, and restart. Replaces manual workflow:
# docker build → docker save | sudo k3s ctr images import → kubectl rollout restart
# Triggered on source changes to opsbot/bot/; runs on self-hosted runner with sudoers
# configured for passwordless `k3s ctr images import` (see step 3 comment).

name: Deploy opsbot

on:
  push:
    branches:
      - main
    paths:
      - opsbot/bot/**
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, opsbot-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        # localhost/ prefix is load-bearing, not cosmetic -- see 40-deployment.yaml's
        # header comment. A bare tag normalizes to docker.io/library/*, and with
        # imagePullPolicy IfNotPresent the kubelet falls back to an actual registry
        # pull attempt (ImagePullBackOff, no such repo exists) instead of resolving
        # the locally side-loaded image.
        run: docker build -t localhost/opsbot:${{ github.sha }} opsbot/bot

      - name: Side-load into k3s containerd
        run: docker save localhost/opsbot:${{ github.sha }} | sudo k3s ctr images import -
        # NOTE: Runner unix user requires sudoers entry for passwordless:
        #   <runner-user> ALL=(ALL) NOPASSWD:/usr/local/bin/k3s ctr images import

      - name: Update deployment image
        env:
          KUBECONFIG: /etc/ci-deploy/opsbot.kubeconfig
        # container name is `opsbot`, not `bot` -- see 40-deployment.yaml
        run: kubectl set image deployment/opsbot opsbot=localhost/opsbot:${{ github.sha }} -n opsbot

      - name: Wait for rollout
        env:
          KUBECONFIG: /etc/ci-deploy/opsbot.kubeconfig
        run: kubectl rollout status deployment/opsbot -n opsbot --timeout=60s

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: /etc/ci-deploy/opsbot.kubeconfig
        run: kubectl rollout undo deployment/opsbot -n opsbot
