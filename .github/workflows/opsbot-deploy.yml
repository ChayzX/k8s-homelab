# Bead: k8s-homelab-os2 — one visible CI/CD workflow with publish, manifest,
# restart, rollout, and health-verification stages.
#
# k8s-homelab-oiv.8: reaches the cluster's private API through a dedicated
# Cloudflare Tunnel (ci-tunnel/) gated by Cloudflare Access (service
# token). `cloudflared access tcp` does the Access handshake once and
# proxies raw bytes after that -- kubectl talks to 127.0.0.1:16443 like
# it's local. See ci-tunnel/MANUAL-SETUP.md for the full path.

name: Opsbot CI/CD

on:
  push:
    branches: [main]
    paths:
      - opsbot/bot/**
      - opsbot/40-deployment.yaml
      - .github/workflows/opsbot-deploy.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the most recent published build)"
        required: false
        default: latest

permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}
      - name: Publish stage summary
        if: always()
        run: |
          { echo '## Opsbot CI/CD pipeline'; echo ''; echo '### Build and publish: ${{ steps.publish.outcome }}'; echo "- Digest: \`${{ steps.publish.outputs.digest || 'unavailable' }}\`"; } >> "$GITHUB_STEP_SUMMARY"

  apply-manifest:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Connect to cluster
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl apply -f opsbot/40-deployment.yaml -n opsbot

  restart-opsbot:
    needs: apply-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Connect and restart pod
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl set image deployment/opsbot "opsbot=ghcr.io/chayzx/opsbot:${IMAGE_TAG}" -n opsbot
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl rollout restart deployment/opsbot -n opsbot

  verify-opsbot:
    needs: restart-opsbot
    runs-on: ubuntu-latest
    steps:
      - name: Connect and verify pod health
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl rollout status deployment/opsbot -n opsbot --timeout=60s
          POD="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pods -n opsbot -l app.kubernetes.io/name=opsbot -o jsonpath='{.items[0].metadata.name}')"
          READY="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pod "$POD" -n opsbot -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
          IMAGE_ID="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pod "$POD" -n opsbot -o jsonpath='{.status.containerStatuses[?(@.name=="opsbot")].imageID}')"
          test "$READY" = True; test -n "$IMAGE_ID"
          { echo '## Opsbot deployment pipeline'; echo ''; echo '### Manifest apply: ✅ passed'; echo '### Pod restart: ✅ passed'; echo '### Pod health: ✅ passed'; echo "- Pod: \`$POD\`"; echo "- Ready: \`$READY\`"; echo "- Image ID: \`$IMAGE_ID\`"; } >> "$GITHUB_STEP_SUMMARY"
