# Builds opsbot/bot and pushes to GHCR (ghcr.io/chayzx/opsbot), same pattern
# as pantry-bot's publish.yml. Runs entirely on GitHub-hosted runners -- no
# Docker or self-hosted machine required, unlike the old localhost/ side-load
# flow this replaces.

name: Deploy opsbot

on:
  push:
    branches:
      - main
    paths:
      - opsbot/bot/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}

  # k8s-homelab-oiv.8: reaches the cluster's private API through a dedicated
  # Cloudflare Tunnel (ci-tunnel/) gated by Cloudflare Access (service
  # token). `cloudflared access tcp` does the Access handshake once and
  # proxies raw bytes after that -- kubectl talks to 127.0.0.1:16443 like
  # it's local. See ci-tunnel/MANUAL-SETUP.md for the full path. Verified
  # end-to-end manually before wiring this in.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Open Access-authenticated tunnel to k8s API
        run: |
          cloudflared access tcp \
            --hostname k8s-api.greeniespantry.uk \
            --url 127.0.0.1:16443 \
            --service-token-id "${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --service-token-secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" &
          sleep 3

      - name: Write scoped kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_OPSBOT }}" | base64 -d > $RUNNER_TEMP/opsbot.kubeconfig

      - name: Update deployment image
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl set image deployment/opsbot opsbot=ghcr.io/chayzx/opsbot:${{ github.sha }} -n opsbot

      - name: Wait for rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl rollout status deployment/opsbot -n opsbot --timeout=60s

      - name: Rollback on failure
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/opsbot.kubeconfig
        run: kubectl rollout undo deployment/opsbot -n opsbot
