# Bead: k8s-homelab-os2 — one visible CI/CD workflow with publish, manifest,
# restart, rollout, and health-verification stages.
#
# k8s-homelab-oiv.8: reaches the cluster's private API through a dedicated
# Cloudflare Tunnel (ci-tunnel/) gated by Cloudflare Access (service
# token). `cloudflared access tcp` does the Access handshake once and
# proxies raw bytes after that -- kubectl talks to 127.0.0.1:16443 like
# it's local. See ci-tunnel/MANUAL-SETUP.md for the full path.

name: Opsbot CI/CD

on:
  push:
    branches: [main]
    paths:
      - opsbot/bot/**
      - opsbot/40-deployment.yaml
      - .github/workflows/opsbot-deploy.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the most recent published build)"
        required: false
        default: latest

permissions:
  contents: read

jobs:
  publish-image:
    name: 1 - Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}
      - name: Publish stage summary
        if: always()
        run: |
          { echo '## Opsbot CI/CD pipeline'; echo ''; echo '### Build and publish: ${{ steps.publish.outcome }}'; echo "- Digest: \`${{ steps.publish.outputs.digest || 'unavailable' }}\`"; } >> "$GITHUB_STEP_SUMMARY"

  apply-manifest:
    name: 2 - Apply deployment manifest
    if: github.event_name == 'workflow_dispatch'
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Connect to cluster
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          test -n "$KUBE_CONFIG_B64"
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          chmod 600 "$RUNNER_TEMP/opsbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl apply -f opsbot/40-deployment.yaml -n opsbot

  restart-opsbot:
    name: 3 - Deploy image and restart pod
    needs: apply-manifest
    runs-on: ubuntu-latest
    outputs:
      previous_pod: ${{ steps.restart.outputs.previous_pod }}
    steps:
      - name: Connect and restart pod
        id: restart
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          test -n "$KUBE_CONFIG_B64"
          test -n "$IMAGE_TAG"
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          chmod 600 "$RUNNER_TEMP/opsbot.kubeconfig"
          POD="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pods -n opsbot -l app.kubernetes.io/name=opsbot -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          echo "previous_pod=$POD" >> "$GITHUB_OUTPUT"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl set image deployment/opsbot "opsbot=ghcr.io/chayzx/opsbot:${IMAGE_TAG}" -n opsbot
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl rollout restart deployment/opsbot -n opsbot
          echo "Previous pod: ${POD:-none}"

  verify-opsbot:
    name: 4 - Verify rollout and pod health
    needs: restart-opsbot
    runs-on: ubuntu-latest
    steps:
      - name: Connect and verify pod health
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          test -n "$KUBE_CONFIG_B64"
          test -n "$IMAGE_TAG"
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/opsbot.kubeconfig"
          chmod 600 "$RUNNER_TEMP/opsbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl rollout status deployment/opsbot -n opsbot --timeout=180s
          # rollout status can return while the old pod is still terminating;
          # selecting .items[0] then races the replacement assertion. Wait for
          # a Running+Ready pod and explicitly reject the recorded old pod.
          POD=""
          for attempt in $(seq 1 30); do
            POD="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pods -n opsbot -l app.kubernetes.io/name=opsbot -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | awk '$2 == "Running" && $3 == "True" { print $1; exit }')"
            PREVIOUS_POD='${{ needs.restart-opsbot.outputs.previous_pod }}'
            if [ -n "$POD" ] && [ "$POD" != "$PREVIOUS_POD" ]; then
              break
            fi
            sleep 2
          done
          test -n "$POD"
          READY="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pod "$POD" -n opsbot -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
          IMAGE_ID="$(KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig" kubectl get pod "$POD" -n opsbot -o jsonpath='{.status.containerStatuses[?(@.name=="opsbot")].imageID}')"
          test "$READY" = True; test -n "$IMAGE_ID"
          if [ -n "$PREVIOUS_POD" ] && [ "$POD" = "$PREVIOUS_POD" ]; then
            echo "Expected a replacement Opsbot pod, but the pod name did not change: $POD" >&2
            exit 1
          fi
          { echo '## Opsbot deployment pipeline'; echo ''; echo '### Manifest apply: ✅ passed'; echo '### Pod restart: ✅ passed'; echo "- Previous pod: \`${PREVIOUS_POD:-none}\`"; echo "- Current pod: \`$POD\`"; echo '### Pod health: ✅ passed'; echo "- Ready: \`$READY\`"; echo "- Image ID: \`$IMAGE_ID\`"; } >> "$GITHUB_STEP_SUMMARY"
