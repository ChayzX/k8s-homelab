# One visible CI/CD workflow with publish, manifest,
# restart, rollout, and health-verification stages.
#
# k8s-homelab-oiv.8: reaches the cluster's private API through a dedicated
# Cloudflare Tunnel (ci-tunnel/) gated by Cloudflare Access (service
# token). `cloudflared access tcp` does the Access handshake once and
# proxies raw bytes after that -- kubectl talks to 127.0.0.1:16443 like
# it's local. See ci-tunnel/MANUAL-SETUP.md for the full path.

name: Opsbot CI/CD

on:
  push:
    branches: [main]
    paths:
      - opsbot/bot/**
      - opsbot/40-deployment.yaml
      - .github/workflows/opsbot-deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize production deploys so an older rollout cannot finish after a newer one.
concurrency:
  group: opsbot-deploy
  cancel-in-progress: false

env:
  # Portainer's opsbot workflow watches this branch and is the only deployer.
  DEPLOY_BRANCH: deploy/portainer-home

jobs:
  publish-image:
    name: 1 - Build and publish (merge deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      # QEMU is what lets the amd64 GitHub Actions runner cross-compile an
      # arm64 image -- without it, `platforms: linux/arm64` below fails
      # outright rather than silently building amd64-only.
      #
      # Added 2026-09-08: opsbot's second replica on pantry-bot-oracle
      # (arm64) sat in ImagePullBackOff for 10+ hours undetected --
      # ghcr.io/chayzx/opsbot had only ever been built for amd64. Same
      # failure mode pantry-bot hit on 2026-09-06 (see its deploy.yml),
      # fixed here the same way.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: opsbot/bot
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}
      - name: Verify multi-arch manifest
        run: |
          set -euo pipefail
          OUTPUT="$(docker buildx imagetools inspect ghcr.io/chayzx/opsbot:${{ github.sha }})"
          echo "$OUTPUT"
          for plat in linux/amd64 linux/arm64; do
            if ! echo "$OUTPUT" | grep -qE "Platform:\s*$plat"; then
              echo "::error::Published image is missing platform $plat -- any pod scheduled onto a $plat node would hit ImagePullBackOff, exactly as happened here 2026-09-08 and to pantry-bot 2026-09-06." >&2
              exit 1
            fi
          done
      - name: Publish stage summary
        if: always()
        run: |
          { echo '## Opsbot CI/CD pipeline'; echo ''; echo '### Build and publish: ${{ steps.publish.outcome }}'; echo "- Digest: \`${{ steps.publish.outputs.digest || 'unavailable' }}\`"; echo '### Live deployment: ▶ continuing (merge to main approved deployment)'; } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: 2 - Promote image to Portainer deploy branch
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      previous_image: ${{ steps.promote.outputs.previous_image }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - name: Commit image to deploy branch
        id: promote
        run: scripts/promote-portainer-image.sh opsbot/40-deployment.yaml ghcr.io/chayzx/opsbot "ghcr.io/chayzx/opsbot:${{ github.sha }}"

  verify-opsbot:
    name: 3 - Verify Portainer rollout and pod health (merge deploy)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for Portainer and verify pod health
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          WAIT_IMAGE: ghcr.io/chayzx/opsbot:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          test -n "$KUBE_CONFIG_B64"
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64"
          echo "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/opsbot.kubeconfig"; chmod 600 "$RUNNER_TEMP/opsbot.kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig"
          scripts/assert-kube-target.sh home
          # Portainer polls the deploy branch; allow several poll intervals.
          current=''
          for _ in $(seq 1 90); do
            current="$(kubectl get deployment/opsbot -n opsbot -o jsonpath='{.spec.template.spec.containers[?(@.name=="opsbot")].image}')" || true
            if [ "$current" = "$WAIT_IMAGE" ]; then break; fi
            sleep 10
          done
          if [ "$current" != "$WAIT_IMAGE" ]; then echo "::error::Portainer did not apply $WAIT_IMAGE; live image is $current" >&2; exit 1; fi
          kubectl rollout status deployment/opsbot -n opsbot --timeout=180s
          # rollout status can return while the old pod is still terminating, so
          # require a Ready pod that is running the promoted image.
          POD=''
          for _ in $(seq 1 30); do
            POD="$(kubectl get pods -n opsbot -l app.kubernetes.io/name=opsbot -o json | jq -r --arg image "$WAIT_IMAGE" '.items[] | select(.metadata.deletionTimestamp == null) | select(.spec.containers[] | select(.name == "opsbot") | .image == $image) | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name' | head -n1)" || true
            if [ -n "$POD" ]; then break; fi
            sleep 2
          done
          test -n "$POD"
          { echo '## Opsbot deployment pipeline'; echo ''; echo '### Portainer rollout: ✅ passed'; echo "- Pod: \`$POD\`"; echo "- Image: \`$WAIT_IMAGE\`"; } >> "$GITHUB_STEP_SUMMARY"

  rollback-on-failure:
    name: Roll back failed release
    needs: [promote, verify-opsbot]
    if: ${{ always() && needs.verify-opsbot.result == 'failure' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Restore previous image on deploy branch
        run: scripts/promote-portainer-image.sh opsbot/40-deployment.yaml ghcr.io/chayzx/opsbot "${{ needs.promote.outputs.previous_image }}"
      - name: Wait for Portainer to apply the rollback
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_OPSBOT }}
          WAIT_IMAGE: ${{ needs.promote.outputs.previous_image }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          test -n "$KUBE_CONFIG_B64"
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64"
          echo "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  cloudflared" | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/opsbot.kubeconfig"; chmod 600 "$RUNNER_TEMP/opsbot.kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/opsbot.kubeconfig"
          scripts/assert-kube-target.sh home
          # Portainer polls the deploy branch; allow several poll intervals.
          current=''
          for _ in $(seq 1 90); do
            current="$(kubectl get deployment/opsbot -n opsbot -o jsonpath='{.spec.template.spec.containers[?(@.name=="opsbot")].image}')" || true
            if [ "$current" = "$WAIT_IMAGE" ]; then break; fi
            sleep 10
          done
          if [ "$current" != "$WAIT_IMAGE" ]; then echo "::error::Portainer did not apply $WAIT_IMAGE; live image is $current" >&2; exit 1; fi
          kubectl rollout status deployment/opsbot -n opsbot --timeout=180s
          echo '### Automatic rollback: ✅ completed' >> "$GITHUB_STEP_SUMMARY"
