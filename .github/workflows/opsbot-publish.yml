# Builds opsbot/bot and pushes to GHCR (ghcr.io/chayzx/opsbot), same pattern
# as pantry-bot's publish.yml. Runs entirely on GitHub-hosted runners -- no
# Docker or self-hosted machine required, unlike the old localhost/ side-load
# flow this replaces.
#
# Build-only, deliberately -- deploying is a separate, manually-triggered
# workflow (opsbot-deploy.yml). GitHub's paid-plan-only "required reviewers"
# environment protection isn't available on this private repo's free plan,
# so a workflow_dispatch-only deploy workflow is the free-tier equivalent of
# a "click to deploy" button: build feedback stays automatic on every push,
# but nothing touches the cluster until you click Run workflow.

name: Publish opsbot

on:
  push:
    branches:
      - main
    paths:
      - opsbot/bot/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: opsbot/bot
          push: true
          tags: |
            ghcr.io/chayzx/opsbot:latest
            ghcr.io/chayzx/opsbot:${{ github.sha }}

      - name: Write publish summary
        if: always()
        run: |
          {
            echo '## Opsbot image publish verification'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build/push result: **${{ steps.push.outcome }}**"
            if [ -n "${{ steps.push.outputs.digest }}" ]; then
              echo "- Published digest: \`${{ steps.push.outputs.digest }}\`"
            else
              echo '- Published digest: unavailable (publish did not complete)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
