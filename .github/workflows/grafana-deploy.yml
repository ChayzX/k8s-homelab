# Deploy workflow for the retained self-hosted Grafana instance.
#
# Grafana Cloud is the production observability UI and dashboard destination.
# The local Grafana deployment is retained as a comparison/rollback buffer,
# so this stays MANUAL (workflow_dispatch only) -- a dashboard commit must
# never mutate it automatically.
#
# It applies the dashboard ConfigMaps, the provisioning ConfigMaps and the
# Grafana Deployment. It deliberately applies the Deployment too: on
# 2026-09-21 this file had drifted so far behind the live object that
# applying it would have downgraded Grafana 12.4.2 -> 11.4.0, dropped the
# PantryPostgres datasource password and invalidated every session. Drift
# that large is only possible when nothing ever applies the manifest.

name: Deploy Grafana

on:
  workflow_dispatch: {}

permissions:
  contents: read

# This workflow is rollback-only. Do not let two manual rollback operations
# race the same retained Grafana target.
concurrency:
  group: grafana-rollback
  cancel-in-progress: false

jobs:
  apply-configmap:
    name: 1 - Apply retained local dashboard ConfigMap (manual rollback only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
          CLOUDFLARED_SHA256: "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Open Access-authenticated tunnel to k3s API
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 &
          sleep 3

      - name: Write scoped kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_GRAFANA }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/grafana.kubeconfig"
          chmod 600 "$RUNNER_TEMP/grafana.kubeconfig"

      - name: Apply Grafana dashboard ConfigMap
        id: configmap
        env:
          KUBECONFIG: ${{ runner.temp }}/grafana.kubeconfig
        run: |
          set -euo pipefail
          scripts/assert-kube-target.sh home
          # Server-side apply is REQUIRED, not a preference. Client-side
          # apply stores the whole manifest in the
          # kubectl.kubernetes.io/last-applied-configuration annotation,
          # and annotations are capped at 262144 bytes -- both dashboard
          # ConfigMaps are larger than that, so a plain `kubectl apply`
          # fails with "metadata.annotations: Too long".
          kubectl apply --server-side --force-conflicts \
            -f dashboards/dashboards-configmap.yaml -n observability
          kubectl apply --server-side --force-conflicts \
            -f dashboards/services-configmap.yaml -n observability
          # Provisioning (datasources + dashboard providers) and the
          # Deployment itself, so this repo is the source of truth for the
          # retained Grafana rather than drifting behind it.
          kubectl apply -f observability/grafana-provisioning.yaml -n observability
          kubectl apply -f observability/grafana.yaml -n observability
          echo '### Grafana manifests: ✅ applied' >> "$GITHUB_STEP_SUMMARY"
          echo '- `dashboards/dashboards-configmap.yaml`' >> "$GITHUB_STEP_SUMMARY"
          echo '- `dashboards/services-configmap.yaml`' >> "$GITHUB_STEP_SUMMARY"
          echo '- `observability/grafana-provisioning.yaml`' >> "$GITHUB_STEP_SUMMARY"
          echo '- `observability/grafana.yaml`' >> "$GITHUB_STEP_SUMMARY"

  restart-grafana:
    name: 2 - Restart Grafana pod
    needs: apply-configmap
    runs-on: ubuntu-latest
    outputs:
      previous_pod: ${{ steps.restart.outputs.previous_pod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
          CLOUDFLARED_SHA256: "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Open Access-authenticated tunnel to k3s API
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 &
          sleep 3

      - name: Write scoped kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_GRAFANA }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/grafana.kubeconfig"
          chmod 600 "$RUNNER_TEMP/grafana.kubeconfig"

      - name: Record pod and restart Grafana
        id: restart
        env:
          KUBECONFIG: ${{ runner.temp }}/grafana.kubeconfig
        run: |
          set -euo pipefail
          scripts/assert-kube-target.sh home
          POD="$(kubectl get pods -n observability -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}')"
          echo "previous_pod=$POD" >> "$GITHUB_OUTPUT"
          kubectl rollout restart deployment/grafana -n observability
          echo "Previous pod: $POD"

  verify-grafana:
    name: 3 - Verify rollout and pod health
    needs: restart-grafana
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
          CLOUDFLARED_SHA256: "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
        run: |
          set -euo pipefail
          curl -sSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Open Access-authenticated tunnel to k3s API
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$TUNNEL_SERVICE_TOKEN_ID"
          test -n "$TUNNEL_SERVICE_TOKEN_SECRET"
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 &
          sleep 3

      - name: Write scoped kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_GRAFANA }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/grafana.kubeconfig"
          chmod 600 "$RUNNER_TEMP/grafana.kubeconfig"

      - name: Wait for Grafana rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/grafana.kubeconfig
        run: |
          scripts/assert-kube-target.sh home
          kubectl rollout status deployment/grafana -n observability --timeout=180s

      - name: Verify Grafana pod health
        env:
          KUBECONFIG: ${{ runner.temp }}/grafana.kubeconfig
        run: |
          set -euo pipefail
          POD="$(kubectl get pods -n observability -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}')"
          READY="$(kubectl get pod "$POD" -n observability -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
          STARTED="$(kubectl get pod "$POD" -n observability -o jsonpath='{.status.containerStatuses[?(@.name=="grafana")].state.running.startedAt}')"
          IMAGE_ID="$(kubectl get pod "$POD" -n observability -o jsonpath='{.status.containerStatuses[?(@.name=="grafana")].imageID}')"
          test "$READY" = "True"
          test -n "$STARTED"
          test -n "$IMAGE_ID"
          PREVIOUS_POD='${{ needs.restart-grafana.outputs.previous_pod }}'
          if [ -n "$PREVIOUS_POD" ] && [ "$POD" = "$PREVIOUS_POD" ]; then
            echo "Expected a replacement Grafana pod, but the pod name did not change: $POD" >&2
            exit 1
          fi
          {
            echo '## Grafana deployment pipeline'
            echo ''
            echo '### Dashboard ConfigMap: ✅ passed (apply-configmap job)'
            echo '### Grafana pod restart: ✅ passed (restart-grafana job)'
            echo "- Previous pod: \`${PREVIOUS_POD:-none}\`"
            echo "- Current pod: \`$POD\`"
            echo "- Container started: \`$STARTED\`"
            echo '### Grafana pod health: ✅ passed'
            echo "- Ready condition: \`$READY\`"
            echo "- Image ID: \`$IMAGE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl get deployment/grafana -n observability -o wide
          kubectl get pod "$POD" -n observability -o wide
