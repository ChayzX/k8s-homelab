# A merge to main is the deployment approval. Each merge resolves the latest
# upstream release, applies homelab patches, publishes, and verifies the pod.
name: JMusicBot CI/CD

on:
  push:
    branches: [main]
    paths:
      - jmusicbot/**
      - scripts/patches/**
      - .github/workflows/jmusicbot-deploy.yml
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "MusicBot tag/branch (blank uses arif-banai/MusicBot latest release)"
        required: false
        default: ""

permissions:
  contents: read

# A second release must not race the first release's image/health verification.
concurrency:
  group: jmusicbot-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chayzx/jmusicbot
  # Portainer's jmusicbot workflow watches this branch and is the only deployer.
  DEPLOY_BRANCH: deploy/portainer-home

jobs:
  publish-image:
    name: 1 - Resolve upstream, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout homelab patches
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve upstream and apply required patches
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref='${{ inputs.upstream_ref }}'
          if [ -z "$ref" ]; then ref="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/arif-banai/MusicBot/releases/latest | jq -r .tag_name)"; fi
          test -n "$ref"; test "$ref" != null
          git clone --depth 1 --branch "$ref" https://github.com/arif-banai/MusicBot.git "$RUNNER_TEMP/musicbot"
          git -C "$RUNNER_TEMP/musicbot" apply --check "$GITHUB_WORKSPACE/scripts/patches/voice-channel-text-chat.patch"
          git -C "$RUNNER_TEMP/musicbot" apply "$GITHUB_WORKSPACE/scripts/patches/voice-channel-text-chat.patch"
          git -C "$RUNNER_TEMP/musicbot" apply --check "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-health-endpoint.patch"
          git -C "$RUNNER_TEMP/musicbot" apply "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-health-endpoint.patch"
          git -C "$RUNNER_TEMP/musicbot" apply --check "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-potoken.patch"
          git -C "$RUNNER_TEMP/musicbot" apply "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-potoken.patch"
          git -C "$RUNNER_TEMP/musicbot" apply --check "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-oauth-redaction.patch"
          git -C "$RUNNER_TEMP/musicbot" apply "$GITHUB_WORKSPACE/scripts/patches/jmusicbot-oauth-redaction.patch"
          yts="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/lavalink-devs/youtube-source/releases/latest | jq -r .tag_name | sed 's/^v//')"
          sed -i "s|<youtube-source.version>[^<]*</youtube-source.version>|<youtube-source.version>${yts}</youtube-source.version>|" "$RUNNER_TEMP/musicbot/pom.xml"
          mvn -q -f "$RUNNER_TEMP/musicbot/pom.xml" -DskipTests=false test
          echo "tag=upstream-${ref#v}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Upstream: $ref; youtube-source: $yts"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/musicbot
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=jmusicbot-amd64
          cache-to: type=gha,mode=max,scope=jmusicbot-amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
      # JMusicBot runs only on minecraftmachine (amd64).
      - name: Verify amd64 image
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          OUTPUT="$(docker buildx imagetools inspect "$REF")"
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qE "Platform:[[:space:]]+linux/amd64"; then
            echo "::error::Published image is missing linux/amd64; minecraftmachine could not run it." >&2
            exit 1
          fi
      - name: Publish stage summary
        if: always()
        run: |
          {
            echo '## JMusicBot CI/CD pipeline'; echo '';
            echo '### Resolve/build/publish: ${{ steps.publish.outcome }}';
            echo '- Image: `${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}`';
            echo '### Promote/verify: ▶ continuing (merge to main approved deployment)'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: 2 - Promote image to Portainer deploy branch
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      previous_image: ${{ steps.promote.outputs.previous_image }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Commit image to deploy branch
        id: promote
        env:
          TARGET_IMAGE: ${{ env.IMAGE }}:${{ needs.publish-image.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=jmusicbot/40-deployment-jmusicbot.yaml
          git fetch origin "$DEPLOY_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/deploy" FETCH_HEAD
          previous="$(sed -nE 's|^ +image: (ghcr\.io/chayzx/jmusicbot:[^[:space:]]+).*$|\1|p' "$RUNNER_TEMP/deploy/$manifest")"
          test -n "$previous"
          # The deploy branch mirrors main's manifest; only the image is CI-owned.
          cp "$manifest" "$RUNNER_TEMP/deploy/$manifest"
          sed -i -E "s|^( +image: )ghcr\.io/chayzx/jmusicbot:[^[:space:]]+|\1${TARGET_IMAGE}|" "$RUNNER_TEMP/deploy/$manifest"
          test "$(grep -cF "image: ${TARGET_IMAGE}" "$RUNNER_TEMP/deploy/$manifest")" = 1
          cd "$RUNNER_TEMP/deploy"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$manifest"
          if git diff --cached --quiet; then
            changed=false
          else
            git commit -q -m "jmusicbot: promote ${TARGET_IMAGE##*:}"
            git push origin "HEAD:refs/heads/${DEPLOY_BRANCH}"
            changed=true
          fi
          echo "previous_image=$previous" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo '### Image promoted to deploy branch: ✅' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 3 - Verify Portainer rollout and health (merge deploy)
    needs: [publish-image, promote]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Verify rollout and readiness
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_JMUSICBOT }}
          EXPECTED_TAG: ${{ needs.publish-image.outputs.tag }}
          WAIT_IMAGE: ${{ env.IMAGE }}:${{ needs.publish-image.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
          echo '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  cloudflared' | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/jmusicbot.kubeconfig"; chmod 600 "$RUNNER_TEMP/jmusicbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" scripts/assert-kube-target.sh home
          # Portainer polls the deploy branch; allow several poll intervals.
          current=''
          for _ in $(seq 1 90); do
            current="$(KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl get deployment/jmusicbot -n jmusicbot -o jsonpath='{.spec.template.spec.containers[?(@.name=="jmusicbot")].image}')" || true
            if [ "$current" = "${WAIT_IMAGE}" ]; then break; fi
            sleep 10
          done
          if [ "$current" != "${WAIT_IMAGE}" ]; then echo "::error::Portainer did not apply ${WAIT_IMAGE}; live image is $current" >&2; exit 1; fi
          KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl rollout status deployment/jmusicbot -n jmusicbot --timeout=180s
          pod="$(KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl get pod -n jmusicbot -l app.kubernetes.io/name=jmusicbot -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | awk '{print $1}')"
          test -n "$pod"
          ready="$(KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl get pod "$pod" -n jmusicbot -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
          image="$(KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl get pod "$pod" -n jmusicbot -o jsonpath='{.spec.containers[?(@.name=="jmusicbot")].image}')"
          test "$ready" = True; case "$image" in *"${EXPECTED_TAG}") ;; *) echo "unexpected image: $image" >&2; exit 1 ;; esac
          echo '### Pod health: ✅ passed' >> "$GITHUB_STEP_SUMMARY"
          echo "- Pod: `$pod`; Ready: `$ready`; Image: `$image`" >> "$GITHUB_STEP_SUMMARY"

  rollback-on-failure:
    name: Roll back failed release
    needs: [promote, verify]
    if: ${{ always() && needs.verify.result == 'failure' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Restore previous image on deploy branch
        env:
          TARGET_IMAGE: ${{ needs.promote.outputs.previous_image }}
        run: |
          set -euo pipefail
          manifest=jmusicbot/40-deployment-jmusicbot.yaml
          git fetch origin "$DEPLOY_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/deploy" FETCH_HEAD
          previous="$(sed -nE 's|^ +image: (ghcr\.io/chayzx/jmusicbot:[^[:space:]]+).*$|\1|p' "$RUNNER_TEMP/deploy/$manifest")"
          test -n "$previous"
          # The deploy branch mirrors main's manifest; only the image is CI-owned.
          cp "$manifest" "$RUNNER_TEMP/deploy/$manifest"
          sed -i -E "s|^( +image: )ghcr\.io/chayzx/jmusicbot:[^[:space:]]+|\1${TARGET_IMAGE}|" "$RUNNER_TEMP/deploy/$manifest"
          test "$(grep -cF "image: ${TARGET_IMAGE}" "$RUNNER_TEMP/deploy/$manifest")" = 1
          cd "$RUNNER_TEMP/deploy"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$manifest"
          if git diff --cached --quiet; then
            changed=false
          else
            git commit -q -m "jmusicbot: promote ${TARGET_IMAGE##*:}"
            git push origin "HEAD:refs/heads/${DEPLOY_BRANCH}"
            changed=true
          fi
          echo "previous_image=$previous" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Wait for Portainer to apply the rollback
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_JMUSICBOT }}
          WAIT_IMAGE: ${{ needs.promote.outputs.previous_image }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
          echo '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872  cloudflared' | sha256sum -c -
          chmod +x cloudflared; sudo mv cloudflared /usr/local/bin/
          cloudflared access tcp --hostname k8s-api.greeniespantry.uk --url 127.0.0.1:16443 & sleep 3
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/jmusicbot.kubeconfig"; chmod 600 "$RUNNER_TEMP/jmusicbot.kubeconfig"
          KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" scripts/assert-kube-target.sh home
          # Portainer polls the deploy branch; allow several poll intervals.
          current=''
          for _ in $(seq 1 90); do
            current="$(KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl get deployment/jmusicbot -n jmusicbot -o jsonpath='{.spec.template.spec.containers[?(@.name=="jmusicbot")].image}')" || true
            if [ "$current" = "${WAIT_IMAGE}" ]; then break; fi
            sleep 10
          done
          if [ "$current" != "${WAIT_IMAGE}" ]; then echo "::error::Portainer did not apply ${WAIT_IMAGE}; live image is $current" >&2; exit 1; fi
          KUBECONFIG="$RUNNER_TEMP/jmusicbot.kubeconfig" kubectl rollout status deployment/jmusicbot -n jmusicbot --timeout=180s
          echo '### Automatic rollback: ✅ completed' >> "$GITHUB_STEP_SUMMARY"
