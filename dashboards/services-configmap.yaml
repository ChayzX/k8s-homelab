      {
       "id": 7,
       "type": "stat",
       "title": "Restarts (24h)",
       "gridPos": {
        "h": 4,
        "w": 6,
        "x": 18,
        "y": 6
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"kube-system\", pod=~\"traefik-.*\"}[24h])) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "instant": true
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "auto"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 5
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "id": 8,
       "type": "table",
       "title": "Pod status",
       "gridPos": {
        "h": 8,
        "w": 24,
        "x": 0,
        "y": 10
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "kube_pod_status_phase{namespace=\"kube-system\", pod=~\"traefik-.*\"} == 1",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"kube-system\", pod=~\"traefik-.*\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        },
        {
         "refId": "C",
         "expr": "time() - max by (pod) (kube_pod_start_time{namespace=\"kube-system\", pod=~\"traefik-.*\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        }
       ],
       "transformations": [
        {
         "id": "joinByField",
         "options": {
          "byField": "pod",
          "mode": "outer"
         }
        },
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "Time 1": true,
           "Time 2": true,
           "Time 3": true,
           "__name__": true,
           "job": true,
           "instance": true,
           "uid": true,
           "container": true,
           "endpoint": true,
           "service": true
          },
          "renameByName": {
           "Value #A": "Phase",
           "Value #B": "Restarts",
           "Value #C": "Age (s)",
           "phase": "Phase",
           "namespace": "Namespace",
           "pod": "Pod"
          }
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {}
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "Age (s)"
          },
          "properties": [
           {
            "id": "unit",
            "value": "s"
           }
          ]
         }
        ]
       },
       "options": {
        "showHeader": true
       }
      },
      {
       "id": 9,
       "type": "row",
       "title": "Resources",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 18
       },
       "panels": []
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Memory working set vs limit",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 19
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"kube-system\", pod=~\"traefik-.*\", container!=\"\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"kube-system\", pod=~\"traefik-.*\", resource=\"memory\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "limit \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "fillOpacity": 8,
          "lineWidth": 1
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byRegexp",
           "options": "limit.*"
          },
          "properties": [
           {
            "id": "custom.lineStyle",
            "value": {
             "dash": [
              8,
              8
             ],
             "fill": "dash"
            }
           },
           {
            "id": "custom.fillOpacity",
            "value": 0
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "CPU usage vs limit (cores)",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 19
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"kube-system\", pod=~\"traefik-.*\", container!=\"\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"kube-system\", pod=~\"traefik-.*\", resource=\"cpu\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "limit \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "none",
         "decimals": 3,
         "custom": {
          "fillOpacity": 8,
          "lineWidth": 1
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byRegexp",
           "options": "limit.*"
          },
          "properties": [
           {
            "id": "custom.lineStyle",
            "value": {
             "dash": [
              8,
              8
             ],
             "fill": "dash"
            }
           },
           {
            "id": "custom.fillOpacity",
            "value": 0
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 12,
       "type": "timeseries",
       "title": "Container network I/O",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 27
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"kube-system\", pod=~\"traefik-.*\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "rx \u2014 {{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"kube-system\", pod=~\"traefik-.*\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "tx \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "Bps",
         "custom": {
          "fillOpacity": 8
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 13,
       "type": "timeseries",
       "title": "CPU throttling (% of periods)",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 27
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"kube-system\", pod=~\"traefik-.*\"}[$__rate_interval])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"kube-system\", pod=~\"traefik-.*\"}[$__rate_interval])), 1)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "custom": {
          "fillOpacity": 8
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 14,
       "type": "row",
       "title": "Logs",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 35
       },
       "panels": []
      },
      {
       "id": 15,
       "type": "timeseries",
       "title": "Log volume by level",
       "gridPos": {
        "h": 7,
        "w": 24,
        "x": 0,
        "y": 36
       },
       "datasource": {
        "type": "loki",
        "uid": "${DS_LOKI}"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "loki",
          "uid": "${DS_LOKI}"
         },
         "expr": "sum by (level) (count_over_time({instance=~\"kube-system/(traefik)-.*\"} [$__auto]))",
         "legendFormat": "{{level}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {
          "fillOpacity": 40,
          "stacking": {
           "mode": "normal",
           "group": "A"
          },
          "drawStyle": "bars",
          "lineWidth": 0
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "error"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "red"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "warn"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "orange"
            }
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 16,
       "type": "logs",
       "title": "Logs",
       "gridPos": {
        "h": 12,
        "w": 24,
        "x": 0,
        "y": 43
       },
       "datasource": {
        "type": "loki",
        "uid": "${DS_LOKI}"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "loki",
          "uid": "${DS_LOKI}"
         },
         "expr": "{instance=~\"kube-system/(traefik)-.*\"}"
        }
       ],
       "options": {
        "showTime": true,
        "wrapLogMessage": true,
        "sortOrder": "Descending",
        "enableLogDetails": true
       }
      }
     ]
    }
kind: ConfigMap
metadata:
