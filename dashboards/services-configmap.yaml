apiVersion: v1
data:
  alloy-logs.json: |
    {
     "uid": "svc-alloy-logs",
     "title": "Alloy (log shipper) \u2014 Service Health",
     "description": "Grafana Alloy DaemonSet: ships pod logs to Loki and receives remote-write metrics from Greenie's Windows PC. Site: home. Namespace: observability. Generated by scripts/gen-service-dashboards.py \u2014 edit the registry in that script, not this file.",
     "tags": [
      "service",
      "site:home",
      "ns:observability",
      "generated"
     ],
     "timezone": "browser",
     "editable": true,
     "schemaVersion": 39,
     "version": 1,
     "refresh": "1m",
     "graphTooltip": 1,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "links": [
      {
       "title": "All service dashboards",
       "type": "dashboards",
       "tags": [
        "service"
       ],
       "asDropdown": true,
       "icon": "external link",
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tooltip": "",
       "url": ""
      },
      {
       "title": "Site & Service Health",
       "type": "link",
       "url": "/d/homelab-site-service-health",
       "icon": "dashboard",
       "asDropdown": false,
       "keepTime": true,
       "includeVars": false,
       "tags": [],
       "targetBlank": false,
       "tooltip": ""
      }
     ],
     "templating": {
      "list": [
       {
        "name": "DS_PROMETHEUS",
        "type": "datasource",
        "query": "prometheus",
        "current": {
         "text": "Prometheus",
         "value": "Prometheus"
        },
        "hide": 0,
        "label": "Prometheus",
        "refresh": 1,
        "options": [],
        "regex": ""
       },
       {
        "name": "DS_LOKI",
        "type": "datasource",
        "query": "loki",
        "current": {
         "text": "Loki",
         "value": "Loki"
        },
        "hide": 0,
        "label": "Loki",
        "refresh": 1,
        "options": [],
        "regex": ""
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "type": "row",
       "title": "Alloy (log shipper) \u2014 site: home",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 0
       },
       "panels": []
      },
      {
       "id": 2,
       "type": "text",
       "title": "Service and site",
       "gridPos": {
        "h": 4,
        "w": 24,
        "x": 0,
        "y": 1
       },
       "options": {
        "mode": "markdown",
        "content": "## Alloy (log shipper)\n\n**Site: `home`** \u2014 MinecraftMachine \u2014 the single-node k3s cluster on the home LAN (192.168.40.208). Instrumented by kube-state-metrics, cAdvisor and Alloy/Loki.\n\n**Namespace:** `observability`  |  **DaemonSet(s):** `alloy-logs`\n\nGrafana Alloy DaemonSet: ships pod logs to Loki and receives remote-write metrics from Greenie's Windows PC."
       }
      },
      {
       "id": 3,
       "type": "row",
       "title": "Health",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 5
       },
       "panels": []
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Site",
       "gridPos": {
        "h": 4,
        "w": 6,
        "x": 0,
        "y": 6
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "vector(1)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "instant": true
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "auto"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "home",
             "index": 0
            }
           }
          }
         ],
         "color": {
          "mode": "fixed",
          "fixedColor": "blue"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "text",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "id": 5,
       "type": "stat",
       "title": "Pods Running",
       "gridPos": {
        "h": 4,
        "w": 6,
        "x": 6,
        "y": 6
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(kube_pod_status_phase{namespace=\"observability\", pod=~\"alloy-logs-.*\", phase=\"Running\"}) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "instant": true
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "auto"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "text",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "id": 6,
       "type": "stat",
       "title": "Containers Ready",
       "gridPos": {
        "h": 4,
        "w": 6,
        "x": 12,
        "y": 6
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(kube_pod_container_status_ready{namespace=\"observability\", pod=~\"alloy-logs-.*\"}) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "instant": true
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "auto"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "text",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "id": 7,
       "type": "stat",
       "title": "Restarts (24h)",
       "gridPos": {
        "h": 4,
        "w": 6,
        "x": 18,
        "y": 6
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"}[24h])) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "instant": true
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "auto"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [],
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 5
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "id": 8,
       "type": "table",
       "title": "Pod status",
       "gridPos": {
        "h": 8,
        "w": 24,
        "x": 0,
        "y": 10
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "kube_pod_status_phase{namespace=\"observability\", pod=~\"alloy-logs-.*\"} == 1",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        },
        {
         "refId": "C",
         "expr": "time() - max by (pod) (kube_pod_start_time{namespace=\"observability\", pod=~\"alloy-logs-.*\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "",
         "instant": true,
         "format": "table"
        }
       ],
       "transformations": [
        {
         "id": "joinByField",
         "options": {
          "byField": "pod",
          "mode": "outer"
         }
        },
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "Time 1": true,
           "Time 2": true,
           "Time 3": true,
           "__name__": true,
           "job": true,
           "instance": true,
           "uid": true,
           "container": true,
           "endpoint": true,
           "service": true
          },
          "renameByName": {
           "Value #A": "Phase",
           "Value #B": "Restarts",
           "Value #C": "Age (s)",
           "phase": "Phase",
           "namespace": "Namespace",
           "pod": "Pod"
          }
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {}
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "Age (s)"
          },
          "properties": [
           {
            "id": "unit",
            "value": "s"
           }
          ]
         }
        ]
       },
       "options": {
        "showHeader": true
       }
      },
      {
       "id": 9,
       "type": "row",
       "title": "Resources",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 18
       },
       "panels": []
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Memory working set vs limit",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 19
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"observability\", pod=~\"alloy-logs-.*\", container!=\"\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"observability\", pod=~\"alloy-logs-.*\", resource=\"memory\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "limit \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "fillOpacity": 8,
          "lineWidth": 1
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byRegexp",
           "options": "limit.*"
          },
          "properties": [
           {
            "id": "custom.lineStyle",
            "value": {
             "dash": [
              8,
              8
             ],
             "fill": "dash"
            }
           },
           {
            "id": "custom.fillOpacity",
            "value": 0
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "CPU usage vs limit (cores)",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 19
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"observability\", pod=~\"alloy-logs-.*\", container!=\"\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"observability\", pod=~\"alloy-logs-.*\", resource=\"cpu\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "limit \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "none",
         "decimals": 3,
         "custom": {
          "fillOpacity": 8,
          "lineWidth": 1
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byRegexp",
           "options": "limit.*"
          },
          "properties": [
           {
            "id": "custom.lineStyle",
            "value": {
             "dash": [
              8,
              8
             ],
             "fill": "dash"
            }
           },
           {
            "id": "custom.fillOpacity",
            "value": 0
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 12,
       "type": "timeseries",
       "title": "Container network I/O",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 0,
        "y": 27
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "rx \u2014 {{pod}}"
        },
        {
         "refId": "B",
         "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"}[$__rate_interval]))",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "tx \u2014 {{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "Bps",
         "custom": {
          "fillOpacity": 8
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 13,
       "type": "timeseries",
       "title": "CPU throttling (% of periods)",
       "gridPos": {
        "h": 8,
        "w": 12,
        "x": 12,
        "y": 27
       },
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "targets": [
        {
         "refId": "A",
         "expr": "100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"}[$__rate_interval])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"observability\", pod=~\"alloy-logs-.*\"}[$__rate_interval])), 1)",
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "legendFormat": "{{pod}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "custom": {
          "fillOpacity": 8
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 14,
       "type": "row",
       "title": "Logs",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 35
       },
       "panels": []
      },
      {
       "id": 15,
       "type": "timeseries",
       "title": "Log volume by level",
       "gridPos": {
        "h": 7,
        "w": 24,
        "x": 0,
        "y": 36
       },
       "datasource": {
        "type": "loki",
        "uid": "${DS_LOKI}"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "loki",
          "uid": "${DS_LOKI}"
         },
         "expr": "sum by (level) (count_over_time({instance=~\"observability/(alloy-logs)-.*\"} [$__auto]))",
         "legendFormat": "{{level}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {
          "fillOpacity": 40,
          "stacking": {
           "mode": "normal",
           "group": "A"
          },
          "drawStyle": "bars",
          "lineWidth": 0
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "error"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "red"
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "warn"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "orange"
            }
           }
          ]
         }
        ]
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       }
      },
      {
       "id": 16,
       "type": "logs",
       "title": "Logs",
       "gridPos": {
        "h": 12,
        "w": 24,
        "x": 0,
        "y": 43
       },
       "datasource": {
        "type": "loki",
        "uid": "${DS_LOKI}"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "loki",
          "uid": "${DS_LOKI}"
         },
         "expr": "{instance=~\"observability/(alloy-logs)-.*\"}"
        }
       ],
       "options": {
        "showTime": true,
        "wrapLogMessage": true,
        "sortOrder": "Descending",
        "enableLogDetails": true
       }
      }
     ]
    }
  auth-postgres.json: |
    {
     "uid": "svc-auth-postgres",
     "title": "Authentik Postgres \u2014 Service Health",
     "description": "Postgres backing store for Authentik. Matches every auth-postgresql* StatefulSet variant (primary, standby, return) so the dashboard follows whichever one is currently serving. No postgres_exporter is scraped, so these are container-level signals only. Site: home. Namespace: auth. Generated by scripts/gen-service-dashboards.py \u2014 edit the registry in that script, not this file.",
     "tags": [
      "service",
      "site:home",
      "ns:auth",
      "generated"
     ],
     "timezone": "browser",
     "editable": true,
     "schemaVersion": 39,
     "version": 1,
     "refresh": "1m",
     "graphTooltip": 1,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "links": [
      {
       "title": "All service dashboards",
       "type": "dashboards",
       "tags": [
        "service"
       ],
       "asDropdown": true,
       "icon": "external link",
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tooltip": "",
       "url": ""
      },
      {
       "title": "Site & Service Health",
       "type": "link",
       "url": "/d/homelab-site-service-health",
       "icon": "dashboard",
       "asDropdown": false,
       "keepTime": true,
       "includeVars": false,
       "tags": [],
       "targetBlank": false,
       "tooltip": ""
      }
     ],
     "templating": {
      "list": [
       {
        "name": "DS_PROMETHEUS",
        "type": "datasource",
        "query": "prometheus",
        "current": {
         "text": "Prometheus",
         "value": "Prometheus"
        },
        "hide": 0,
        "label": "Prometheus",
        "refresh": 1,
        "options": [],
        "regex": ""
       },
       {
        "name": "DS_LOKI",
        "type": "datasource",
        "query": "loki",
        "current": {
         "text": "Loki",
         "value": "Loki"
        },
        "hide": 0,
        "label": "Loki",
        "refresh": 1,
        "options": [],
        "regex": ""
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "type": "row",
       "title": "Authentik Postgres \u2014 site: home",
       "collapsed": false,
       "gridPos": {
        "h": 1,
        "w": 24,
        "x": 0,
        "y": 0
       },
       "panels": []
      },
      {
       "id": 2,
       "type": "text",
       "title": "Service and site",
