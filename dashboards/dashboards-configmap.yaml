                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Age" },
                "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 0 }]
              }
            ]
          }
        },
        {
          "id": 8,
          "type": "state-timeline",
          "title": "Pod Readiness Over Time",
          "description": "Red bands are windows where the pod was not ready. Read together with the restart panels: a red band with no restart is a failing readiness probe; a red band with a restart is a crash.",
          "gridPos": { "h": 9, "w": 10, "x": 14, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min by (namespace, pod) (kube_pod_status_ready{namespace=~\"$namespace\", pod=~\"$pod\", condition=\"true\"}) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{label_app_kubernetes_io_name}}"
