              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "NOT SCRAPED",
                      "color": "orange",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
