      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [
        { "name": "DS_PROMETHEUS", "label": "Prometheus", "type": "datasource", "query": "prometheus", "refresh": 1 }
      ] },
      "panels": [
        { "type": "row", "title": "Current state", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        { "id": 1, "type": "stat", "title": "Host Reachable", "description": "Alloy remote-write scrape health for ThePantry. 0/no-data means Alloy on the Windows box has stopped forwarding metrics -- it does not by itself mean the PC is powered off.", "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "up{site=\"windows-remote\", job=\"integrations/windows\"}", "legendFormat": "ThePantry" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN / NOT REPORTING", "color": "red", "index": 0 }, "1": { "text": "UP", "color": "green", "index": 1 } } }], "noValue": "NO DATA", "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] } },
        { "id": 2, "type": "gauge", "title": "CPU Used", "description": "Whole-host CPU used, averaged across all logical cores from the idle-mode counter.", "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "100 * (1 - avg(rate(windows_cpu_time_total{site=\"windows-remote\", mode=\"idle\"}[5m])))", "legendFormat": "CPU" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true }, "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 }] } }, "overrides": [] } },
        { "id": 3, "type": "gauge", "title": "Memory Used", "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "100 * (1 - windows_memory_available_bytes{site=\"windows-remote\"} / windows_memory_physical_total_bytes{site=\"windows-remote\"})", "legendFormat": "memory" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true }, "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 95 }] } }, "overrides": [] } },
        { "id": 4, "type": "stat", "title": "Uptime", "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "time() - windows_system_boot_time_timestamp{site=\"windows-remote\"}", "legendFormat": "uptime" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value_and_name", "colorMode": "value" }, "fieldConfig": { "defaults": { "unit": "dtdurations", "decimals": 1 }, "overrides": [] } },
        { "type": "row", "title": "CPU and memory", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }, "panels": [] },
        { "id": 5, "type": "timeseries", "title": "CPU by Mode", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "100 * avg by (mode) (rate(windows_cpu_time_total{site=\"windows-remote\"}[5m]))", "legendFormat": "{{mode}}" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } } },
        { "id": 6, "type": "timeseries", "title": "Memory Available vs Total", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_memory_available_bytes{site=\"windows-remote\"}", "legendFormat": "available" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_memory_physical_total_bytes{site=\"windows-remote\"}", "legendFormat": "total" }], "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } } },
        { "type": "row", "title": "Disk and network", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 }, "panels": [] },
        { "id": 7, "type": "timeseries", "title": "Disk Used % by Volume", "description": "Label is `volume` (e.g. C:, D:), not `volume_id` -- the draft on the stale branch used the wrong label name for this exporter version.", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "100 * (1 - windows_logical_disk_free_bytes{site=\"windows-remote\"} / windows_logical_disk_size_bytes{site=\"windows-remote\"})", "legendFormat": "{{volume}}" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" } } },
        { "id": 8, "type": "timeseries", "title": "Network Throughput", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "rate(windows_net_bytes_received_total{site=\"windows-remote\"}[5m])", "legendFormat": "{{nic}} received" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "rate(windows_net_bytes_sent_total{site=\"windows-remote\"}[5m])", "legendFormat": "{{nic}} sent" }], "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } } },
        { "type": "row", "title": "Windows host details", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 }, "panels": [] },
        { "id": 9, "type": "timeseries", "title": "Disk Free by Volume", "gridPos": { "h": 7, "w": 12, "x": 0, "y": 25 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_logical_disk_free_bytes{site=\"windows-remote\"}", "legendFormat": "{{volume}}" }], "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" } } },
        { "id": 10, "type": "stat", "title": "Last Boot", "gridPos": { "h": 7, "w": 12, "x": 12, "y": 25 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_system_boot_time_timestamp{site=\"windows-remote\"}", "legendFormat": "boot time" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value" }, "fieldConfig": { "defaults": { "unit": "dateTimeAsIso", "decimals": 0 }, "overrides": [] } },
        { "type": "row", "title": "GPU (NVIDIA GeForce RTX 3070)", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }, "panels": [] },
        { "id": 11, "type": "table", "title": "GPU Adapter", "description": "Identity of the adapter windows_exporter is reporting on, from windows_gpu_info. An info-style metric: the value is always 1, the label set is the payload.", "gridPos": { "h": 5, "w": 24, "x": 0, "y": 33 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_gpu_info{site=\"windows-remote\"}", "format": "table", "instant": true }], "transformations": [{ "id": "organize", "options": { "excludeByName": { "Time": true, "Value": true, "__name__": true, "instance": true, "job": true, "site": true }, "renameByName": { "name": "Adapter", "host": "Host", "device_id": "PCI Device ID", "bus_number": "Bus", "function_number": "Function", "luid": "LUID", "phys": "Physical Adapter Index" } } }], "options": { "showHeader": true, "cellHeight": "sm" }, "fieldConfig": { "defaults": {}, "overrides": [] } },
        { "id": 12, "type": "timeseries", "title": "GPU Engine Utilisation", "description": "windows_gpu_engine_time_seconds is a per-process, per-engine counter; rate() gives fractional engine-seconds/sec (i.e. percent busy) summed across every process, broken out by engine type (3D, Copy, VideoDecode, etc).", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 38 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (host, engtype) (rate(windows_gpu_engine_time_seconds{site=\"windows-remote\"}[5m])) * 100", "legendFormat": "{{host}} {{engtype}}" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0 }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } } },
        { "id": 13, "type": "timeseries", "title": "GPU Adapter Memory", "description": "Dedicated (on-board VRAM), shared (system RAM borrowed by the GPU), and committed (total the adapter has reserved) memory for the whole adapter.", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 38 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_gpu_adapter_memory_dedicated_bytes{site=\"windows-remote\"}", "legendFormat": "dedicated" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_gpu_adapter_memory_shared_bytes{site=\"windows-remote\"}", "legendFormat": "shared" }, { "refId": "C", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "windows_gpu_adapter_memory_committed_bytes{site=\"windows-remote\"}", "legendFormat": "committed" }], "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } } },
        { "id": 14, "type": "timeseries", "title": "Top GPU Memory Consumers (dedicated, by process)", "description": "windows_exporter only labels this by process_id, not process name (no name label is exposed) -- cross-reference the PID with Task Manager on the box if you need to know which application this is. topk(8) keeps the panel readable when many processes touch the GPU.", "gridPos": { "h": 8, "w": 24, "x": 0, "y": 46 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "topk(8, windows_gpu_process_memory_dedicated_bytes{site=\"windows-remote\"})", "legendFormat": "pid {{process_id}}" }], "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } } }
      ]
    }
  host-pc.json: |
    {
      "uid": "homelab-host-pc",
      "title": "Main PC — Bare-Metal Health",
      "description": "Dedicated bare-metal health dashboard for MinecraftMachine. These panels measure the physical host that runs the containers; Kubernetes workload health is intentionally excluded.",
      "tags": [
        "homelab",
        "host",
        "bare-metal"
      ],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1
          },
          {
            "name": "node",
            "label": "Host",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(node_uname_info, instance)",
            "query": {
              "qryType": 1,
              "query": "label_values(node_uname_info, instance)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Host capacity and pressure",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "type": "gauge",
          "title": "CPU Used",
          "description": "Whole-host CPU used percentage (100% means every host thread is busy). Calculated directly from non-idle CPU time.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(node_cpu_seconds_total{instance=\"$node\",mode!=\"idle\"}[5m])) / count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"})) * 100",
              "legendFormat": "CPU used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Memory Used",
          "description": "MemAvailable accounts for reclaimable cache and is the useful host pressure signal.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"$node\"} / node_memory_MemTotal_bytes{instance=\"$node\"}) * 100",
              "legendFormat": "Memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Root Disk Used",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_filesystem_avail_bytes{instance=\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{instance=\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"}) * 100",
              "legendFormat": "/"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Host Uptime",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - node_boot_time_seconds{instance=\"$node\"}",
              "legendFormat": "uptime"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Load Average vs CPU Cores",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_load1{instance=\"$node\"}",
              "legendFormat": "load 1m"
            },
            {
              "refId": "B",
              "expr": "node_load5{instance=\"$node\"}",
              "legendFormat": "load 5m"
            },
            {
              "refId": "C",
              "expr": "count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"}))",
              "legendFormat": "CPU cores"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory Breakdown",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_memory_MemAvailable_bytes{instance=\"$node\"}",
              "legendFormat": "available"
            },
            {
              "refId": "B",
              "expr": "node_memory_Cached_bytes{instance=\"$node\"}",
              "legendFormat": "cached"
            },
            {
              "refId": "C",
              "expr": "node_memory_Buffers_bytes{instance=\"$node\"}",
              "legendFormat": "buffers"
            },
            {
              "refId": "D",
              "expr": "node_memory_MemTotal_bytes{instance=\"$node\"}",
              "legendFormat": "total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Disk Utilisation and Throughput",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(node_disk_io_time_seconds_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m]) * 100",
              "legendFormat": "{{device}} busy %"
            },
            {
              "refId": "B",
              "expr": "rate(node_disk_read_bytes_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m])",
              "legendFormat": "{{device}} read"
            },
            {
              "refId": "C",
              "expr": "rate(node_disk_written_bytes_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m])",
              "legendFormat": "{{device}} write"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Physical Network I/O",
          "description": "Excludes loopback and k3s overlay interfaces so this shows the host NIC load.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(node_network_receive_bytes_total{instance=\"$node\",device!~\"lo|cni.*|flannel.*\"}[5m])",
              "legendFormat": "{{device}} receive"
            },
            {
              "refId": "B",
              "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\",device!~\"lo|cni.*|flannel.*\"}[5m])",
              "legendFormat": "{{device}} transmit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Host Temperatures",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "node_hwmon_temp_celsius{instance=\"$node\"}",
              "legendFormat": "{{chip}} / {{sensor}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          }
        }
      ]
    }
  jmusicbot.json: |
    {
      "uid": "homelab-jmusicbot",
      "title": "jmusicbot — Health & Usage",
      "description": "Kubernetes-visible health, resource use, audio-related network activity, and logs for jmusicbot and its release-notifier. The patched bot exposes an in-cluster /health endpoint used by Kubernetes readiness and Kuma; it does not expose Prometheus application metrics.",
      "tags": ["homelab", "k3s", "jmusicbot"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [
        { "name": "DS_PROMETHEUS", "label": "Prometheus", "type": "datasource", "query": "prometheus", "current": { "selected": true, "text": "Prometheus", "value": "Prometheus" }, "hide": 0, "refresh": 1, "regex": "", "skipUrlSync": false },
        { "name": "DS_LOKI", "label": "Loki", "type": "datasource", "query": "loki", "current": { "selected": true, "text": "Loki", "value": "Loki" }, "hide": 0, "refresh": 1, "regex": "", "skipUrlSync": false }
      ] },
      "panels": [
        { "type": "row", "title": "Kubernetes-visible health", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        { "id": 1, "type": "text", "title": "What this dashboard can show", "gridPos": { "h": 3, "w": 24, "x": 0, "y": 1 }, "options": { "mode": "markdown", "content": "The patched jmusicbot image exposes an in-cluster `/health` endpoint; Kubernetes readiness and Kuma use it. There is still **no Prometheus exporter**, so Discord guild counts, queue length, current track, and YouTube/LavaPlayer state are not available as time series. The panels below use truthful Kubernetes, cAdvisor, network, and Loki signals. **The music-bot readiness stat deliberately excludes the independent release notifier**, so a healthy notifier can never mask a failed bot deployment." } },
        { "id": 2, "type": "table", "title": "Pod Status", "gridPos": { "h": 7, "w": 10, "x": 0, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "(kube_pod_status_phase{namespace=\"jmusicbot\"} == 1) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=\"jmusicbot\"}", "format": "table", "instant": true }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"})", "format": "table", "instant": true }], "transformations": [{ "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } }, { "id": "organize", "options": { "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "__name__": true, "job": true, "instance": true, "namespace": true, "uid": true, "Value #A": true, "pod": true }, "renameByName": { "label_app_kubernetes_io_name": "Pod", "phase": "Phase", "Value #B": "Restarts" }, "indexByName": {} } }], "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" } }, "fieldConfig": { "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } }, "overrides": [] } },
        { "id": 3, "type": "stat", "title": "Restarts (24h)", "description": "All containers in the jmusicbot namespace. Any persistent increase warrants checking the log panel.", "gridPos": { "h": 7, "w": 7, "x": 10, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"}[24h])) or vector(0)", "legendFormat": "restarts" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 1 }, { "color": "red", "value": 2 }] } }, "overrides": [] } },
        { "id": 4, "type": "stat", "title": "Music Bot Deployment Ready", "description": "Available replicas for deployment/jmusicbot only. The release notifier is a separate deployment and cannot keep this panel green while the bot is unavailable. Missing series become an explicit red zero.", "gridPos": { "h": 7, "w": 7, "x": 17, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "max(kube_deployment_status_replicas_available{namespace=\"jmusicbot\", deployment=\"jmusicbot\"}) or vector(0)", "legendFormat": "available" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] } },
        { "type": "row", "title": "Resource usage", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }, "panels": [] },
        { "id": 5, "type": "timeseries", "title": "Memory vs Limit — jmusicbot / release-notifier", "description": "Solid cAdvisor working set, dashed configured limit, dotted request. The bot has a 1Gi limit; release-notifier has a 128Mi limit.", "gridPos": { "h": 9, "w": 12, "x": 0, "y": 12 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{container}} working set" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"jmusicbot\", resource=\"memory\"})", "legendFormat": "{{container}} LIMIT" }, { "refId": "C", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_requests{namespace=\"jmusicbot\", resource=\"memory\"})", "legendFormat": "{{container}} request" }], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false } }, "overrides": [] } },
        { "id": 6, "type": "timeseries", "title": "CPU Usage vs Limit (cores)", "gridPos": { "h": 9, "w": 12, "x": 12, "y": 12 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{container}} usage" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"jmusicbot\", resource=\"cpu\"})", "legendFormat": "{{container}} LIMIT" }], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "none", "min": 0, "decimals": 3, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false, "axisLabel": "cores" } }, "overrides": [] } },
        { "type": "row", "title": "Audio and runtime signals", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }, "panels": [] },
        { "id": 7, "type": "timeseries", "title": "Container Network I/O (audio traffic proxy)", "description": "JMusicBot does not expose track/queue metrics. Network throughput is the closest truthful proxy for active Discord/audio and source traffic; it is not a track counter.", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum by (pod, container) (rate(container_network_receive_bytes_total{namespace=\"jmusicbot\", pod!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}} receive" }, { "refId": "B", "expr": "sum by (pod, container) (rate(container_network_transmit_bytes_total{namespace=\"jmusicbot\", pod!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}} transmit" }], "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] } },
        { "id": 8, "type": "timeseries", "title": "CPU Throttling", "description": "Sustained throttling can cause audio stalls even when total CPU usage looks moderate.", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum by (container) (rate(container_cpu_cfs_throttled_seconds_total{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{container}} throttled seconds/s" }], "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] } },
        { "id": 9, "type": "stat", "title": "Last Termination: OOMKilled", "description": "Containers whose most recent termination reason was OOMKilled. This can remain nonzero after recovery; inspect logs and the restart panel for timing.", "gridPos": { "h": 6, "w": 6, "x": 0, "y": 30 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=\"jmusicbot\", reason=\"OOMKilled\"}) or vector(0)", "legendFormat": "OOMKilled" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] } },
        { "id": 12, "type": "stat", "title": "Containers Waiting / Pull Failures", "description": "Current Kubernetes waiting states across the namespace. The second value isolates ImagePullBackOff, ErrImagePull, invalid images, and container-config failures—the states that produce no application logs because the process never starts.", "gridPos": { "h": 6, "w": 18, "x": 6, "y": 30 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"jmusicbot\"} == 1) or vector(0)", "legendFormat": "all waiting" }, { "refId": "B", "expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"jmusicbot\", reason=~\"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|InvalidImageName\"} == 1) or vector(0)", "legendFormat": "image/config failures" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "horizontal", "textMode": "value_and_name", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] } },
        { "type": "row", "title": "Logs", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 }, "panels": [] },
        { "id": 11, "type": "stat", "title": "Log Lines (24h)", "description": "Independent Loki ingestion check. A nonzero count proves the logs exist even when the raw panel is filtered or the bot has been quiet during the dashboard's selected range. FIXED 2026-09-21 (two issues): (1) this and the panel below hardcoded datasource uid \"Loki\" instead of the ${DS_LOKI} template variable this dashboard already defines but never used here -- works today only because that happens to be the datasource's real UID. (2) there is no `namespace` Loki label any more -- Alloy's current pipeline only produces __stream_shard__/instance/job/level/service_name; pod identity now lives in `instance` = \"namespace/podname:container\".", "gridPos": { "h": 12, "w": 5, "x": 0, "y": 38 }, "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "editorMode": "code", "expr": "sum(count_over_time({instance=~\"jmusicbot/.*\"}[24h])) or vector(0)", "queryType": "instant" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "none", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] } },
        { "id": 10, "type": "logs", "title": "jmusicbot and Release Notifier Logs (last 24h)", "description": "Raw application logs with a panel-level 24-hour lookback. JMusicBot is normally quiet after startup, so a five-minute dashboard range can correctly contain no lines; this panel intentionally keeps enough history visible. Image-pull/config failures appear in the Kubernetes panels above because a container that never starts cannot emit application logs.", "gridPos": { "h": 12, "w": 19, "x": 5, "y": 38 }, "timeFrom": "24h", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "editorMode": "code", "expr": "{instance=~\"jmusicbot/.*\"}", "queryType": "range", "maxLines": 2000 }], "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" }, "fieldConfig": { "defaults": {}, "overrides": [] } }
      ]
    }
  logs.json: |
    {
      "uid": "homelab-logs",
      "title": "Logs — Search & Severity",
      "description": "Log exploration across every pod in the cluster. Filter by severity (the `level` label that Alloy extracts), by namespace/pod, and by free-text regex. The log-volume graph is broken down by level so an error spike is visible before you read a single line.",
      "tags": ["homelab", "k3s", "logs", "loki"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "namespace",
            "label": "Namespace (app)",
            "description": "Each app has its own namespace, so this doubles as the app selector: jmusicbot, pantry-bot, minecraft, observability, kube-system, etc. FIXED 2026-09-21: Alloy's current log pipeline (observability/alloy-logs-home.yaml) does not promote a `namespace` Loki label at all -- verified live, /loki/api/v1/labels currently returns only __stream_shard__, instance, job, level, service_name. Every pod's identity now lives in one composite label, `instance` = \"namespace/podname:container\". Rather than guess at a static namespace list (which would drift, the same mistake apps.json made), this variable queries Prometheus's kube_pod_status_phase namespace label instead -- unaffected by the Loki change -- and the LogQL below matches it as an instance-prefix regex.",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_status_phase, namespace)",
            "query": { "qryType": 1, "query": "label_values(kube_pod_status_phase, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod (instance = namespace/pod:container)",
            "description": "FIXED 2026-09-21: there is no separate `pod` Loki label any more (see the namespace variable's description). This now lists the full `instance` label value -- \"namespace/podname:container\" -- scoped to the selected namespace(s), and the LogQL below matches it directly with instance=~\"$pod\" rather than a bare pod name.",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({instance=~\"($namespace)/.*\"}, instance)",
            "query": {
              "label": "instance",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{instance=~\"($namespace)/.*\"}",
              "type": 1
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "level",
            "label": "Severity",
            "description": "Wired straight into the LogQL stream selector as level=~\"$level\". 'All' uses the regex .* which also matches lines Alloy could not classify (no level label at all).",
            "type": "custom",
            "query": "debug,info,warn,error",
            "options": [
              { "selected": false, "text": "debug", "value": "debug" },
              { "selected": false, "text": "info", "value": "info" },
              { "selected": false, "text": "warn", "value": "warn" },
              { "selected": false, "text": "error", "value": "error" }
            ],
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "search",
            "label": "Search (regex, case-insensitive)",
            "description": "Applied as a line filter: |~ \"(?i)<your text>\". Leave empty to match everything. RE2 syntax — e.g.  timeout|refused  or  player.*joined",
            "type": "textbox",
            "query": "",
            "current": { "selected": false, "text": "", "value": "" },
            "options": [],
            "hide": 0,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Summary for the selected time range",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Lines matching current filter",
          "description": "Honours namespace, pod, severity and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "lines"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "ERROR lines",
          "description": "Deliberately ignores the Severity variable — this always counts level=\"error\" so it stays meaningful no matter how the filter above is set. It does still honour namespace, pod and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "WARN lines",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"warn\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "warnings"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "#EAB839" }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Unclassified lines (no level label)",
          "description": "Streams where Alloy did not extract a level at all — LogQL matcher level=\"\". These lines are INVISIBLE to any severity filter, so a large number here means the severity filter is not to be trusted for that app and its parsing pipeline needs a regex/json stage. Expect some from k8s system components.",
          "gridPos": { "h": 5, "w": 5, "x": 15, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "unclassified"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pods logging",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "count(sum by (pod) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "pods"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "noValue": "0", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Volume over time",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Log Volume by Severity",
          "description": "Stacked bars, one colour per level (error = red, warn = amber, info = blue, debug = grey, unclassified = dark grey). An error spike is a red block that stands out against everything else. Uses $__auto for the range interval so the bar width follows the dashboard time range.",
          "gridPos": { "h": 9, "w": 14, "x": 0, "y": 7 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (level) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "{{level}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["sum", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false,
                "barAlignment": 0,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "error" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byName", "options": "warn" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#EAB839" } }]
              },
              {
                "matcher": { "id": "byName", "options": "info" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "semi-dark-blue" } }]
              },
              {
                "matcher": { "id": "byName", "options": "debug" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#5A6172" } }]
              },
              {
                "matcher": { "id": "byName", "options": "{}" },
                "properties": [
                  { "id": "displayName", "value": "unclassified" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "#3E4249" } }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Error & Warning Volume by Pod",
          "description": "Which pod is producing the errors. Ignores the Severity variable on purpose. FIXED 2026-09-21: grouped by the `instance` label (namespace/pod:container) instead of `app_kubernetes_io_name`, which is not a Loki label -- Alloy's current discovery.relabel stage (observability/alloy-logs-home.yaml) does not promote any Kubernetes pod labels into Loki, only job/instance/service_name/level exist.",
          "gridPos": { "h": 9, "w": 10, "x": 14, "y": 7 },
