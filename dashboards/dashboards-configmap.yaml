              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(node_network_receive_bytes_total{instance=\"$node\", device=~\"cni0|flannel.*\"}[5m])",
              "legendFormat": "{{device}} rx"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\", device=~\"cni0|flannel.*\"}[5m])",
              "legendFormat": "{{device}} tx"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "k3s control plane & cluster state",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 66 },
          "panels": []
        },
        {
          "id": 22,
          "type": "stat",
          "title": "kube-system Pods Not Ready",
          "description": "NOTE: on k3s, the apiserver, scheduler and controller-manager run inside the single k3s process — they are NOT pods, so there are no kube_pod_* series for them. What this counts is the add-on control plane that IS podded: coredns, local-path-provisioner, metrics-server. If k3s itself is down, this panel goes stale rather than red — use 'Node Ready' at the top of the dashboard for that.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(kube_pod_status_ready{namespace=\"kube-system\", condition=\"true\"} == 0) or vector(0)",
              "legendFormat": "not ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Prometheus Scrape Targets Down",
          "description": "count(up == 0). Catches the failure mode where a dashboard looks 'fine' only because its exporter stopped being scraped — e.g. the native node_exporter on :9100 or minecraft_exporter on :9202.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(up == 0) or vector(0)",
              "legendFormat": "down"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 24,
          "type": "stat",
          "title": "Node Pressure Conditions Active",
          "description": "MemoryPressure / DiskPressure / PIDPressure. Any of these true means the kubelet is already taking defensive action (refusing to schedule, evicting, or garbage-collecting images).",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure|PIDPressure\", status=\"true\"}) or vector(0)",
              "legendFormat": "active"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 25,
          "type": "stat",
          "title": "Running Pods / Pod Capacity",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "running"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_node_status_allocatable{resource=\"pods\"})",
              "legendFormat": "capacity"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 26,
          "type": "table",
          "title": "kube-system Pods",
          "description": "Phase and restart count for the podded part of the k3s control plane.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 71 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "label_replace(kube_pod_status_phase{namespace=\"kube-system\"} == 1, \"pod_short\", \"$1\", \"pod\", \"^(.+?)(-[a-z0-9]{6,12})?-[a-z0-9]{5}$\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "label_replace(sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"kube-system\"}), \"pod_short\", \"$1\", \"pod\", \"^(.+?)(-[a-z0-9]{6,12})?-[a-z0-9]{5}$\")",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "uid": true,
                  "pod": true,
                  "pod_short 2": true,
                  "Value #A": true
                },
                "renameByName": { "pod_short": "Pod", "phase": "Phase", "Value #B": "Restarts" },
                "indexByName": {}
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Restarts", "desc": true }] } }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Running": { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "Succeeded": { "color": "blue", "index": 1 } } },
                      { "type": "value", "options": { "Pending": { "color": "orange", "index": 2 } } },
                      { "type": "value", "options": { "Failed": { "color": "red", "index": 3 } } },
                      { "type": "value", "options": { "Unknown": { "color": "red", "index": 4 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Restarts" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 },
                        { "color": "red", "value": 5 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "id": 27,
          "type": "timeseries",
          "title": "kube-system Container Restarts (rolling 1h)",
          "description": "Anything other than a flat zero here means a control-plane add-on is crash-looping. CoreDNS restarting right after install is the classic ufw-FORWARD-DROP symptom.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 71 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=\"kube-system\"}[1h]))",
              "legendFormat": "{{container}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Temperatures",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 80 },
          "panels": []
        },
        {
          "id": 28,
          "type": "timeseries",
          "title": "Temperatures",
          "description": "k10temp = Ryzen CPU, nvme = the NVMe (currently holding a dd'd live installer, not in use by k3s), acpitz = chassis. From node_exporter's hwmon collector.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 81 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_hwmon_temp_celsius{instance=\"$node\"} * on(chip, instance) group_left(chip_name) node_hwmon_chip_names{instance=\"$node\"}",
              "legendFormat": "{{chip_name}} {{sensor}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
  logs.json: |
    {
      "uid": "homelab-logs",
      "title": "Logs — Search & Severity",
      "description": "Log exploration across every pod in the cluster. Filter by severity (the `level` label that promtail's pipeline_stages extracts), by namespace/pod, and by free-text regex. The log-volume graph is broken down by level so an error spike is visible before you read a single line.",
      "tags": ["homelab", "k3s", "logs", "loki"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "namespace",
            "label": "Namespace (app)",
            "description": "Each app has its own namespace, so this doubles as the app selector: jmusicbot, pantry-bot, minecraft, observability, keel, kube-system.",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values(namespace)",
            "query": { "label": "namespace", "refId": "LokiVariableQueryEditor-VariableQuery", "stream": "", "type": 1 },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({namespace=~\"$namespace\"}, pod)",
            "query": {
              "label": "pod",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=~\"$namespace\"}",
              "type": 1
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "level",
            "label": "Severity",
            "description": "Wired straight into the LogQL stream selector as level=~\"$level\". 'All' uses the regex .* which also matches lines promtail could not classify (no level label at all).",
            "type": "custom",
            "query": "debug,info,warn,error",
            "options": [
              { "selected": false, "text": "debug", "value": "debug" },
              { "selected": false, "text": "info", "value": "info" },
              { "selected": false, "text": "warn", "value": "warn" },
              { "selected": false, "text": "error", "value": "error" }
            ],
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "search",
            "label": "Search (regex, case-insensitive)",
            "description": "Applied as a line filter: |~ \"(?i)<your text>\". Leave empty to match everything. RE2 syntax — e.g.  timeout|refused  or  player.*joined",
            "type": "textbox",
            "query": "",
            "current": { "selected": false, "text": "", "value": "" },
            "options": [],
            "hide": 0,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Summary for the selected time range",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Lines matching current filter",
          "description": "Honours namespace, pod, severity and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "lines"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "ERROR lines",
          "description": "Deliberately ignores the Severity variable — this always counts level=\"error\" so it stays meaningful no matter how the filter above is set. It does still honour namespace, pod and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "WARN lines",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"warn\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "warnings"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "#EAB839" }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Unclassified lines (no level label)",
          "description": "Streams where promtail's pipeline_stages did not extract a level at all — LogQL matcher level=\"\". These lines are INVISIBLE to any severity filter, so a large number here means the severity filter is not to be trusted for that app and its promtail pipeline needs a regex/json stage. Expect some from k8s system components.",
          "gridPos": { "h": 5, "w": 5, "x": 15, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "unclassified"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pods logging",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "count(sum by (pod) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "pods"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "noValue": "0", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Volume over time",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Log Volume by Severity",
          "description": "Stacked bars, one colour per level (error = red, warn = amber, info = blue, debug = grey, unclassified = dark grey). An error spike is a red block that stands out against everything else. Uses $__auto for the range interval so the bar width follows the dashboard time range.",
          "gridPos": { "h": 9, "w": 14, "x": 0, "y": 7 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (level) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "{{level}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["sum", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false,
                "barAlignment": 0,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "error" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byName", "options": "warn" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#EAB839" } }]
              },
              {
                "matcher": { "id": "byName", "options": "info" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "semi-dark-blue" } }]
              },
              {
                "matcher": { "id": "byName", "options": "debug" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#5A6172" } }]
              },
              {
                "matcher": { "id": "byName", "options": "{}" },
                "properties": [
                  { "id": "displayName", "value": "unclassified" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "#3E4249" } }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Error & Warning Volume by Pod",
          "description": "Which pod is producing the errors. Ignores the Severity variable on purpose.",
          "gridPos": { "h": 9, "w": 10, "x": 14, "y": 7 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (namespace, app_kubernetes_io_name) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "ERROR {{namespace}}/{{app_kubernetes_io_name}}"
            },
            {
              "refId": "B",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (namespace, app_kubernetes_io_name) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"warn\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "warn {{namespace}}/{{app_kubernetes_io_name}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "^ERROR .*" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "^warn .*" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#EAB839" } }]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Logs",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "panels": []
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Logs (namespace + pod + severity + search)",
          "description": "The full filter chain: {namespace=~\"$namespace\", pod=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\". Click a line to expand its labels; use the label values there to narrow the variables above.",
          "gridPos": { "h": 17, "w": 17, "x": 0, "y": 17 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\"",
              "queryType": "range",
              "maxLines": 2000
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Top Error Producers (this range)",
          "description": "topk(10) by error-line count. Ignores the Severity variable.",
          "gridPos": { "h": 17, "w": 7, "x": 17, "y": 17 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "topk(10, sum by (namespace, app_kubernetes_io_name) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{namespace}}/{{app_kubernetes_io_name}}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "top",
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "noValue": "No errors in range",
              "color": { "mode": "continuous-YlRd" }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Errors Only — every selected namespace (severity filter bypassed)",
          "description": "A permanently error-scoped view so you never have to remember to set the Severity variable. Still honours namespace, pod and the search box.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 34 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", level=\"error\"} |~ \"(?i)$search\"",
              "queryType": "range",
              "maxLines": 1000
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        }
      ]
    }
  pods-and-workloads.json: |
    {
      "uid": "homelab-pods-workloads",
      "title": "Pods & Workloads — Usage vs Limits",
      "description": "Per-namespace / per-pod resource usage plotted against each pod's CONFIGURED LIMIT, so headroom is visible rather than inferred. Usage from kubelet's built-in cAdvisor endpoint; limits, phase, readiness and restart counts from kube-state-metrics.",
      "tags": ["homelab", "k3s", "workloads"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info, namespace)",
            "query": {
              "qryType": 1,
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": {
              "selected": true,
              "text": ["observability", "jmusicbot", "pantry-bot", "minecraft", "keel"],
              "value": ["observability", "jmusicbot", "pantry-bot", "minecraft", "keel"]
            },
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "query": {
              "qryType": 1,
              "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\", phase=\"Running\"}) or vector(0)",
              "legendFormat": "running"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "green" } },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pending / Failed / Unknown",
          "description": "A pod stuck Pending on this single node almost always means it cannot be scheduled — insufficient allocatable memory, or a hostPort already held (3001/3002 were the known collisions during migration).",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\", phase=~\"Pending|Failed|Unknown\"}) or vector(0)",
              "legendFormat": "not running"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Containers Not Ready",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(kube_pod_container_status_ready{namespace=~\"$namespace\", pod=~\"$pod\"} == 0) or vector(0)",
              "legendFormat": "not ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"}[1h])) or vector(0)",
              "legendFormat": "restarts"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "OOMKill Events (24h)",
          "description": "container_oom_events_total from kubelet's cAdvisor endpoint. On a 15 GiB host with an 8 GiB Minecraft limit this is the metric that tells you the memory budget was wrong. KNOWN CAVEAT: this counter has been reported as never incrementing on some runtimes — cross-check against the 'Last Termination Reason' table below, which is sourced independently from kube-state-metrics.",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(increase(container_oom_events_total{namespace=~\"$namespace\", pod=~\"$pod\"}[24h])) or vector(0)",
              "legendFormat": "oomkills"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Peak Memory vs Limit (worst pod)",
          "description": "The highest current memory-vs-limit ratio across the selected pods. This is the single number that answers 'how close am I to an OOMKill right now'.",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "max(\n  sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\", container!=\"POD\"})\n  /\n  sum by (namespace, pod, container) (kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\"})\n) * 100",
              "legendFormat": "worst"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Pod Status",
          "description": "Phase, readiness and cumulative restarts for every selected pod.",
          "gridPos": { "h": 9, "w": 14, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "(kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\"} == 1) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min by (pod) (kube_pod_status_ready{namespace=~\"$namespace\", pod=~\"$pod\", condition=\"true\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "time() - max by (pod) (kube_pod_start_time{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true,
                  "Value #A": true,
                  "pod": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "label_app_kubernetes_io_name": "Pod",
                  "phase": "Phase",
                  "Value #B": "Restarts",
                  "Value #C": "Ready",
                  "Value #D": "Age"
                },
                "indexByName": {}
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Restarts", "desc": true }] } }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": true } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Running": { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "Succeeded": { "color": "blue", "index": 1 } } },
                      { "type": "value", "options": { "Pending": { "color": "orange", "index": 2 } } },
                      { "type": "value", "options": { "Failed": { "color": "red", "index": 3 } } },
                      { "type": "value", "options": { "Unknown": { "color": "red", "index": 4 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Ready" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "NOT READY", "color": "red", "index": 0 } } },
                      { "type": "value", "options": { "1": { "text": "Ready", "color": "green", "index": 1 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Restarts" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 },
                        { "color": "red", "value": 5 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Age" },
                "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 0 }]
              }
            ]
          }
        },
        {
          "id": 8,
          "type": "state-timeline",
          "title": "Pod Readiness Over Time",
          "description": "Red bands are windows where the pod was not ready. Read together with the restart panels: a red band with no restart is a failing readiness probe; a red band with a restart is a crash.",
