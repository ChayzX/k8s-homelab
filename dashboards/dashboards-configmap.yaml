      "panels": [
        {
          "type": "row",
          "title": "Service health — deployments & pod phases",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "table",
          "title": "Deployment Replicas (desired vs available)",
          "description": "Every app in this cluster is a Deployment with strategy: Recreate and a single replica. Desired 1 / available 0 means the replacement pod has not come up after the old one released its RWO PVC.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_spec_replicas",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_available",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_unavailable",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "deployment", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "deployment": "Deployment",
                  "Value #A": "Desired",
                  "Value #B": "Available",
                  "Value #C": "Unavailable"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": true } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Unavailable" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "Pod Status by Namespace",
          "description": "Per-namespace pod phases plus container restarts in the last rolling hour. CrashLoopBackOff is not a pod phase in kube-state-metrics -- a crash loop shows up here as a Pending/Not-Running pod whose namespace is already racking up restarts. FIXED 2026-09-21: the Pending and Failed/Unknown queries now fall back to a zeroed copy of the Running series, so a namespace with none in that phase shows 0 instead of an empty cell -- an empty cell is indistinguishable from a broken query.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count by (namespace) (kube_pod_status_phase{phase=\"Running\"} == 1)",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count by (namespace) (kube_pod_status_phase{phase=\"Pending\"} == 1) or count by (namespace) (kube_pod_status_phase{phase=\"Running\"} == 1) * 0",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count by (namespace) (kube_pod_status_phase{phase=~\"Failed|Unknown\"} == 1) or count by (namespace) (kube_pod_status_phase{phase=\"Running\"} == 1) * 0",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total[1h]))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "namespace", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "Value #A": "Running",
                  "Value #B": "Pending",
                  "Value #C": "Failed/Unknown",
                  "Value #D": "Restarts (1h)"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": true } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Pending" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Failed/Unknown" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Restarts (1h)" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 },
                        { "color": "red", "value": 3 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Node health — MinecraftMachine (bare metal, 8c/16t, 15 GiB)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "panels": []
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Node CPU Usage",
          "description": "Whole-host CPU, all 16 threads averaged. Includes the desktop session and any non-k8s process — not just pods.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(node_cpu_seconds_total{instance=\"$node\", mode!=\"idle\"}[5m])) / count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"})) * 100",
              "legendFormat": "CPU"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Node Memory Used",
          "description": "1 - MemAvailable/MemTotal. MemAvailable already discounts reclaimable page cache, so this is the number that matters for eviction risk.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "(1 - (node_memory_MemAvailable_bytes{instance=\"$node\"} / node_memory_MemTotal_bytes{instance=\"$node\"})) * 100",
              "legendFormat": "Memory"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 88 }
                ]
              }
            },
            "overrides": []
