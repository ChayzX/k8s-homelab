                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 },
                        { "color": "red", "value": 3 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Node health — MinecraftMachine (bare metal, 8c/16t, 15 GiB)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "panels": []
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Node CPU Usage",
          "description": "Whole-host CPU, all 16 threads averaged. Includes the desktop session and any non-k8s process — not just pods.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(node_cpu_seconds_total{instance=\"$node\", mode!=\"idle\"}[5m])) / count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"})) * 100",
              "legendFormat": "CPU"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
