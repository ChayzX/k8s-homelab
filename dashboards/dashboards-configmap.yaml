          "title": "Current runtime activity",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Runtime claims (1h)",
          "description": "pantry_bot_runtime_claims_total: work items (kind=event/outbox) claimed off a lane for processing in the last hour, summed across every lane (worker, twitch.chat, twitch.channel_points, twitch.moderation).",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(pantry_bot_runtime_claims_total[1h])) or vector(0)", "legendFormat": "claims" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "value_and_name", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Runtime completions (1h)",
          "description": "pantry_bot_runtime_completions_total for the same lanes. Persistently trailing claims by a wide margin across a range longer than the lane's expected processing time is the honest signal of a stuck queue.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(pantry_bot_runtime_completions_total[1h])) or vector(0)", "legendFormat": "completions" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "value_and_name", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Chat commands (1h)",
          "description": "pantry_bot_commands_total: successfully handled chat commands (gift, grab, pantry, pantrycommands, snack, steal, ...) in the last hour, from the chat-worker service.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(pantry_bot_commands_total[1h])) or vector(0)", "legendFormat": "commands" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "value_and_name", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "text", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "bargauge",
          "title": "Outstanding claims by lane (all-time claims minus completions)",
          "description": "Both are monotonic counters, so claims-total minus completions-total approximates the current backlog per lane assuming each claim eventually completes exactly once. A counter reset (pod restart) briefly understates this; treat a single dip as noise and a sustained climb as a real backlog.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (lane) (pantry_bot_runtime_claims_total) - on (lane) sum by (lane) (pantry_bot_runtime_completions_total)", "legendFormat": "{{lane}}" }
          ],
          "options": { "orientation": "horizontal", "displayMode": "gradient", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 5 }, { "color": "red", "value": 25 }] } }, "overrides": [] }
        },
        {
          "type": "row",
          "title": "Runtime event flow (claims vs. completions, by lane)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "panels": []
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Runtime claims by lane (15m rate)",
          "description": "kind=event is the chat-worker's internal event queue; kind=outbox with a twitch.* lane is the dispatcher's outbound-message outbox per Twitch API surface.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (kind, lane) (rate(pantry_bot_runtime_claims_total[15m]))", "legendFormat": "{{kind}}/{{lane}}" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 3, "min": 0, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": false } }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Runtime completions by lane (15m rate)",
          "description": "Same lanes as the claims panel. A lane whose completion rate falls well below its claim rate for a sustained period is backing up.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (kind, lane) (rate(pantry_bot_runtime_completions_total[15m]))", "legendFormat": "{{kind}}/{{lane}}" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 3, "min": 0, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": false } }, "overrides": [] }
        },
        {
          "type": "row",
          "title": "Chat command activity",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Commands by name (15m rate)",
          "description": "Successfully handled chat commands, split by command name, from the chat-worker service.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (command) (rate(pantry_bot_commands_total[15m]))", "legendFormat": "{{command}}" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 3, "min": 0, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 12, "showPoints": "never", "spanNulls": false } }, "overrides": [] }
        },
        {
          "type": "row",
          "title": "HA service health (live)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "panels": []
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Ready PantryBot pods",
          "description": "Current ready pods in the pantry-bot namespace, across every microservice (worker, dispatcher, gateway, api, sites, cloudflared, postgres).",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_ready{namespace=\"pantry-bot\",condition=\"true\"})", "legendFormat": "ready" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value_and_name" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "PantryBot container restarts",
          "description": "Restarts in the pantry-bot namespace; useful during failover and recovery.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"pantry-bot\"}[1h]))", "legendFormat": "{{pod}}/{{container}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "PantryBot CPU and memory",
          "description": "Current resource use for pantry-bot pods from kubelet cAdvisor.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"pantry-bot\",container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "{{pod}} CPU" },
            { "refId": "B", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"pantry-bot\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}} memory" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        }
      ]
    }
  pantry-bot.json: |
    {
      "uid": "homelab-pantry-bot",
      "title": "Pantry Bot — Health",
      "description": "Operational health of the pantry-bot Twitch bot (namespace pantry-bot): uptime, resources, restarts, readiness, and Loki error logs. Application usage counters are on the separate Pantry Bot Usage dashboard.",
      "tags": ["homelab", "k3s", "pantry-bot"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 3,
      "refresh": "15s",
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod (instance = namespace/pod:container)",
            "description": "Drills into one pod when a Deployment briefly has two during a Recreate rollout. FIXED 2026-09-21: there is no `namespace` or `pod` Loki label any more -- Alloy's current pipeline (observability/alloy-logs-home.yaml) only produces __stream_shard__/instance/job/level/service_name, verified live. Every pod's identity now lives in one composite label, `instance` = \"namespace/podname:container\" -- e.g. pantry-bot/pantry-chat-worker-xxxx:worker. This variable lists the full instance values under the pantry-bot namespace, and the LogQL below matches instance=~\"$pod\" directly.",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({instance=~\"pantry-bot/.*\"}, instance)",
            "query": {
              "label": "instance",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{instance=~\"pantry-bot/.*\"}",
              "type": 1
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "level",
            "label": "Severity",
            "description": "Wired straight into the LogQL stream selector as level=~\"$level\". 'All' uses the regex .* which also matches lines Alloy could not classify (no level label at all). The ERROR panels ignore this variable on purpose so 'how many errors right now' never depends on resetting the filter.",
            "type": "custom",
            "query": "debug,info,warn,error",
            "options": [
              { "selected": false, "text": "debug", "value": "debug" },
              { "selected": false, "text": "info", "value": "info" },
              { "selected": false, "text": "warn", "value": "warn" },
              { "selected": false, "text": "error", "value": "error" }
            ],
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "At a glance — up, restarting, or erroring?",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "HA workload uptime (oldest pod)",
          "description": "Age of the oldest live PantryBot HA workload pod. The retired single-bot Deployment is intentionally excluded.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "time() - min(kube_pod_start_time{namespace=\"pantry-bot\", pod=~\"pantry-.*\"})",
              "legendFormat": "uptime"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "decimals": 1, "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Restarts (24h)",
          "description": "Cumulative restarts across both containers (bot + cloudflared) in the last 24h. The bot's livenessProbe failureThreshold is 5 (150s of continuous failure) specifically because a restart here means real downtime. Frequent restarts are worth chasing down, not shrugging off.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"pantry-bot\"}[24h])) or vector(0)",
              "legendFormat": "restarts"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Replicas — Desired vs Ready",
          "description": "kube_deployment_spec_replicas vs kube_deployment_status_replicas_available for both Deployments in the namespace. With strategy: Recreate and a single replica each, ready < desired means the replacement pod has not come up after the old one released its RWO PVC — that is what 'bot is down' looks like from Kubernetes' point of view.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_spec_replicas{namespace=\"pantry-bot\"}",
              "legendFormat": "{{deployment}} desired"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_available{namespace=\"pantry-bot\"}",
              "legendFormat": "{{deployment}} ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "ERROR lines (this range)",
          "description": "Deliberately ignores the Severity variable — this always counts level=\"error\" so it stays meaningful no matter how the filter is set. Honors the Pod variable. Caveat: pantry-bot logs are plain console output with no structured severity, so Alloy classifies them by keyword heuristic — a line is only counted here if it positively matched error vocabulary (error/exception/fatal, unhandled rejection, or a libuv errno like ENOTFOUND).",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"$pod\", level=\"error\"} [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "CPU & memory — actual usage vs requests vs limits",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "panels": []
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memory Working Set vs Limit / Request — per container",
          "description": "Solid = actual working set (the number the cgroup OOM killer compares against, from cAdvisor container_memory_working_set_bytes). Dashed = configured limit, dotted = request. bot: 256Mi limit / 128Mi request; cloudflared: 128Mi / 64Mi. The 256Mi limit is the hard ceiling — a container at its limit is OOM-killed outright (pods cannot swap on cgroup v2).",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"pantry-bot\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{container}} working set"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"pantry-bot\", resource=\"memory\"})",
              "legendFormat": "{{container}} LIMIT"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (kube_pod_container_resource_requests{namespace=\"pantry-bot\", resource=\"memory\"})",
              "legendFormat": "{{container}} request"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*LIMIT$" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [12, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 2 }
                ]
              },
              {
                "matcher": { "id": "byRegexp", "options": ".*request$" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dot", "dash": [2, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              }
            ]
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU Usage vs Limit — per container (cores)",
          "description": "Solid = rate of container_cpu_usage_seconds_total from cAdvisor. Dashed = configured CPU limit. bot: 250m; cloudflared: 200m. Values are CPU cores (1.0 = one full core of the 16 available).",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"pantry-bot\", container!=\"\", container!=\"POD\"}[5m]))",
              "legendFormat": "{{container}} usage"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"pantry-bot\", resource=\"cpu\"})",
              "legendFormat": "{{container}} LIMIT"
            }
          ],
          "options": {
