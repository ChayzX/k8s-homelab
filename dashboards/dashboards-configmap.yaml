            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\", device!~\"lo|veth.*|docker.*|br-.*|cni0|flannel.*|cali.*|kube-.*|virbr.*\"}[5m])",
              "legendFormat": "{{device}} tx"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Cluster Overlay Network (cni0 / flannel.1)",
          "description": "Pod-to-pod and pod-to-service traffic. If this is flat at zero while pods are clearly talking, suspect the ufw FORWARD policy (DEFAULT_FORWARD_POLICY=DROP) blackholing 10.42.0.0/16.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 58 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(node_network_receive_bytes_total{instance=\"$node\", device=~\"cni0|flannel.*\"}[5m])",
              "legendFormat": "{{device}} rx"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\", device=~\"cni0|flannel.*\"}[5m])",
              "legendFormat": "{{device}} tx"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "k3s control plane & cluster state",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 66 },
          "panels": []
        },
        {
          "id": 22,
          "type": "stat",
          "title": "kube-system Pods Not Ready",
          "description": "NOTE: on k3s, the apiserver, scheduler and controller-manager run inside the single k3s process — they are NOT pods, so there are no kube_pod_* series for them. What this counts is the add-on control plane that IS podded: coredns, local-path-provisioner, metrics-server. If k3s itself is down, this panel goes stale rather than red — use 'Node Ready' at the top of the dashboard for that.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(kube_pod_status_ready{namespace=\"kube-system\", condition=\"true\"} == 0) or vector(0)",
              "legendFormat": "not ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Prometheus Scrape Targets Down",
          "description": "count(up == 0). Catches the failure mode where a dashboard looks 'fine' only because its exporter stopped being scraped — e.g. the native node_exporter on :9100 or minecraft_exporter on :9202.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(up == 0) or vector(0)",
              "legendFormat": "down"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 24,
          "type": "stat",
          "title": "Node Pressure Conditions Active",
          "description": "MemoryPressure / DiskPressure / PIDPressure. Any of these true means the kubelet is already taking defensive action (refusing to schedule, evicting, or garbage-collecting images).",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure|PIDPressure\", status=\"true\"}) or vector(0)",
              "legendFormat": "active"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 25,
          "type": "stat",
          "title": "Running Pods / Pod Capacity",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 67 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": "running"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_node_status_allocatable{resource=\"pods\"})",
              "legendFormat": "capacity"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 26,
          "type": "table",
          "title": "kube-system Pods",
          "description": "Phase and restart count for the podded part of the k3s control plane.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 71 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "label_replace(kube_pod_status_phase{namespace=\"kube-system\"} == 1, \"pod_short\", \"$1\", \"pod\", \"^(.+?)(-[a-z0-9]{6,12})?-[a-z0-9]{5}$\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "label_replace(sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"kube-system\"}), \"pod_short\", \"$1\", \"pod\", \"^(.+?)(-[a-z0-9]{6,12})?-[a-z0-9]{5}$\")",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "uid": true,
                  "pod": true,
                  "pod_short 2": true,
                  "Value #A": true
                },
                "renameByName": { "pod_short": "Pod", "phase": "Phase", "Value #B": "Restarts" },
                "indexByName": {}
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Restarts", "desc": true }] } }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Running": { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "Succeeded": { "color": "blue", "index": 1 } } },
                      { "type": "value", "options": { "Pending": { "color": "orange", "index": 2 } } },
                      { "type": "value", "options": { "Failed": { "color": "red", "index": 3 } } },
                      { "type": "value", "options": { "Unknown": { "color": "red", "index": 4 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Restarts" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "#EAB839", "value": 1 },
                        { "color": "red", "value": 5 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "id": 27,
          "type": "timeseries",
          "title": "kube-system Container Restarts (rolling 1h)",
          "description": "Anything other than a flat zero here means a control-plane add-on is crash-looping. CoreDNS restarting right after install is the classic ufw-FORWARD-DROP symptom.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 71 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (increase(kube_pod_container_status_restarts_total{namespace=\"kube-system\"}[1h]))",
              "legendFormat": "{{container}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Temperatures",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 80 },
          "panels": []
        },
        {
          "id": 28,
          "type": "timeseries",
          "title": "Temperatures",
          "description": "k10temp = Ryzen CPU, nvme = the NVMe (currently holding a dd'd live installer, not in use by k3s), acpitz = chassis. From node_exporter's hwmon collector.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 81 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_hwmon_temp_celsius{instance=\"$node\"} * on(chip, instance) group_left(chip_name) node_hwmon_chip_names{instance=\"$node\"}",
              "legendFormat": "{{chip_name}} {{sensor}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
  host-pc.json: |
    {
      "uid": "homelab-host-pc",
      "title": "Main PC — Bare-Metal Health",
      "description": "Dedicated bare-metal health dashboard for MinecraftMachine. These panels measure the physical host that runs the containers; Kubernetes workload health is intentionally excluded.",
      "tags": ["homelab", "host", "bare-metal"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          { "name": "DS_PROMETHEUS", "label": "Prometheus", "type": "datasource", "query": "prometheus", "refresh": 1 },
          { "name": "node", "label": "Host", "type": "query", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "definition": "label_values(node_uname_info, instance)", "query": { "qryType": 1, "query": "label_values(node_uname_info, instance)", "refId": "PrometheusVariableQueryEditor-VariableQuery" }, "refresh": 1, "includeAll": false, "multi": false, "sort": 1 }
        ]
      },
      "panels": [
        { "type": "row", "title": "Host capacity and pressure", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        { "id": 1, "type": "gauge", "title": "CPU Used", "description": "Whole-host CPU used percentage (100% means every host thread is busy). Calculated directly from non-idle CPU time.", "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum(rate(node_cpu_seconds_total{instance=\"$node\",mode!=\"idle\"}[5m])) / count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"})) * 100", "legendFormat": "CPU used" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 }] } }, "overrides": [] }, "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true } },
        { "id": 2, "type": "gauge", "title": "Memory Used", "description": "MemAvailable accounts for reclaimable cache and is the useful host pressure signal.", "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "(1 - node_memory_MemAvailable_bytes{instance=\"$node\"} / node_memory_MemTotal_bytes{instance=\"$node\"}) * 100", "legendFormat": "Memory" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 95 }] } }, "overrides": [] }, "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true } },
        { "id": 3, "type": "gauge", "title": "Root Disk Used", "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "(1 - node_filesystem_avail_bytes{instance=\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{instance=\"$node\",mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"}) * 100", "legendFormat": "/" }], "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } }, "overrides": [] }, "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true } },
        { "id": 4, "type": "stat", "title": "Host Uptime", "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "time() - node_boot_time_seconds{instance=\"$node\"}", "legendFormat": "uptime" }], "fieldConfig": { "defaults": { "unit": "dtdurations", "decimals": 1 }, "overrides": [] }, "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "value_and_name", "colorMode": "value" } },
        { "id": 5, "type": "timeseries", "title": "Load Average vs CPU Cores", "gridPos": { "h": 7, "w": 12, "x": 0, "y": 6 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "node_load1{instance=\"$node\"}", "legendFormat": "load 1m" }, { "refId": "B", "expr": "node_load5{instance=\"$node\"}", "legendFormat": "load 5m" }, { "refId": "C", "expr": "count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"}))", "legendFormat": "CPU cores" }], "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }, "options": { "legend": { "displayMode": "table", "placement": "bottom" } } },
        { "id": 6, "type": "timeseries", "title": "Memory Breakdown", "gridPos": { "h": 7, "w": 12, "x": 12, "y": 6 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "node_memory_MemAvailable_bytes{instance=\"$node\"}", "legendFormat": "available" }, { "refId": "B", "expr": "node_memory_Cached_bytes{instance=\"$node\"}", "legendFormat": "cached" }, { "refId": "C", "expr": "node_memory_Buffers_bytes{instance=\"$node\"}", "legendFormat": "buffers" }, { "refId": "D", "expr": "node_memory_MemTotal_bytes{instance=\"$node\"}", "legendFormat": "total" }], "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] } },
        { "id": 7, "type": "timeseries", "title": "Disk Utilisation and Throughput", "gridPos": { "h": 7, "w": 12, "x": 0, "y": 13 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "rate(node_disk_io_time_seconds_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m]) * 100", "legendFormat": "{{device}} busy %" }, { "refId": "B", "expr": "rate(node_disk_read_bytes_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m])", "legendFormat": "{{device}} read" }, { "refId": "C", "expr": "rate(node_disk_written_bytes_total{instance=\"$node\",device!~\"loop.*|dm-.*\"}[5m])", "legendFormat": "{{device}} write" }], "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] } },
        { "id": 8, "type": "timeseries", "title": "Physical Network I/O", "description": "Excludes loopback and k3s overlay interfaces so this shows the host NIC load.", "gridPos": { "h": 7, "w": 12, "x": 12, "y": 13 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "rate(node_network_receive_bytes_total{instance=\"$node\",device!~\"lo|cni.*|flannel.*\"}[5m])", "legendFormat": "{{device}} receive" }, { "refId": "B", "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\",device!~\"lo|cni.*|flannel.*\"}[5m])", "legendFormat": "{{device}} transmit" }], "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] } },
        { "id": 9, "type": "timeseries", "title": "Host Temperatures", "gridPos": { "h": 7, "w": 24, "x": 0, "y": 20 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "node_hwmon_temp_celsius{instance=\"$node\"}", "legendFormat": "{{chip}} / {{sensor}}" }], "fieldConfig": { "defaults": { "unit": "celsius" }, "overrides": [] } }
      ]
    }
  jmusicbot.json: |
    {
      "uid": "homelab-jmusicbot",
      "title": "jmusicbot — Health & Usage",
      "description": "Kubernetes-visible health, resource use, audio-related network activity, and logs for jmusicbot and its release-notifier. The patched bot exposes an in-cluster /health endpoint used by Kubernetes readiness and Kuma; it does not expose Prometheus application metrics.",
      "tags": ["homelab", "k3s", "jmusicbot"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [
        { "name": "DS_PROMETHEUS", "label": "Prometheus", "type": "datasource", "query": "prometheus", "current": { "selected": true, "text": "Prometheus", "value": "Prometheus" }, "hide": 0, "refresh": 1, "regex": "", "skipUrlSync": false },
        { "name": "DS_LOKI", "label": "Loki", "type": "datasource", "query": "loki", "current": { "selected": true, "text": "Loki", "value": "Loki" }, "hide": 0, "refresh": 1, "regex": "", "skipUrlSync": false }
      ] },
      "panels": [
        { "type": "row", "title": "Kubernetes-visible health", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        { "id": 1, "type": "text", "title": "What this dashboard can show", "gridPos": { "h": 3, "w": 24, "x": 0, "y": 1 }, "options": { "mode": "markdown", "content": "The patched jmusicbot image exposes an in-cluster `/health` endpoint; Kubernetes readiness and Kuma use it. There is still **no Prometheus exporter**, so Discord guild counts, queue length, current track, and YouTube/LavaPlayer state are not available as time series. The panels below use truthful Kubernetes, cAdvisor, network, and Loki signals. **The music-bot readiness stat deliberately excludes the independent release notifier**, so a healthy notifier can never mask a failed bot deployment." } },
        { "id": 2, "type": "table", "title": "Pod Status", "gridPos": { "h": 7, "w": 10, "x": 0, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "(kube_pod_status_phase{namespace=\"jmusicbot\"} == 1) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=\"jmusicbot\"}", "format": "table", "instant": true }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"})", "format": "table", "instant": true }], "transformations": [{ "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } }, { "id": "organize", "options": { "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "__name__": true, "job": true, "instance": true, "namespace": true, "uid": true, "Value #A": true, "pod": true }, "renameByName": { "label_app_kubernetes_io_name": "Pod", "phase": "Phase", "Value #B": "Restarts" }, "indexByName": {} } }], "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" } }, "fieldConfig": { "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } }, "overrides": [] } },
        { "id": 3, "type": "stat", "title": "Restarts (24h)", "description": "All containers in the jmusicbot namespace. Any persistent increase warrants checking the log panel.", "gridPos": { "h": 7, "w": 7, "x": 10, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"}[24h])) or vector(0)", "legendFormat": "restarts" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 1 }, { "color": "red", "value": 2 }] } }, "overrides": [] } },
        { "id": 4, "type": "stat", "title": "Music Bot Deployment Ready", "description": "Available replicas for deployment/jmusicbot only. The release notifier is a separate deployment and cannot keep this panel green while the bot is unavailable. Missing series become an explicit red zero.", "gridPos": { "h": 7, "w": 7, "x": 17, "y": 4 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "max(kube_deployment_status_replicas_available{namespace=\"jmusicbot\", deployment=\"jmusicbot\"}) or vector(0)", "legendFormat": "available" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } }, "overrides": [] } },
        { "type": "row", "title": "Resource usage", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }, "panels": [] },
        { "id": 5, "type": "timeseries", "title": "Memory vs Limit — jmusicbot / release-notifier", "description": "Solid cAdvisor working set, dashed configured limit, dotted request. The bot has a 1Gi limit; release-notifier has a 128Mi limit.", "gridPos": { "h": 9, "w": 12, "x": 0, "y": 12 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{container}} working set" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"jmusicbot\", resource=\"memory\"})", "legendFormat": "{{container}} LIMIT" }, { "refId": "C", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_requests{namespace=\"jmusicbot\", resource=\"memory\"})", "legendFormat": "{{container}} request" }], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false } }, "overrides": [] } },
        { "id": 6, "type": "timeseries", "title": "CPU Usage vs Limit (cores)", "gridPos": { "h": 9, "w": 12, "x": 12, "y": 12 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{container}} usage" }, { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"jmusicbot\", resource=\"cpu\"})", "legendFormat": "{{container}} LIMIT" }], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "none", "min": 0, "decimals": 3, "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false, "axisLabel": "cores" } }, "overrides": [] } },
        { "type": "row", "title": "Audio and runtime signals", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }, "panels": [] },
        { "id": 7, "type": "timeseries", "title": "Container Network I/O (audio traffic proxy)", "description": "JMusicBot does not expose track/queue metrics. Network throughput is the closest truthful proxy for active Discord/audio and source traffic; it is not a track counter.", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum by (pod, container) (rate(container_network_receive_bytes_total{namespace=\"jmusicbot\", pod!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}} receive" }, { "refId": "B", "expr": "sum by (pod, container) (rate(container_network_transmit_bytes_total{namespace=\"jmusicbot\", pod!=\"\"}[5m]))", "legendFormat": "{{pod}}/{{container}} transmit" }], "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] } },
        { "id": 8, "type": "timeseries", "title": "CPU Throttling", "description": "Sustained throttling can cause audio stalls even when total CPU usage looks moderate.", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum by (container) (rate(container_cpu_cfs_throttled_seconds_total{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{container}} throttled seconds/s" }], "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] } },
        { "id": 9, "type": "stat", "title": "Last Termination: OOMKilled", "description": "Containers whose most recent termination reason was OOMKilled. This can remain nonzero after recovery; inspect logs and the restart panel for timing.", "gridPos": { "h": 6, "w": 6, "x": 0, "y": 30 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=\"jmusicbot\", reason=\"OOMKilled\"}) or vector(0)", "legendFormat": "OOMKilled" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "background", "graphMode": "none" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] } },
        { "id": 12, "type": "stat", "title": "Containers Waiting / Pull Failures", "description": "Current Kubernetes waiting states across the namespace. The second value isolates ImagePullBackOff, ErrImagePull, invalid images, and container-config failures—the states that produce no application logs because the process never starts.", "gridPos": { "h": 6, "w": 18, "x": 6, "y": 30 }, "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "targets": [{ "refId": "A", "expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"jmusicbot\"} == 1) or vector(0)", "legendFormat": "all waiting" }, { "refId": "B", "expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"jmusicbot\", reason=~\"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|InvalidImageName\"} == 1) or vector(0)", "legendFormat": "image/config failures" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "horizontal", "textMode": "value_and_name", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] } },
        { "type": "row", "title": "Logs", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 }, "panels": [] },
        { "id": 11, "type": "stat", "title": "Log Lines (24h)", "description": "Independent Loki ingestion check. A nonzero count proves the logs exist even when the raw panel is filtered or the bot has been quiet during the dashboard's selected range.", "gridPos": { "h": 12, "w": 5, "x": 0, "y": 38 }, "datasource": { "type": "loki", "uid": "Loki" }, "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "Loki" }, "editorMode": "code", "expr": "sum(count_over_time({namespace=\"jmusicbot\"}[24h])) or vector(0)", "queryType": "instant" }], "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "none", "graphMode": "none", "justifyMode": "auto" }, "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] } },
        { "id": 10, "type": "logs", "title": "jmusicbot and Release Notifier Logs (last 24h)", "description": "Raw application logs with a panel-level 24-hour lookback. JMusicBot is normally quiet after startup, so a five-minute dashboard range can correctly contain no lines; this panel intentionally keeps enough history visible. Image-pull/config failures appear in the Kubernetes panels above because a container that never starts cannot emit application logs.", "gridPos": { "h": 12, "w": 19, "x": 5, "y": 38 }, "timeFrom": "24h", "datasource": { "type": "loki", "uid": "Loki" }, "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "Loki" }, "editorMode": "code", "expr": "{namespace=\"jmusicbot\"}", "queryType": "range", "maxLines": 2000 }], "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" }, "fieldConfig": { "defaults": {}, "overrides": [] } }
      ]
