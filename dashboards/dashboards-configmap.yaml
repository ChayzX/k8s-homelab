        {
          "id": 9,
          "type": "timeseries",
          "title": "Scheduled Pod Memory Requests vs Allocatable",
          "description": "What the k3s scheduler thinks it has committed. Allocatable is already reduced by system-reserved=3Gi. If requests approach allocatable, new pods go Pending — that is a scheduling failure, distinct from the host actually running out of RAM.",
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\"} * on(namespace, pod) group_left() max by (namespace, pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "legendFormat": "Requested (running pods)"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "ALLOCATABLE"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_limits{resource=\"memory\"} * on(namespace, pod) group_left() max by (namespace, pod) (kube_pod_status_phase{phase=\"Running\"} == 1))",
              "legendFormat": "Sum of limits (worst case)"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "ALLOCATABLE" },
