                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "deployment": "Deployment",
