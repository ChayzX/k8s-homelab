          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "ALLOCATABLE" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [12, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Sum of limits (worst case)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dot", "dash": [2, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 }
