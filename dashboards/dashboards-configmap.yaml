# Grafana dashboard content ConfigMap.
#
# THIS FILE IS THE SOURCE OF TRUTH for dashboard JSON, and it is
# GENERATED, not hand-edited. Each key below is the verbatim contents of
# the matching file in this directory (/home/chase/k8s-homelab/dashboards/),
# produced with:
#
#   cd /home/chase/k8s-homelab/dashboards && kubectl create configmap grafana-dashboards \
#     -n observability \
#     --from-file=cluster-overview.json=cluster-overview.json \
#     --from-file=pods-and-workloads.json=pods-and-workloads.json \
#     --from-file=logs.json=logs.json \
#     --from-file=apps.json=apps.json \
#     --dry-run=client -o yaml
#
# Re-run that command and replace the `data:` block below (or `kubectl
# apply -f -` its output directly) any time a dashboard JSON file
# changes -- do not hand-edit the embedded JSON here, it will drift from
# the .json files that are the actual editable source.
#
# This ConfigMap REPLACES the `.placeholder` stub of the same name that
# ships in grafana-provisioning.yaml (see
# /home/chase/k8s-homelab/observability/grafana-provisioning.yaml) --
# apply this file after that one, or apply this file's content again
# any time grafana-provisioning.yaml's placeholder has been reapplied.
#
# Grafana's `dashboards.yaml` provider (defined in
# grafana-provisioning.yaml, provider path /etc/grafana/dashboards)
# picks up every key here as one dashboard, using each JSON's own `uid`
# and `title` fields -- filenames are irrelevant to Grafana, they're
# just ConfigMap keys.
#
# SIZE: total embedded JSON is ~136 KiB (4 dashboards). The etcd/API
# object-size ceiling for a single ConfigMap is 1 MiB, so this is not
# close to needing a split. If dashboards are added later and this
# approaches ~900 KiB, split by dashboard (one ConfigMap per file, or
# grouped) and add one volume + volumeMount per ConfigMap in
# observability/grafana.yaml -- do not silently truncate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
  annotations:
    homelab.local/generated-from: k8s-homelab/dashboards
data:
  apps.json: |
    {
      "uid": "homelab-apps",
      "title": "Apps — Minecraft / jmusicbot / pantry-bot",
      "description": "App-specific panels for the three bespoke workloads. Only Minecraft has a real application-level exporter (RCON-based); jmusicbot and pantry-bot have no scraped app metrics, so their sections are honestly limited to Kubernetes-visible signals (pod status, restarts, memory vs limit, readiness). See individual panel descriptions for exactly what each metric does and does not tell you.",
      "tags": ["homelab", "k3s", "apps"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Minecraft — RCON-based exporter (TPS, players, world size); memory via cAdvisor, not psutil",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Server Up",
          "description": "minecraft_server_up, from minecraft_exporter's RCON poll (in-cluster now, via the minecraft-rcon ClusterIP Service). 1 = RCON connected successfully.",
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_server_up", "legendFormat": "up" }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "UP", "color": "green", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Players Online / Max",
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_players_online", "legendFormat": "online" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_players_max", "legendFormat": "max" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "TPS (1m)",
          "description": "20.0 is perfect. Below 15 is visibly laggy (mob AI, redstone, block breaking slow down); below 10 is severe. Heap is capped at -Xmx6G (down from 12G) as of this migration -- if TPS regresses versus the old Docker deployment, check the JVM Memory panel below before assuming it's unrelated.",
          "gridPos": { "h": 4, "w": 6, "x": 10, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_tps_1m", "legendFormat": "tps" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 20,
              "decimals": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "#EAB839", "value": 15 }, { "color": "green", "value": 19 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Pod Memory vs 8Gi Limit",
          "description": "container_memory_working_set_bytes for the minecraft container, from kubelet's cAdvisor endpoint -- NOT the old minecraft_process_memory_bytes gauge. That gauge is gone: it came from psutil reading the java process's RSS from outside the container's PID namespace, which does not work once the process is containerized. This is the cgroup working-set number, which is what the OOM killer actually compares against the 8Gi limit. Heap is -Xmx6G, so 2Gi of headroom above the heap ceiling is expected for JVM overhead (metaspace, off-heap, native buffers) -- watch this trend after a few days of real play per the migration plan's verification step.",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\"})"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "max": 8589934592,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 6442450944 },
                  { "color": "red", "value": 7301444813 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "TPS Over Time (1m / 5m / 15m)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_tps_1m", "legendFormat": "1m" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_tps_5m", "legendFormat": "5m" },
            { "refId": "C", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_tps_15m", "legendFormat": "15m" }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 20,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod Memory vs Limit Over Time",
          "description": "Solid = working set (cAdvisor). Dashed = 8Gi limit. Dotted = 3Gi request. A second dashed reference at 6Gi marks the -Xmx heap ceiling, so you can see how much of the gap above it is JVM overhead vs actual growth.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\"})",
              "legendFormat": "working set"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\", resource=\"memory\"})",
              "legendFormat": "LIMIT (8Gi)"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\", resource=\"memory\"})",
              "legendFormat": "request (3Gi)"
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "vector(6442450944)",
              "legendFormat": "-Xmx6G heap ceiling"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "LIMIT (8Gi)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [12, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 2 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "request (3Gi)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dot", "dash": [2, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "-Xmx6G heap ceiling" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [4, 4] } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 2 }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Players Online Over Time",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_players_online", "legendFormat": "players" }],
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false, "calcs": [] }, "tooltip": { "mode": "single", "sort": "none" } },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "color": { "mode": "fixed", "fixedColor": "green" },
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 40, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU Usage vs Limit (cores)",
          "description": "Request 2 cores, limit 6 cores. cAdvisor rate of container_cpu_usage_seconds_total.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\"}[5m]))",
              "legendFormat": "usage"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"minecraft\", pod=~\"minecraft-.*\", container=\"minecraft\", resource=\"cpu\"})",
              "legendFormat": "LIMIT (6 cores)"
            }
          ],
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "decimals": 2,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false, "axisLabel": "cores" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "LIMIT (6 cores)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [12, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              }
            ]
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "World Size on Disk",
          "description": "minecraft_world_size_bytes, checked every 10 minutes (not continuously -- walking thousands of small region files on every 15s poll would be wasteful and would itself add HDD load). A sudden jump can indicate world corruption/duplication, not just normal exploration growth.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "minecraft_world_size_bytes", "legendFormat": "{{world}}" }],
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Pod Restarts (24h)",
          "description": "There is deliberately NO livenessProbe on the minecraft container -- a wedged JVM restarting mid-tick would risk world corruption, which is a worse outcome than a hung server. So this number will not self-heal a hang; readinessProbe alone drives traffic/RCON gating. A restart here means either an OOMKill (see cluster/pods dashboards) or the container process actually exiting.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"minecraft\"}[24h])) or vector(0)", "legendFormat": "restarts" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 1 }, { "color": "red", "value": 2 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Minecraft Server Logs",
          "description": "Paper/Log4j format, level extracted by promtail. Use the Logs dashboard for full severity-filter/search controls -- this is a fixed quick view scoped to this pod.",
          "gridPos": { "h": 10, "w": 24, "x": 6, "y": 20 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "expr": "{namespace=\"minecraft\"}", "maxLines": 1000 }],
          "options": { "showTime": true, "showLabels": false, "showCommonLabels": false, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "type": "row",
          "title": "jmusicbot — no application metrics exist; pod-level signals only",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "panels": []
        },
        {
          "id": 12,
          "type": "text",
          "title": "About this section",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 31 },
          "options": {
            "mode": "markdown",
            "content": "jmusicbot is a Discord bot with **no Prometheus exporter or metrics endpoint** -- it never had one on Docker either. There is no TODO to \"add\" a real metric here; the honest state is that the only signal available is what Kubernetes itself observes about the pod (running/not, restarts, memory). `release-notifier` (GitHub release poller, posts to Discord) is included below since it shares the namespace."
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Pod Status (jmusicbot namespace)",
          "gridPos": { "h": 7, "w": 10, "x": 0, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "(kube_pod_status_phase{namespace=\"jmusicbot\"} == 1) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=\"jmusicbot\"}", "format": "table", "instant": true },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"})", "format": "table", "instant": true }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "__name__": true, "job": true, "instance": true, "namespace": true, "uid": true, "Value #A": true, "pod": true },
                "renameByName": { "label_app_kubernetes_io_name": "Pod", "phase": "Phase", "Value #B": "Restarts" },
                "indexByName": {}
              }
            }
          ],
          "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" } },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Phase" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Running": { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "Pending": { "color": "orange", "index": 1 } } },
                      { "type": "value", "options": { "Failed": { "color": "red", "index": 2 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Restarts" },
                "properties": [
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 1 }, { "color": "red", "value": 5 }] } },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Memory vs Limit — jmusicbot (1Gi) / release-notifier (128Mi)",
          "gridPos": { "h": 7, "w": 14, "x": 10, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"jmusicbot\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{container}}"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (container) (kube_pod_container_resource_limits{namespace=\"jmusicbot\", resource=\"memory\"})",
              "legendFormat": "{{container}} LIMIT"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*LIMIT$" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [12, 6] } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 2 }
                ]
              }
            ]
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "jmusicbot Restarts (rolling 1h)",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"jmusicbot\"}[1h]))", "legendFormat": "{{container}}" }],
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "type": "logs",
          "title": "jmusicbot Logs",
          "description": "Java/Log4j format. Watch here for the exact YouTube itag-18 decode failure this deployment is a workaround for (see the deployment manifest's CUSTOM-BUILD-NOTE) -- 'Something went wrong when decoding the track' is the signature string.",
          "gridPos": { "h": 12, "w": 12, "x": 12, "y": 41 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "expr": "{namespace=\"jmusicbot\"}", "maxLines": 1000 }],
          "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "type": "row",
          "title": "pantry-bot — Twitch bot; no app metrics, readiness is the only 'is it healthy' signal",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 53 },
          "panels": []
        },
        {
          "id": 17,
          "type": "text",
          "title": "About HTTP health here",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 54 },
          "options": {
            "mode": "markdown",
            "content": "pantry-bot has **no `/health` or `/healthz` endpoint** -- `GET /` returns a bare 404 (verified through the live tunnel). The k8s probes are `exec` checks (`node -e \"require('http').get(...)\"`) reproducing the old Compose healthcheck's \"any response, even a 404, proves the server is alive\" logic, specifically *because* an `httpGet` probe would treat that same 404 as a failure and crash-loop a healthy pod. That means there is no Prometheus series for HTTP health -- the panels below (readiness, restarts) are the only signal Kubernetes can give us, sourced from the exec probe's pass/fail via kube-state-metrics. **TODO for real HTTP health visibility:** add `app.get('/healthz', (_req, res) => res.status(200).send('ok'))` to the bot (noted as the preferred fix in `pantry-bot/40-deployment.yaml`), switch the probes to `httpGet`, and this dashboard could then plot actual request latency/status if the route is later instrumented with `prom-client`. Until then, do not invent a metric name for this."
          }
        },
        {
          "id": 18,
          "type": "stat",
          "title": "Readiness (proxy for HTTP health)",
          "description": "kube_pod_status_ready, condition=true. This reflects the exec probe passing, which only proves the Node HTTP server on :3000 accepted a TCP connection and returned any response -- not that Twitch auth, the SQLite DB, or the Cloudflare tunnel are functioning.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 58 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "min(kube_pod_status_ready{namespace=\"pantry-bot\", condition=\"true\"})", "legendFormat": "ready" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "NOT READY", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "READY", "color": "green", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Restarts (24h)",
          "description": "livenessProbe failureThreshold is 5 (150s of continuous failure) specifically because a restart here means real downtime -- strategy: Recreate + a single RWO SQLite PVC means the old pod fully terminates before the new one mounts. Frequent restarts are worth chasing down, not shrugging off.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 58 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"pantry-bot\", container=\"bot\"}[24h])) or vector(0)", "legendFormat": "restarts" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 1 }, { "color": "red", "value": 2 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "type": "gauge",
          "title": "bot Memory vs 256Mi Limit",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 58 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(container_memory_working_set_bytes{namespace=\"pantry-bot\", container=\"bot\"})" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "max": 268435456,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "#EAB839", "value": 201326592 }, { "color": "red", "value": 228065280 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "type": "stat",
          "title": "cloudflared Sidecar Up",
          "description": "The Cloudflare tunnel container in the same pod. If pantry-bot itself is Ready but this container has restarted, the Twitch bot may be running with no public ingress at all.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 58 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{ "refId": "A", "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "min(kube_pod_container_status_running{namespace=\"pantry-bot\", container=\"cloudflared\"})", "legendFormat": "running" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "auto", "colorMode": "background", "graphMode": "none", "justifyMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "UP", "color": "green", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 22,
          "type": "logs",
          "title": "pantry-bot Logs (bot + cloudflared)",
          "description": "Node.js format for the bot container; cloudflared has its own plain-text log format. Both share the pod's namespace label.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 63 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [{ "refId": "A", "datasource": { "type": "loki", "uid": "${DS_LOKI}" }, "expr": "{namespace=\"pantry-bot\"}", "maxLines": 1000 }],
          "options": { "showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        }
      ]
    }
  cluster-overview.json: |
    {
      "uid": "homelab-cluster-overview",
      "title": "Host Health / Cluster Overview — Node & k3s Control Plane",
      "description": "Node-level health for MinecraftMachine (single-node k3s). Metrics come from the NATIVE node_exporter binary at 192.168.40.208:9100 — there is deliberately no node-exporter DaemonSet, so 'node' here means the real bare-metal host, not a container view of it.",
      "tags": ["homelab", "k3s", "node", "host"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "node",
            "label": "node_exporter instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(node_uname_info, instance)",
            "query": {
              "qryType": 1,
              "query": "label_values(node_uname_info, instance)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "sort": 1,
            "hide": 0,
            "current": {},
            "skipUrlSync": false
          },
          {
            "name": "disk",
            "label": "Disk device",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(node_disk_io_time_seconds_total{instance=\"$node\", device=~\"sd[a-z]|nvme[0-9]n[0-9]\"}, device)",
            "query": {
              "qryType": 1,
              "query": "label_values(node_disk_io_time_seconds_total{instance=\"$node\", device=~\"sd[a-z]|nvme[0-9]n[0-9]\"}, device)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": {},
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Node health — MinecraftMachine (bare metal, 8c/16t, 15 GiB)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "gauge",
          "title": "CPU Usage",
          "description": "Whole-host CPU, all 16 threads averaged. Includes the desktop session and any non-k8s process — not just pods.",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=\"$node\", mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Memory Used",
          "description": "1 - MemAvailable/MemTotal. MemAvailable already discounts reclaimable page cache, so this is the number that matters for eviction risk.",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "(1 - (node_memory_MemAvailable_bytes{instance=\"$node\"} / node_memory_MemTotal_bytes{instance=\"$node\"})) * 100",
              "legendFormat": "Memory"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 88 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Root Disk Used (/ — 5900rpm HDD)",
          "description": "/ lives on /dev/sda2 (ST4000DM000, 5900rpm). k3s image store, all local-path PVCs and the Minecraft world all share this spindle.",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "(1 - (node_filesystem_avail_bytes{instance=\"$node\", mountpoint=\"/\", fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{instance=\"$node\", mountpoint=\"/\", fstype!~\"tmpfs|overlay|squashfs\"})) * 100",
              "legendFormat": "/"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 85 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Node Ready",
          "description": "kube-state-metrics view of the k3s Node object. If this flips to NotReady while the node_exporter panels still update, the problem is k3s/kubelet, not the host.",
          "gridPos": { "h": 5, "w": 4, "x": 15, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "max(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
              "legendFormat": "Ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "NOT READY", "color": "red", "index": 0 } } },
                { "type": "value", "options": { "1": { "text": "READY", "color": "green", "index": 1 } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Host Uptime",
          "gridPos": { "h": 5, "w": 5, "x": 19, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_time_seconds{instance=\"$node\"} - node_boot_time_seconds{instance=\"$node\"}",
              "legendFormat": "uptime"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "decimals": 1, "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Load Average vs Core Count",
          "description": "The flat 'cores' line is the saturation reference: load1 above it means processes are queueing for CPU (or blocked on I/O — on this box, usually the HDD).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_load1{instance=\"$node\"}",
              "legendFormat": "load 1m"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_load5{instance=\"$node\"}",
              "legendFormat": "load 5m"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "node_load15{instance=\"$node\"}",
              "legendFormat": "load 15m"
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"}))",
              "legendFormat": "cores (saturation line)"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false,
                "gradientMode": "none"
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "cores (saturation line)" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 2 }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU by Mode (% of total capacity)",
          "description": "iowait rising while user/system stay flat is the signature of HDD contention rather than a real CPU shortage.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (mode) (rate(node_cpu_seconds_total{instance=\"$node\", mode!=\"idle\"}[5m])) / on() group_left() count(count by (cpu) (node_cpu_seconds_total{instance=\"$node\"})) * 100",
              "legendFormat": "{{mode}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 1,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "mode": "normal", "group": "A" },
                "gradientMode": "none"
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "iowait" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Memory — 15 GiB total, and that is the binding constraint on this host",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory Breakdown vs Total Capacity",
          "description": "The dashed red line is physical RAM (~15 GiB) — the hard ceiling. The dashed orange line is the kubelet's system-reserved=3Gi: memory below it is fenced off from the scheduler for the desktop session and system. Pods CANNOT swap (kubelet sets memory.swap.max=0 on cgroup v2), so a container at its limit is OOM-killed outright — the swap panels below are about host/desktop pressure only.",
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
