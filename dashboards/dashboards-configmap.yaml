              "instant": true
            },
            {
              "refId": "D",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "time() - max by (pod) (kube_pod_start_time{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true,
                  "Value #A": true,
                  "pod": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "label_app_kubernetes_io_name": "Pod",
                  "phase": "Phase",
                  "Value #B": "Restarts",
                  "Value #C": "Ready",
                  "Value #D": "Age"
                },
                "indexByName": {}
              }
            },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Restarts", "desc": true }] } }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
