              },
              {
                "matcher": { "id": "byName", "options": "debug" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#5A6172" } }]
              },
              {
                "matcher": { "id": "byName", "options": "{}" },
                "properties": [
                  { "id": "displayName", "value": "unclassified" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "#3E4249" } }
                ]
              }
            ]
          }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Top Error Sources (this range)",
          "description": "Always error-scoped (ignores the Severity variable, honors the Pod variable). This dashboard is scoped to the bot container; see the Cloudflare Tunnel dashboard for connector errors.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "topk(5, sum by (pod, container) (count_over_time({namespace=\"pantry-bot\", container=\"bot\", pod=~\"$pod\", level=\"error\"} [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{pod}}/{{container}}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "top",
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "noValue": "No errors in range",
              "color": { "mode": "continuous-YlRd" }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "logs",
          "title": "Pantry Bot Logs",
          "description": "Bot log stream, filtered by the Pod and Severity variables. Click a line to expand its labels.",
          "gridPos": { "h": 13, "w": 24, "x": 0, "y": 25 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "{namespace=\"pantry-bot\", container=\"bot\", pod=~\"$pod\", level=~\"$level\"}",
              "queryType": "range",
              "maxLines": 2000
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        }
