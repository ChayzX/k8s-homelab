          "description": "read_time/reads_completed and write_time/writes_completed. On a 5900rpm spindle, healthy is roughly <20 ms; sustained >100 ms means the queue is deep and everything touching disk (Minecraft chunk saves, Prometheus compaction, Loki chunk flush) is waiting. Gaps are normal — the ratio is undefined when there were no operations in the interval.",
