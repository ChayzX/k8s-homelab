            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "topk(10, sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[1h])))",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}} (1h)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient",
