apiVersion: v1
data:
  cloudflared.json: "{\n  \"uid\": \"homelab-cloudflared\",\n  \"title\": \"Cloudflare\
    \ Tunnel \u2014 cloudflared Health\",\n  \"description\": \"Kubernetes and Loki\
    \ visibility for the cloudflared connector that serves the dashboard-managed Cloudflare\
    \ Tunnel. These panels deliberately use only signals this repository already collects:\
    \ kube-state-metrics, cAdvisor, and promtail/Loki. cloudflared's native :2000\
    \ endpoint is used for probes but is not a Prometheus scrape target.\",\n  \"\
    tags\": [\"homelab\", \"k3s\", \"cloudflare\", \"cloudflared\", \"tunnel\"],\n\
    \  \"timezone\": \"browser\",\n  \"editable\": true,\n  \"schemaVersion\": 39,\n\
    \  \"version\": 1,\n  \"refresh\": \"15s\",\n  \"graphTooltip\": 1,\n  \"time\"\
    : { \"from\": \"now-6h\", \"to\": \"now\" },\n  \"templating\": { \"list\": [\n\
    \    { \"name\": \"DS_PROMETHEUS\", \"label\": \"Prometheus\", \"type\": \"datasource\"\
    , \"query\": \"prometheus\", \"current\": {}, \"hide\": 0, \"refresh\": 1, \"\
    regex\": \"\", \"skipUrlSync\": false },\n    { \"name\": \"DS_LOKI\", \"label\"\
    : \"Loki\", \"type\": \"datasource\", \"query\": \"loki\", \"current\": {}, \"\
    hide\": 0, \"refresh\": 1, \"regex\": \"\", \"skipUrlSync\": false },\n    { \"\
    name\": \"pod\", \"label\": \"Connector pod\", \"type\": \"query\", \"datasource\"\
    : { \"type\": \"loki\", \"uid\": \"${DS_LOKI}\" }, \"definition\": \"label_values({namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\"}, pod)\", \"query\": { \"label\"\
    : \"pod\", \"refId\": \"LokiVariableQueryEditor-VariableQuery\", \"stream\": \"\
    {namespace=\\\"pantry-bot\\\", container=\\\"cloudflared\\\"}\", \"type\": 1 },\
    \ \"refresh\": 2, \"includeAll\": true, \"allValue\": \".+\", \"multi\": true,\
    \ \"sort\": 1, \"hide\": 0, \"current\": { \"selected\": true, \"text\": [\"All\"\
    ], \"value\": [\"$__all\"] }, \"skipUrlSync\": false },\n    { \"name\": \"level\"\
    , \"label\": \"Severity\", \"type\": \"custom\", \"query\": \"debug,info,warn,error\"\
    , \"options\": [{ \"selected\": false, \"text\": \"debug\", \"value\": \"debug\"\
    \ }, { \"selected\": false, \"text\": \"info\", \"value\": \"info\" }, { \"selected\"\
    : false, \"text\": \"warn\", \"value\": \"warn\" }, { \"selected\": false, \"\
    text\": \"error\", \"value\": \"error\" }], \"includeAll\": true, \"allValue\"\
    : \".*\", \"multi\": true, \"hide\": 0, \"current\": { \"selected\": true, \"\
    text\": [\"All\"], \"value\": [\"$__all\"] }, \"skipUrlSync\": false }\n  ] },\n\
    \  \"panels\": [\n    { \"type\": \"row\", \"title\": \"Tunnel connectivity and\
    \ lifecycle\", \"collapsed\": false, \"gridPos\": { \"h\": 1, \"w\": 24, \"x\"\
    : 0, \"y\": 0 }, \"panels\": [] },\n    { \"id\": 1, \"type\": \"stat\", \"title\"\
    : \"Connector Ready\", \"description\": \"Kubernetes readiness is cloudflared's\
    \ /ready endpoint. It returns 200 only after a connection is registered with Cloudflare's\
    \ edge, making it more useful than merely observing a running process.\", \"gridPos\"\
    : { \"h\": 5, \"w\": 6, \"x\": 0, \"y\": 1 }, \"datasource\": { \"type\": \"prometheus\"\
    , \"uid\": \"${DS_PROMETHEUS}\" }, \"targets\": [{ \"refId\": \"A\", \"datasource\"\
    : { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" }, \"expr\": \"min(kube_pod_container_status_ready{namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\"})\", \"legendFormat\": \"ready\"\
    \ }], \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\"\
    : \"\", \"values\": false }, \"orientation\": \"auto\", \"textMode\": \"auto\"\
    , \"colorMode\": \"background\", \"graphMode\": \"none\", \"justifyMode\": \"\
    auto\" }, \"fieldConfig\": { \"defaults\": { \"mappings\": [{ \"type\": \"value\"\
    , \"options\": { \"0\": { \"text\": \"NOT READY\", \"color\": \"red\", \"index\"\
    : 0 }, \"1\": { \"text\": \"READY\", \"color\": \"green\", \"index\": 1 } } }],\
    \ \"thresholds\": { \"mode\": \"absolute\", \"steps\": [{ \"color\": \"red\",\
    \ \"value\": null }, { \"color\": \"green\", \"value\": 1 }] } }, \"overrides\"\
    : [] } },\n    { \"id\": 2, \"type\": \"stat\", \"title\": \"Connector Running\"\
    , \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 6, \"y\": 1 }, \"datasource\": { \"\
    type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" }, \"targets\": [{ \"refId\"\
    : \"A\", \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ }, \"expr\": \"min(kube_pod_container_status_running{namespace=\\\"pantry-bot\\\
    \", container=\\\"cloudflared\\\"})\", \"legendFormat\": \"running\" }], \"options\"\
    : { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"values\"\
    : false }, \"orientation\": \"auto\", \"textMode\": \"auto\", \"colorMode\": \"\
    background\", \"graphMode\": \"none\", \"justifyMode\": \"auto\" }, \"fieldConfig\"\
    : { \"defaults\": { \"mappings\": [{ \"type\": \"value\", \"options\": { \"0\"\
    : { \"text\": \"DOWN\", \"color\": \"red\", \"index\": 0 }, \"1\": { \"text\"\
    : \"RUNNING\", \"color\": \"green\", \"index\": 1 } } }], \"thresholds\": { \"\
    mode\": \"absolute\", \"steps\": [{ \"color\": \"red\", \"value\": null }, { \"\
    color\": \"green\", \"value\": 1 }] } }, \"overrides\": [] } },\n    { \"id\"\
    : 3, \"type\": \"stat\", \"title\": \"Restarts (24h)\", \"description\": \"The\
    \ liveness probe allows a 2.5-minute sustained Cloudflare-edge disconnection before\
    \ restarting the connector. A nonzero value is a signal to inspect the log panels.\"\
    , \"gridPos\": { \"h\": 5, \"w\": 6, \"x\": 12, \"y\": 1 }, \"datasource\": {\
    \ \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" }, \"targets\": [{ \"\
    refId\": \"A\", \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ }, \"expr\": \"sum(increase(kube_pod_container_status_restarts_total{namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\"}[24h])) or vector(0)\", \"legendFormat\"\
    : \"restarts\" }], \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"\
    ], \"fields\": \"\", \"values\": false }, \"orientation\": \"auto\", \"textMode\"\
    : \"auto\", \"colorMode\": \"background\", \"graphMode\": \"none\", \"justifyMode\"\
    : \"auto\" }, \"fieldConfig\": { \"defaults\": { \"unit\": \"short\", \"decimals\"\
    : 0, \"thresholds\": { \"mode\": \"absolute\", \"steps\": [{ \"color\": \"green\"\
    , \"value\": null }, { \"color\": \"#EAB839\", \"value\": 1 }, { \"color\": \"\
    red\", \"value\": 2 }] } }, \"overrides\": [] } },\n    { \"id\": 4, \"type\"\
    : \"stat\", \"title\": \"Deployment Desired / Ready\", \"gridPos\": { \"h\": 5,\
    \ \"w\": 6, \"x\": 18, \"y\": 1 }, \"datasource\": { \"type\": \"prometheus\"\
    , \"uid\": \"${DS_PROMETHEUS}\" }, \"targets\": [{ \"refId\": \"A\", \"datasource\"\
    : { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" }, \"expr\": \"kube_deployment_spec_replicas{namespace=\\\
    \"pantry-bot\\\", deployment=\\\"cloudflared\\\"}\", \"legendFormat\": \"desired\"\
    \ }, { \"refId\": \"B\", \"datasource\": { \"type\": \"prometheus\", \"uid\":\
    \ \"${DS_PROMETHEUS}\" }, \"expr\": \"kube_deployment_status_replicas_available{namespace=\\\
    \"pantry-bot\\\", deployment=\\\"cloudflared\\\"}\", \"legendFormat\": \"ready\"\
    \ }], \"options\": { \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\"\
    : \"\", \"values\": false }, \"orientation\": \"horizontal\", \"textMode\": \"\
    value_and_name\", \"colorMode\": \"none\", \"graphMode\": \"none\", \"justifyMode\"\
    : \"auto\" }, \"fieldConfig\": { \"defaults\": { \"unit\": \"short\", \"decimals\"\
    : 0 }, \"overrides\": [] } },\n    { \"type\": \"row\", \"title\": \"Connector\
    \ resources\", \"collapsed\": false, \"gridPos\": { \"h\": 1, \"w\": 24, \"x\"\
    : 0, \"y\": 6 }, \"panels\": [] },\n    { \"id\": 5, \"type\": \"timeseries\"\
    , \"title\": \"Memory Working Set vs Limit / Request\", \"description\": \"Solid\
    \ cAdvisor working set, dashed 128Mi limit, and dotted 64Mi request.\", \"gridPos\"\
    : { \"h\": 9, \"w\": 12, \"x\": 0, \"y\": 7 }, \"datasource\": { \"type\": \"\
    prometheus\", \"uid\": \"${DS_PROMETHEUS}\" }, \"targets\": [{ \"refId\": \"A\"\
    , \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" },\
    \ \"expr\": \"sum(container_memory_working_set_bytes{namespace=\\\"pantry-bot\\\
    \", container=\\\"cloudflared\\\"})\", \"legendFormat\": \"working set\" }, {\
    \ \"refId\": \"B\", \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ }, \"expr\": \"sum(kube_pod_container_resource_limits{namespace=\\\"pantry-bot\\\
    \", container=\\\"cloudflared\\\", resource=\\\"memory\\\"})\", \"legendFormat\"\
    : \"LIMIT\" }, { \"refId\": \"C\", \"datasource\": { \"type\": \"prometheus\"\
    , \"uid\": \"${DS_PROMETHEUS}\" }, \"expr\": \"sum(kube_pod_container_resource_requests{namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\", resource=\\\"memory\\\"})\",\
    \ \"legendFormat\": \"request\" }], \"options\": { \"legend\": { \"displayMode\"\
    : \"table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\"\
    , \"max\"] }, \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" } }, \"fieldConfig\"\
    : { \"defaults\": { \"unit\": \"bytes\", \"min\": 0, \"color\": { \"mode\": \"\
    palette-classic\" }, \"custom\": { \"drawStyle\": \"line\", \"lineWidth\": 1,\
    \ \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\": false } }, \"\
    overrides\": [] } },\n    { \"id\": 6, \"type\": \"timeseries\", \"title\": \"\
    CPU Usage vs Limit (cores)\", \"description\": \"Solid cAdvisor CPU usage and\
    \ dashed 200m CPU limit.\", \"gridPos\": { \"h\": 9, \"w\": 12, \"x\": 12, \"\
    y\": 7 }, \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ }, \"targets\": [{ \"refId\": \"A\", \"datasource\": { \"type\": \"prometheus\"\
    , \"uid\": \"${DS_PROMETHEUS}\" }, \"expr\": \"sum(rate(container_cpu_usage_seconds_total{namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\"}[5m]))\", \"legendFormat\": \"\
    usage\" }, { \"refId\": \"B\", \"datasource\": { \"type\": \"prometheus\", \"\
    uid\": \"${DS_PROMETHEUS}\" }, \"expr\": \"sum(kube_pod_container_resource_limits{namespace=\\\
    \"pantry-bot\\\", container=\\\"cloudflared\\\", resource=\\\"cpu\\\"})\", \"\
    legendFormat\": \"LIMIT\" }], \"options\": { \"legend\": { \"displayMode\": \"\
    table\", \"placement\": \"bottom\", \"showLegend\": true, \"calcs\": [\"lastNotNull\"\
    , \"max\"] }, \"tooltip\": { \"mode\": \"multi\", \"sort\": \"desc\" } }, \"fieldConfig\"\
    : { \"defaults\": { \"unit\": \"none\", \"min\": 0, \"decimals\": 3, \"color\"\
    : { \"mode\": \"palette-classic\" }, \"custom\": { \"drawStyle\": \"line\", \"\
    lineWidth\": 1, \"fillOpacity\": 10, \"showPoints\": \"never\", \"spanNulls\"\
    : false, \"axisLabel\": \"cores\" } }, \"overrides\": [] } },\n    { \"type\"\
    : \"row\", \"title\": \"Connector logs\", \"collapsed\": false, \"gridPos\": {\
    \ \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 16 }, \"panels\": [] },\n    { \"id\"\
    : 7, \"type\": \"timeseries\", \"title\": \"Log Volume by Severity\", \"description\"\
    : \"Zerolog severity is extracted by promtail. Warning or error spikes around\
    \ an edge disconnect are visible before the connector has accumulated enough failures\
    \ for a liveness restart.\", \"gridPos\": { \"h\": 8, \"w\": 12, \"x\": 0, \"\
    y\": 17 }, \"datasource\": { \"type\": \"loki\", \"uid\": \"${DS_LOKI}\" }, \"\
    targets\": [{ \"refId\": \"A\", \"datasource\": { \"type\": \"loki\", \"uid\"\
    : \"${DS_LOKI}\" }, \"expr\": \"sum by (level) (count_over_time({namespace=\\\"\
    pantry-bot\\\", container=\\\"cloudflared\\\", pod=~\\\"$pod\\\", level=~\\\"\
    $level\\\"} [$__auto]))\", \"queryType\": \"range\", \"legendFormat\": \"{{level}}\"\
    \ }], \"options\": { \"legend\": { \"displayMode\": \"table\", \"placement\":\
    \ \"bottom\", \"showLegend\": true, \"calcs\": [\"sum\", \"max\"] }, \"tooltip\"\
    : { \"mode\": \"multi\", \"sort\": \"desc\" } }, \"fieldConfig\": { \"defaults\"\
    : { \"unit\": \"short\", \"min\": 0, \"decimals\": 0, \"color\": { \"mode\": \"\
    palette-classic\" }, \"custom\": { \"drawStyle\": \"bars\", \"lineWidth\": 0,\
    \ \"fillOpacity\": 85, \"showPoints\": \"never\", \"spanNulls\": false, \"barAlignment\"\
    : 0, \"stacking\": { \"mode\": \"normal\", \"group\": \"A\" } } }, \"overrides\"\
    : [] } },\n    { \"id\": 8, \"type\": \"logs\", \"title\": \"cloudflared Logs\"\
    , \"description\": \"Live connector log stream. The Cloudflare warning 'accept\
    \ stream listener encountered a failure' is directly visible here alongside reconnect\
    \ and registration messages.\", \"gridPos\": { \"h\": 12, \"w\": 12, \"x\": 12,\
    \ \"y\": 17 }, \"datasource\": { \"type\": \"loki\", \"uid\": \"${DS_LOKI}\" },\
    \ \"targets\": [{ \"refId\": \"A\", \"datasource\": { \"type\": \"loki\", \"uid\"\
    : \"${DS_LOKI}\" }, \"expr\": \"{namespace=\\\"pantry-bot\\\", container=\\\"\
    cloudflared\\\", pod=~\\\"$pod\\\", level=~\\\"$level\\\"}\", \"maxLines\": 2000\
    \ }], \"options\": { \"showTime\": true, \"showLabels\": true, \"showCommonLabels\"\
    : false, \"wrapLogMessage\": true, \"enableLogDetails\": true, \"dedupStrategy\"\
    : \"none\", \"sortOrder\": \"Descending\" }, \"fieldConfig\": { \"defaults\":\
    \ {}, \"overrides\": [] } }\n  ]\n}\n"
  cluster-overview.json: "{\n  \"uid\": \"homelab-cluster-overview\",\n  \"title\"\
    : \"Host Health / Cluster Overview \u2014 Node & k3s Control Plane\",\n  \"description\"\
    : \"Node-level health for MinecraftMachine (single-node k3s). Metrics come from\
    \ the NATIVE node_exporter binary at 192.168.40.208:9100 \u2014 there is deliberately\
    \ no node-exporter DaemonSet, so 'node' here means the real bare-metal host, not\
    \ a container view of it.\",\n  \"tags\": [\"homelab\", \"k3s\", \"node\", \"\
    host\"],\n  \"timezone\": \"browser\",\n  \"editable\": true,\n  \"schemaVersion\"\
    : 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"graphTooltip\": 1,\n  \"\
    time\": { \"from\": \"now-6h\", \"to\": \"now\" },\n  \"templating\": {\n    \"\
    list\": [\n      {\n        \"name\": \"DS_PROMETHEUS\",\n        \"label\": \"\
    Prometheus\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\"\
    ,\n        \"current\": {},\n        \"hide\": 0,\n        \"refresh\": 1,\n \
    \       \"regex\": \"\",\n        \"skipUrlSync\": false\n      },\n      {\n\
    \        \"name\": \"node\",\n        \"label\": \"node_exporter instance\",\n\
    \        \"type\": \"query\",\n        \"datasource\": { \"type\": \"prometheus\"\
    , \"uid\": \"${DS_PROMETHEUS}\" },\n        \"definition\": \"label_values(node_uname_info,\
    \ instance)\",\n        \"query\": {\n          \"qryType\": 1,\n          \"\
    query\": \"label_values(node_uname_info, instance)\",\n          \"refId\": \"\
    PrometheusVariableQueryEditor-VariableQuery\"\n        },\n        \"refresh\"\
    : 1,\n        \"includeAll\": false,\n        \"multi\": false,\n        \"sort\"\
    : 1,\n        \"hide\": 0,\n        \"current\": {},\n        \"skipUrlSync\"\
    : false\n      },\n      {\n        \"name\": \"disk\",\n        \"label\": \"\
    Disk device\",\n        \"type\": \"query\",\n        \"datasource\": { \"type\"\
    : \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" },\n        \"definition\": \"\
    label_values(node_disk_io_time_seconds_total{instance=\\\"$node\\\", device=~\\\
    \"sd[a-z]|nvme[0-9]n[0-9]\\\"}, device)\",\n        \"query\": {\n          \"\
    qryType\": 1,\n          \"query\": \"label_values(node_disk_io_time_seconds_total{instance=\\\
    \"$node\\\", device=~\\\"sd[a-z]|nvme[0-9]n[0-9]\\\"}, device)\",\n          \"\
    refId\": \"PrometheusVariableQueryEditor-VariableQuery\"\n        },\n       \
    \ \"refresh\": 1,\n        \"includeAll\": true,\n        \"allValue\": \".+\"\
    ,\n        \"multi\": true,\n        \"sort\": 1,\n        \"hide\": 0,\n    \
    \    \"current\": {},\n        \"skipUrlSync\": false\n      }\n    ]\n  },\n\
    \  \"panels\": [\n    {\n      \"type\": \"row\",\n      \"title\": \"Node health\
    \ \u2014 MinecraftMachine (bare metal, 8c/16t, 15 GiB)\",\n      \"collapsed\"\
    : false,\n      \"gridPos\": { \"h\": 1, \"w\": 24, \"x\": 0, \"y\": 0 },\n  \
    \    \"panels\": []\n    },\n    {\n      \"id\": 1,\n      \"type\": \"gauge\"\
    ,\n      \"title\": \"CPU Usage\",\n      \"description\": \"Whole-host CPU, all\
    \ 16 threads averaged. Includes the desktop session and any non-k8s process \u2014\
    \ not just pods.\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 0, \"y\"\
    : 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n         \
    \ \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" },\n\
    \          \"expr\": \"sum(rate(node_cpu_seconds_total{instance=\\\"$node\\\"\
    , mode!=\\\"idle\\\"}[5m])) / count(count by (cpu) (node_cpu_seconds_total{instance=\\\
    \"$node\\\"})) * 100\",\n          \"legendFormat\": \"CPU\"\n        }\n    \
    \  ],\n      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"\
    ], \"fields\": \"\", \"values\": false },\n        \"showThresholdLabels\": false,\n\
    \        \"showThresholdMarkers\": true\n      },\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\"\
    : 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"thresholds\"\
    : {\n            \"mode\": \"absolute\",\n            \"steps\": [\n         \
    \     { \"color\": \"green\", \"value\": null },\n              { \"color\": \"\
    #EAB839\", \"value\": 70 },\n              { \"color\": \"red\", \"value\": 90\
    \ }\n            ]\n          }\n        },\n        \"overrides\": []\n     \
    \ }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"gauge\",\n      \"title\"\
    : \"Memory Used\",\n      \"description\": \"1 - MemAvailable/MemTotal. MemAvailable\
    \ already discounts reclaimable page cache, so this is the number that matters\
    \ for eviction risk.\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 5, \"\
    y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n         \
    \ \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" },\n\
    \          \"expr\": \"(1 - (node_memory_MemAvailable_bytes{instance=\\\"$node\\\
    \"} / node_memory_MemTotal_bytes{instance=\\\"$node\\\"})) * 100\",\n        \
    \  \"legendFormat\": \"Memory\"\n        }\n      ],\n      \"options\": {\n \
    \       \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\", \"\
    values\": false },\n        \"showThresholdLabels\": false,\n        \"showThresholdMarkers\"\
    : true\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n        \
    \  \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n  \
    \        \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\":\
    \ \"absolute\",\n            \"steps\": [\n              { \"color\": \"green\"\
    , \"value\": null },\n              { \"color\": \"#EAB839\", \"value\": 75 },\n\
    \              { \"color\": \"red\", \"value\": 88 }\n            ]\n        \
    \  }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"\
    id\": 3,\n      \"type\": \"gauge\",\n      \"title\": \"Root Disk Used (/ \u2014\
    \ 5900rpm HDD)\",\n      \"description\": \"/ lives on /dev/sda2 (ST4000DM000,\
    \ 5900rpm). k3s image store, all local-path PVCs and the Minecraft world all share\
    \ this spindle.\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 10, \"y\"\
    : 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n         \
    \ \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\" },\n\
    \          \"expr\": \"(1 - (node_filesystem_avail_bytes{instance=\\\"$node\\\"\
    , mountpoint=\\\"/\\\", fstype!~\\\"tmpfs|overlay|squashfs\\\"} / node_filesystem_size_bytes{instance=\\\
    \"$node\\\", mountpoint=\\\"/\\\", fstype!~\\\"tmpfs|overlay|squashfs\\\"})) *\
    \ 100\",\n          \"legendFormat\": \"/\"\n        }\n      ],\n      \"options\"\
    : {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"], \"fields\": \"\
    \", \"values\": false },\n        \"showThresholdLabels\": false,\n        \"\
    showThresholdMarkers\": true\n      },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\"\
    : 100,\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"\
    mode\": \"absolute\",\n            \"steps\": [\n              { \"color\": \"\
    green\", \"value\": null },\n              { \"color\": \"#EAB839\", \"value\"\
    : 75 },\n              { \"color\": \"red\", \"value\": 85 }\n            ]\n\
    \          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n\
    \      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"Node Ready\"\
    ,\n      \"description\": \"kube-state-metrics view of the k3s Node object. If\
    \ this flips to NotReady while the node_exporter panels still update, the problem\
    \ is k3s/kubelet, not the host.\",\n      \"gridPos\": { \"h\": 5, \"w\": 4, \"\
    x\": 15, \"y\": 1 },\n      \"datasource\": { \"type\": \"prometheus\", \"uid\"\
    : \"${DS_PROMETHEUS}\" },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
    \ },\n          \"expr\": \"max(kube_node_status_condition{condition=\\\"Ready\\\
    \", status=\\\"true\\\"}) or vector(0)\",\n          \"legendFormat\": \"Ready\"\
    \n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": { \"calcs\"\
    : [\"lastNotNull\"], \"fields\": \"\", \"values\": false },\n        \"orientation\"\
    : \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"background\"\
    ,\n        \"graphMode\": \"none\",\n        \"justifyMode\": \"auto\"\n     \
    \ },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\"\
    : [\n            { \"type\": \"value\", \"options\": { \"0\": { \"text\": \"NOT\
    \ READY\", \"color\": \"red\", \"index\": 0 } } },\n            { \"type\": \"\
    value\", \"options\": { \"1\": { \"text\": \"READY\", \"color\": \"green\", \"\
    index\": 1 } } }\n          ],\n          \"thresholds\": {\n            \"mode\"\
    : \"absolute\",\n            \"steps\": [\n              { \"color\": \"red\"\
    , \"value\": null },\n              { \"color\": \"green\", \"value\": 1 }\n \
    \           ]\n          }\n        },\n        \"overrides\": []\n      }\n \
    \   },\n    {\n      \"id\": 5,\n      \"type\": \"stat\",\n      \"title\": \"\
    Host Uptime\",\n      \"gridPos\": { \"h\": 5, \"w\": 5, \"x\": 19, \"y\": 1 },\n\
    \      \"datasource\": { \"type\": \"prometheus\", \"uid\": \"${DS_PROMETHEUS}\"\
