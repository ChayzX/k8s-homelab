              "min": 0,
              "decimals": 0,
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "table",
          "title": "Last Termination Reason",
          "description": "kube_pod_container_status_last_terminated_reason — the authoritative record of WHY a container last died (OOMKilled, Error, Completed, ContainerStatusUnknown). Independent of the cAdvisor OOM counter, so it is the cross-check when that counter looks suspiciously flat.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 38 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "(kube_pod_container_status_last_terminated_reason{namespace=~\"$namespace\", pod=~\"$pod\"} == 1) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true,
                  "Value": true,
                  "pod": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "label_app_kubernetes_io_name": "Pod",
                  "container": "Container",
                  "reason": "Reason"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": true } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Reason" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "OOMKilled": { "color": "red", "index": 0 } } },
                      { "type": "value", "options": { "Error": { "color": "orange", "index": 1 } } },
                      { "type": "value", "options": { "Completed": { "color": "green", "index": 2 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Deployments, network & storage",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 46 },
          "panels": []
        },
        {
          "id": 16,
          "type": "table",
          "title": "Deployment Replicas (desired vs available)",
          "description": "Every app in this cluster is a Deployment with strategy: Recreate and a single replica. Desired 1 / available 0 means the replacement pod has not come up after the old one released its RWO PVC.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 47 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_spec_replicas{namespace=~\"$namespace\"}",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\"}",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_unavailable{namespace=~\"$namespace\"}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "deployment", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "uid": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "deployment": "Deployment",
                  "Value #A": "Desired",
                  "Value #B": "Available",
                  "Value #C": "Unavailable"
                },
                "indexByName": {}
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": { "show": false, "reducer": ["sum"], "countRows": false, "fields": "" }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" } } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Unavailable" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } }
                ]
              }
            ]
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Pod Network I/O",
          "description": "cAdvisor reports network at the pod sandbox, so these series are per-pod rather than per-container.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 47 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{label_app_kubernetes_io_name}} rx"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (namespace, pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\", pod=~\"$pod\"}[5m])) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{label_app_kubernetes_io_name}} tx"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Container Filesystem Writes",
          "description": "Which pod is hammering the 5900rpm root disk. TODO / CAVEAT: container_fs_writes_bytes_total is reported by cAdvisor only for the container's own writable layer, and on containerd + overlayfs it is frequently sparse or absent. Writes that go to a mounted PVC (the Minecraft world, Prometheus TSDB, Loki chunks) are NOT counted here at all — for those, use the node-level Disk Throughput panel on Cluster Overview. If this panel is permanently empty, that is expected, not a broken query.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 47 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (namespace, pod) (rate(container_fs_writes_bytes_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[5m])) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{label_app_kubernetes_io_name}} write"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum by (namespace, pod) (rate(container_fs_reads_bytes_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[5m])) * on(namespace, pod) group_left(label_app_kubernetes_io_name) kube_pod_labels{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{label_app_kubernetes_io_name}} read"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10, "showPoints": "never", "spanNulls": false }
            },
            "overrides": []
          }
        },
        {
          "id": 19,
          "type": "bargauge",
          "title": "PersistentVolumeClaim Usage",
          "description": "Verified live (2026-08-11): the kubelet's main /metrics endpoint is scraped (kubernetes-kubelet job, target up) and kubelet_volume_stats_* returns real data for every PVC. Every PVC here lives on the 5900rpm root disk, so filling one is a real risk worth watching.",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 55 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kubelet_volume_stats_used_bytes{namespace=~\"$namespace\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\"} * 100",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "auto",
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "noValue": "No data — see panel description (kubelet /metrics scrape job may be missing)",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
