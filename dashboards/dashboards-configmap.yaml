  pantry-bot.json: |
    {
      "uid": "homelab-pantry-bot",
      "title": "Pantry Bot — Health & Usage",
      "description": "Health and usage of the pantry-bot Twitch bot. This dashboard is deliberately scoped to the bot container; the Cloudflare connector has its own dashboard. There is no application-level exporter for this app (no /health, no prom-client), so readiness/uptime/restarts are the only Kubernetes-visible health signals.",
      "tags": ["homelab", "k3s", "pantry-bot"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod",
            "description": "Drills into the bot pod when a Deployment briefly has two during a Recreate rollout.",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({namespace=\"pantry-bot\", container=\"bot\"}, pod)",
            "query": {
              "label": "pod",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=\"pantry-bot\", container=\"bot\"}",
              "type": 1
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "level",
            "label": "Severity",
            "description": "Wired straight into the LogQL stream selector as level=~\"$level\". 'All' uses the regex .* which also matches lines promtail could not classify (no level label at all). The ERROR panels ignore this variable on purpose so 'how many errors right now' never depends on resetting the filter.",
            "type": "custom",
            "query": "debug,info,warn,error",
            "options": [
              { "selected": false, "text": "debug", "value": "debug" },
              { "selected": false, "text": "info", "value": "info" },
              { "selected": false, "text": "warn", "value": "warn" },
              { "selected": false, "text": "error", "value": "error" }
            ],
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "At a glance — up, restarting, or erroring?",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Bot Pod Uptime",
          "description": "Age of the current pantry-bot pod, from kube_pod_start_time. Resets to 0 on every restart — a young age here IS the restart signal. With strategy: Recreate and a single RWO SQLite PVC, the old pod fully terminates before the new one mounts, so every reset means real downtime.",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "time() - max(kube_pod_start_time{namespace=\"pantry-bot\", pod=~\"pantry-bot-.*\"})",
              "legendFormat": "uptime"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "decimals": 1, "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Restarts (24h)",
          "description": "Cumulative restarts across both containers (bot + cloudflared) in the last 24h. The bot's livenessProbe failureThreshold is 5 (150s of continuous failure) specifically because a restart here means real downtime. Frequent restarts are worth chasing down, not shrugging off.",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"pantry-bot\", container=\"bot\"}[24h])) or vector(0)",
              "legendFormat": "restarts"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Replicas — Desired vs Ready",
          "description": "kube_deployment_spec_replicas vs kube_deployment_status_replicas_available for pantry-bot. With strategy: Recreate and a single RWO SQLite PVC, ready < desired means the replacement pod has not come up after the old one released its volume.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_spec_replicas{namespace=\"pantry-bot\", deployment=\"pantry-bot\"}",
              "legendFormat": "{{deployment}} desired"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "kube_deployment_status_replicas_available{namespace=\"pantry-bot\", deployment=\"pantry-bot\"}",
              "legendFormat": "{{deployment}} ready"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "ERROR lines (this range)",
          "description": "Deliberately ignores the Severity variable — this always counts level=\"error\" so it stays meaningful no matter how the filter is set. Honors the Pod variable. Caveat: pantry-bot logs are plain console output with no structured severity, so promtail classifies them by keyword heuristic — a line is only counted here if it positively matched error vocabulary (error/exception/fatal, unhandled rejection, or a libuv errno like ENOTFOUND).",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({namespace=\"pantry-bot\", container=\"bot\", pod=~\"$pod\", level=\"error\"} [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "CPU & memory — actual usage vs requests vs limits",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "panels": []
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memory Working Set vs Limit / Request — per container",
          "description": "Solid = actual working set (the number the cgroup OOM killer compares against, from cAdvisor container_memory_working_set_bytes). Dashed = configured limit, dotted = request. The bot has a 256Mi limit and 128Mi request.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"pantry-bot\", container=\"bot\"})",
              "legendFormat": "{{container}} working set"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"pantry-bot\", container=\"bot\", resource=\"memory\"})",
              "legendFormat": "{{container}} LIMIT"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"pantry-bot\", container=\"bot\", resource=\"memory\"})",
              "legendFormat": "{{container}} request"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
