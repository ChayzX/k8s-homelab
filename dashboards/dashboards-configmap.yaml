apiVersion: v1
data:
  logs.json: |
    {
      "uid": "homelab-logs",
      "title": "Logs — Search & Severity",
      "description": "Log exploration across every pod in the cluster. Filter by severity (the `level` label that Alloy extracts), by namespace/pod, and by free-text regex. The log-volume graph is broken down by level so an error spike is visible before you read a single line.",
      "tags": ["homelab", "k3s", "logs", "loki"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "graphTooltip": 1,
      "links": [{"title": "Start Here", "url": "/d/home", "type": "link", "icon": "dashboard", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "Services", "url": "/d/services", "type": "link", "icon": "apps", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "Machines", "url": "/d/machines", "type": "link", "icon": "monitor", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "PantryBot", "url": "/d/homelab-pantry-bot", "type": "link", "icon": "bolt", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "Minecraft", "url": "/d/homelab-minecraft", "type": "link", "icon": "cube", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "Logs", "url": "/d/homelab-logs", "type": "link", "icon": "doc", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}, {"title": "Sites & Failover", "url": "/d/homelab-site-service-health", "type": "link", "icon": "sitemap", "asDropdown": false, "includeVars": false, "keepTime": true, "targetBlank": false, "tags": [], "tooltip": ""}],
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "namespace",
            "label": "Namespace (app)",
            "description": "Each app has its own namespace, so this doubles as the app selector: jmusicbot, pantry-bot, minecraft, observability, kube-system, etc. FIXED 2026-09-21: Alloy's current log pipeline (observability/alloy-logs-home.yaml) does not promote a `namespace` Loki label at all -- verified live, /loki/api/v1/labels currently returns only __stream_shard__, instance, job, level, service_name. Every pod's identity now lives in one composite label, `instance` = \"namespace/podname:container\". Rather than guess at a static namespace list (which would drift, the same mistake apps.json made), this variable queries Prometheus's kube_pod_status_phase namespace label instead -- unaffected by the Loki change -- and the LogQL below matches it as an instance-prefix regex.",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kube_pod_status_phase, namespace)",
            "query": { "qryType": 1, "query": "label_values(kube_pod_status_phase, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "pod",
            "label": "Pod (instance = namespace/pod:container)",
            "description": "FIXED 2026-09-21: there is no separate `pod` Loki label any more (see the namespace variable's description). This now lists the full `instance` label value -- \"namespace/podname:container\" -- scoped to the selected namespace(s), and the LogQL below matches it directly with instance=~\"$pod\" rather than a bare pod name.",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
            "definition": "label_values({instance=~\"($namespace)/.*\"}, instance)",
            "query": {
              "label": "instance",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{instance=~\"($namespace)/.*\"}",
              "type": 1
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "sort": 1,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "level",
            "label": "Severity",
            "description": "Wired straight into the LogQL stream selector as level=~\"$level\". 'All' uses the regex .* which also matches lines Alloy could not classify (no level label at all).",
            "type": "custom",
            "query": "debug,info,warn,error",
            "options": [
              { "selected": false, "text": "debug", "value": "debug" },
              { "selected": false, "text": "info", "value": "info" },
              { "selected": false, "text": "warn", "value": "warn" },
              { "selected": false, "text": "error", "value": "error" }
            ],
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "skipUrlSync": false
          },
          {
            "name": "search",
            "label": "Search (regex, case-insensitive)",
            "description": "Applied as a line filter: |~ \"(?i)<your text>\". Leave empty to match everything. RE2 syntax — e.g.  timeout|refused  or  player.*joined",
            "type": "textbox",
            "query": "",
            "current": { "selected": false, "text": "", "value": "" },
            "options": [],
            "hide": 0,
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Summary for the selected time range",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Lines matching current filter",
          "description": "Honours namespace, pod, severity and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "lines"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "ERROR lines",
          "description": "Deliberately ignores the Severity variable — this always counts level=\"error\" so it stays meaningful no matter how the filter above is set. It does still honour namespace, pod and the search box.",
          "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "errors"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "#EAB839", "value": 1 },
                  { "color": "red", "value": 25 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "WARN lines",
          "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"warn\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "warnings"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "#EAB839" }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Unclassified lines (no level label)",
          "description": "Streams where Alloy did not extract a level at all — LogQL matcher level=\"\". These lines are INVISIBLE to any severity filter, so a large number here means the severity filter is not to be trusted for that app and its parsing pipeline needs a regex/json stage. Expect some from k8s system components.",
          "gridPos": { "h": 5, "w": 5, "x": 15, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum(count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "unclassified"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "color": { "mode": "fixed", "fixedColor": "text" }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pods logging",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "count(sum by (pod) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "pods"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "noValue": "0", "color": { "mode": "fixed", "fixedColor": "text" } },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Volume over time",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Log Volume by Severity",
          "description": "Stacked bars, one colour per level (error = red, warn = amber, info = blue, debug = grey, unclassified = dark grey). An error spike is a red block that stands out against everything else. Uses $__auto for the range interval so the bar width follows the dashboard time range.",
          "gridPos": { "h": 9, "w": 14, "x": 0, "y": 7 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (level) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "{{level}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["sum", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false,
                "barAlignment": 0,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "error" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byName", "options": "warn" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#EAB839" } }]
              },
              {
                "matcher": { "id": "byName", "options": "info" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "semi-dark-blue" } }]
              },
              {
                "matcher": { "id": "byName", "options": "debug" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#5A6172" } }]
              },
              {
                "matcher": { "id": "byName", "options": "{}" },
                "properties": [
                  { "id": "displayName", "value": "unclassified" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "#3E4249" } }
                ]
              }
            ]
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Error & Warning Volume by Pod",
          "description": "Which pod is producing the errors. Ignores the Severity variable on purpose. FIXED 2026-09-21: grouped by the `instance` label (namespace/pod:container) instead of `app_kubernetes_io_name`, which is not a Loki label -- Alloy's current discovery.relabel stage (observability/alloy-logs-home.yaml) does not promote any Kubernetes pod labels into Loki, only job/instance/service_name/level exist.",
          "gridPos": { "h": 9, "w": 10, "x": 14, "y": 7 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (instance) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "ERROR {{instance}}"
            },
            {
              "refId": "B",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "sum by (instance) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"warn\"} |~ \"(?i)$search\" [$__auto]))",
              "queryType": "range",
              "legendFormat": "warn {{instance}}"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "calcs": [] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "^ERROR .*" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "^warn .*" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "#EAB839" } }]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Logs",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "panels": []
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Logs (namespace + pod + severity + search)",
          "description": "The full filter chain: {instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\". Click a line to expand its labels; use the label values there to narrow the variables above.",
          "gridPos": { "h": 17, "w": 17, "x": 0, "y": 17 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "{instance=~\"($namespace)/.*\", instance=~\"$pod\", level=~\"$level\"} |~ \"(?i)$search\"",
              "queryType": "range",
              "maxLines": 2000
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Top Error Producers (this range)",
          "description": "topk(10) by error-line count. Ignores the Severity variable. Legend is the `instance` label (namespace/pod:container) -- see the Error & Warning Volume by Pod panel note for why this isn't app_kubernetes_io_name.",
          "gridPos": { "h": 17, "w": 7, "x": 17, "y": 17 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "topk(10, sum by (instance) (count_over_time({instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"error\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "instant": true,
              "legendFormat": "{{instance}}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "top",
            "sizing": "auto",
            "minVizWidth": 8,
            "minVizHeight": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "noValue": "No errors in range",
              "color": { "mode": "continuous-YlRd" }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Errors Only — every selected namespace (severity filter bypassed)",
          "description": "A permanently error-scoped view so you never have to remember to set the Severity variable. Still honours namespace, pod and the search box.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 34 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
              "expr": "{instance=~\"($namespace)/.*\", instance=~\"$pod\", level=\"error\"} |~ \"(?i)$search\"",
              "queryType": "range",
              "maxLines": 1000
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        }
      ]
    }
  machines.json: |
    {
     "uid": "machines",
     "title": "Machines — How Is One Machine Doing?",
     "description": "Hardware health for one machine at a time. Each panel carries a Linux query (node_exporter) and a Windows query (windows_exporter); only the one matching the chosen machine returns data, so one dashboard covers both kinds.",
     "tags": [
      "homelab",
      "machines"
     ],
     "timezone": "browser",
     "editable": true,
     "schemaVersion": 39,
     "version": 1,
     "refresh": "1m",
     "graphTooltip": 1,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "links": [
      {
       "title": "Start Here",
       "url": "/d/home",
       "type": "link",
       "icon": "dashboard",
       "asDropdown": false,
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tags": [],
       "tooltip": ""
      },
      {
       "title": "Services",
       "url": "/d/services",
       "type": "link",
       "icon": "apps",
       "asDropdown": false,
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tags": [],
       "tooltip": ""
      },
      {
       "title": "Machines",
       "url": "/d/machines",
       "type": "link",
       "icon": "monitor",
       "asDropdown": false,
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tags": [],
       "tooltip": ""
      },
      {
       "title": "PantryBot",
       "url": "/d/homelab-pantry-bot",
       "type": "link",
       "icon": "bolt",
       "asDropdown": false,
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tags": [],
       "tooltip": ""
      },
      {
       "title": "Minecraft",
       "url": "/d/homelab-minecraft",
       "type": "link",
       "icon": "cube",
       "asDropdown": false,
       "includeVars": false,
       "keepTime": true,
       "targetBlank": false,
       "tags": [],
       "tooltip": ""
      },
      {
       "title": "Logs",
       "url": "/d/homelab-logs",
       "type": "link",
