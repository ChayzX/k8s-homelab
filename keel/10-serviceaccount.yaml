# Keel's ServiceAccount — the one exception to "no API access" in this repo.
#
# Keel's entire job is to watch and patch Deployments across every home-lab
# namespace, so unlike every other pod in these four directories it genuinely
# needs a projected token and a ClusterRole. automountServiceAccountToken is
# left at the default (true) here, deliberately, for exactly that reason.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel-sa
  namespace: keel
  labels:
    app.kubernetes.io/name: keel
    app.kubernetes.io/part-of: homelab
