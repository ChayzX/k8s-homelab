# =============================================================================
# Keel RBAC — watch/patch Deployments cluster-wide, least privilege
# =============================================================================
# Keel has to operate cluster-wide by design: `pantry-bot` (the Deployment it
# actually watches today) lives in the `pantry-bot` namespace, not `keel`, and
# a future second Keel-managed app could land in any namespace. A namespaced
# Role bound only inside `keel` cannot see anything outside it.
#
# This is trimmed from keel-hq/keel's own Helm chart default ClusterRole
# (chart/keel/values.yaml, rbac.clusterRole.rules — read directly from the repo
# to write this, not from memory) down to what THIS home-lab actually uses.
# Upstream additionally grants blanket `delete` on pods/replicasets and access
# to statefulsets/daemonsets/jobs/cronjobs/replicationcontrollers — none of
# which this home-lab has any Keel-managed workload of. If you later put a
# StatefulSet or DaemonSet under Keel's `keel.sh/policy`, extend the
# `apps`/`batch` resource list below; Keel will silently no-op on a resource
# kind it isn't allowed to see or patch, not error.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel
  labels:
    app.kubernetes.io/name: keel
    app.kubernetes.io/part-of: homelab
rules:
  # Core mechanism: find the Deployment, read its current image, patch it to
  # the new digest/tag. `delete` is NOT granted — Keel does not need to delete
  # Deployments to update them, and omitting it narrows what a compromised Keel
  # pod could do to "change image references" rather than "delete workloads".
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "update", "patch"]

  # Read-only. Needed to resolve which ReplicaSet/Pod belongs to a watched
  # Deployment when reasoning about rollout state.
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]

  # THIS is the line that makes registry polling work at all (see
  # SECRETS.md). Keel reads Secrets to resolve registry credentials — both by
  # inspecting a watched pod's own imagePullSecrets, and via any Secret this
  # repo names explicitly. Read-only: Keel has no legitimate reason to write a
  # Secret.
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]

  # Namespace discovery (Keel enumerates namespaces on startup to build its
  # watch list) and nodes (surfaced in its own status/UI). Both read-only.
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
    verbs: ["get", "list", "watch"]

  # Keel can optionally store its own state/notifications config in a
  # ConfigMap; granted narrowly (no delete) in case that path is used later.
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel
  labels:
    app.kubernetes.io/name: keel
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keel
subjects:
  - kind: ServiceAccount
    name: keel-sa
    namespace: keel
