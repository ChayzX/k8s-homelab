# Long-lived-ish token Secrets for the two `ci-deploy` ServiceAccounts.
#
# Why this file exists at all, and isn't just "kubectl create token": since
# Kubernetes 1.24, ServiceAccounts no longer get a token Secret auto-created
# for them (the old `<sa-name>-token-xxxxx` Secret that used to appear by
# itself). The replacement, `kubectl create token`, is the *better* option
# for anything that can re-request a token on demand — but it mints a
# short-lived token (1h default, bounded even with --duration) meant for a
# live client that refreshes it, not for baking once into a kubeconfig file
# that a CI pipeline will reuse across runs. A Secret of type
# `kubernetes.io/service-account-token`, carrying the
# `kubernetes.io/service-account.name` annotation below, is the documented
# way to opt back into the old "durable token Secret" behavior: the
# control plane populates its `data.token` and keeps it valid for as long as
# the Secret and the ServiceAccount both exist (subject to whatever
# service-account token expiry policy the cluster enforces — no different
# from the auto-created Secrets of pre-1.24 clusters).
#
# One Secret per SA, in the same namespace as that SA — a service-account
# token Secret must live in its ServiceAccount's own namespace, the
# annotation is how the control plane finds the SA to mint a token for.
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deploy-token
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: ci-deploy
    app.kubernetes.io/part-of: homelab
  annotations:
    kubernetes.io/service-account.name: ci-deploy
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deploy-token
  namespace: opsbot
  labels:
    app.kubernetes.io/name: ci-deploy
    app.kubernetes.io/part-of: homelab
  annotations:
    kubernetes.io/service-account.name: ci-deploy
type: kubernetes.io/service-account-token
