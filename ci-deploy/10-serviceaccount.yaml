# Dedicated ServiceAccounts for the self-hosted GitHub Actions CI deploy
# pipeline (epic `k8s-homelab-oiv`, this task: `k8s-homelab-oiv.2`).
#
# Why these exist at all: the pipeline was about to be handed a cluster-admin
# kubeconfig "temporarily" to do `kubectl set image` / `kubectl rollout
# status` / `kubectl rollout undo` against two Deployments. That kubeconfig
# can do literally anything in the cluster (create RBAC, read every Secret,
# delete any namespace); the runner it would live on is a build agent, not a
# system with the same trust level as an operator's laptop. These SAs plus
# ../ci-deploy/20-rbac.yaml replace it with a credential that can only touch
# `deployments`/`deployments/scale` in one namespace each.
#
# Neither SA is mounted into a running pod in this cluster — unlike opsbot's
# opsbot-sa (../opsbot/10-serviceaccount.yaml), nothing here runs as a
# workload. The whole point is an out-of-cluster credential (the GitHub
# Actions runner, wherever it executes) authenticating in via a token pulled
# from the Secret in 30-token-secret.yaml, so automountServiceAccountToken is
# left at its default (true) but is moot here — no Pod spec in this directory
# references either SA. See ../pantry-bot/10-serviceaccounts.yaml for the
# opposite case (SAs deliberately set to false because they DO back pods).
#
# One SA per namespace, not one shared SA, so a RoleBinding in `pantry-bot`
# can never be satisfied by a token minted for `opsbot`, or vice versa —
# ServiceAccount identity is namespace+name together, so this is free
# isolation, not extra ceremony.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: ci-deploy
    app.kubernetes.io/part-of: homelab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy
  namespace: opsbot
  labels:
    app.kubernetes.io/name: ci-deploy
    app.kubernetes.io/part-of: homelab
