# =============================================================================
# jmusicbot — Discord music bot
# =============================================================================
# Runs on the `pantry-bot-oracle` node (arm64) — see the nodeSelector below.
# The original host (MinecraftMachine, amd64) died; this namespace no longer
# has a bare-metal box to side-load images into, so it moved onto the GHCR
# pipeline `.github/workflows/jmusicbot-deploy.yml` already builds (that
# workflow's `apply-release`/`restart`/`verify` jobs run `kubectl set
# image`/`rollout restart` against whichever image tag it just published —
# nothing here needs to change per-release). See k8s-homelab-jor for the
# migration.
#
# THINGS HERE ARE EASY TO GET WRONG. Read before editing:
#
# 1. nodeSelector pins this pod to pantry-bot-oracle (arm64) — the only node
#    left in the cluster after MinecraftMachine's failure. The image below
#    MUST be a multi-arch (or arm64) manifest — see the workflow's
#    `platforms:` build setting — or the pod sits in `ErrImagePull` /
#    `exec format error` on this node.
#
# 2. runAsUser: 10001 — carried over from the pre-migration verification
#    (`docker top jmusicbot -o user,group` reported 10001:10001) and assumed
#    unchanged since the upstream Dockerfile that CI now builds from is the
#    same one the old custom image was built from. The `jmusicbot-config` PVC
#    is a FRESH, EMPTY volume on this node (the old PVC's data lived on
#    MinecraftMachine's now-dead disk and was not recovered) — local-path's
#    `fsGroup`/`fsGroupChangePolicy` below handle ownership on first mount, no
#    manual chown needed this time. Expect a one-time YouTube OAuth
#    re-authorization (read the pod log for a device code) since
#    `youtubetoken.txt` did not survive.
#
# 3. This Deployment is DELIBERATELY NOT MANAGED BY KEEL.
#    It carries no keel.sh/* annotations, and it must not gain any. Its
#    rebuild/deploy pipeline is now `.github/workflows/jmusicbot-deploy.yml`
#    (merge to main = deploy, see DEPLOYING.md), which already does the
#    correct `kubectl set image` (never `rollout restart` alone) since each
#    build publishes a uniquely-tagged image.
#
# 4. The health probes below depend on the health-endpoint patch (bd
#    k8s-homelab-aos, scripts/patches/jmusicbot-health-endpoint.patch), applied
#    automatically by the GitHub Actions build. Only that patched image
#    listens on port 9091; a stock upstream image has no listener there and
#    would sit NotReady forever.
#
# 5. The `ghcr.io/chayzx/jmusicbot` package must be pull-able from this
#    cluster: either public (DEPLOYING.md says to make it so before the first
#    deploy) or referenced with an `imagePullSecrets` entry + a
#    `ghcr-pull-secret` created in this namespace (see SECRETS.md).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmusicbot
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  # Recreate: the config PVC is RWO and JMusicBot writes serversettings.json /
  # youtubetoken.txt in place. RollingUpdate would briefly run two pods against
  # the same files (and the second would fail to mount the RWO volume anyway).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jmusicbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jmusicbot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
      annotations:
        # Roll the pod automatically when config.txt changes. `kubectl create
        # secret ... --dry-run=client -o yaml | kubectl apply -f -` updates the
        # Secret, but a subPath mount (see below) never sees the update — bump
        # this value, or just `kubectl rollout restart`, to pick it up.
        homelab/config-revision: "1"
    spec:
      # Pinned to the sole remaining cluster node post-MinecraftMachine
      # failure — matches observability/node-exporter-oracle.yaml's pattern.
      # Revisit if a second node ever joins and this no longer needs pinning.
      nodeSelector:
        kubernetes.io/hostname: pantry-bot-oracle
      serviceAccountName: jmusicbot-sa
      # Zero Kubernetes API access required. No token is projected.
      automountServiceAccountToken: false
      # java is PID 1 inside this image (verified: `docker top` shows only the
      # java process, so /app/entrypoint.sh exec's it), so SIGTERM reaches the
      # JVM directly and 30s is ample for a clean Discord disconnect.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup makes the kubelet chgrp+setgid the PVC contents to 10001 on
        # mount, which fixes ownership for anything the migration copy missed.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jmusicbot
          # Multi-arch image published by .github/workflows/jmusicbot-deploy.yml
          # (ghcr.io/chayzx/jmusicbot). CI overwrites this tag via
          # `kubectl set image` on every merge to main — see header note 3.
          # `:latest` here is only the value used on a from-scratch `kubectl
          # apply`; it is never what a real deploy runs on afterwards.
          image: ghcr.io/chayzx/jmusicbot:latest
          imagePullPolicy: IfNotPresent  # each CI build is a unique tag
          # Health endpoint (bd k8s-homelab-aos): a JDK-built-in HttpServer on
          # 9091 in the patched image. /health returns 200 only after the bot
          # has logged into Discord; /live returns 200 whenever the JVM is
          # alive. Named port so the probes and the Service can reference it.
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
          # Readiness: GET /health — 503 while the bot is still starting or
          # can't log in, 200 once StartupLifecycleListener sees the Discord
          # ReadyEvent. While 503 the pod stays NotReady (no Service endpoints,
          # Kuma sees the monitor as down).
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: GET /live — 200 whenever the JVM is alive. Deliberately
          # NOT /health: a Discord auth/connect failure or a slow login must
          # not make the kubelet restart the pod (JMusicBot retries the login
          # itself). The liveness probe only catches a wedged/dead process.
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          # NOTE — JVM heap sizing changes under a memory limit.
          # The JVM reads the cgroup limit and defaults MaxRAMPercentage to 25%,
          # so limits.memory=1Gi gives a ~256Mi max heap. Today the container is
          # unlimited inside the Docker Desktop VM (3.7GiB) and uses ~285MiB
          # RSS with a much larger heap available. If you see GC thrash or an
          # OOMKill after cutover, prefer tuning the JVM over raising the limit:
          #   env:
          #     - name: JAVA_OPTS
          #       value: "-XX:MaxRAMPercentage=70"
          # (Confirm the image's entrypoint honours JAVA_OPTS before relying on
          # it; if it does not, raise limits.memory instead.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem is NOT set: the JVM writes to /tmp and
            # lavaplayer buffers there. Enabling it needs an emptyDir at /tmp.
          volumeMounts:
            - name: config
              mountPath: /musicbot
            # config.txt is delivered from a Secret and mounted as a single
            # file INTO the PVC-backed directory. Two consequences to know:
            #  * subPath mounts do not receive Secret updates — the file is
            #    snapshotted at pod start. Restart the pod to apply changes.
            #  * the file is read-only. JMusicBot reads config.txt and writes
            #    its mutable state to serversettings.json (on the PVC), so this
            #    is fine. If a future version needs to rewrite config.txt, see
            #    the initContainer alternative documented in README.md.
            - name: config-txt
              mountPath: /musicbot/config.txt
              subPath: config.txt
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jmusicbot-config
        - name: config-txt
          secret:
            secretName: jmusicbot-config-txt
            # 0440 (not 0400): with fsGroup the file is owned root:10001, so
            # the group bit is what makes it readable by the bot.
            defaultMode: 0440
            items:
              - key: config.txt
                path: config.txt
