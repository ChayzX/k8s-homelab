# =============================================================================
# jmusicbot — Discord music bot
# =============================================================================
# Replaces the `jmusicbot` service in /home/chase/docker/jmusicbot/docker-compose.yml
#
# THREE THINGS HERE ARE EASY TO GET WRONG. Read before editing:
#
# 1. imagePullPolicy: IfNotPresent — MANDATORY, NOT A PREFERENCE.
#    The checked-in image is a published GHCR image with an immutable release
#    tag. IfNotPresent lets each environment pull it when absent without
#    unexpectedly changing a running pod to a mutable `latest` image.
#
# 2. runAsUser: 10001 — VERIFIED against the running container, not assumed.
#    `docker top jmusicbot -o user,group` reports 10001:10001. The files under
#    /home/chase/docker/jmusicbot are owned 1000:1000 ONLY because Docker
#    Desktop's virtiofs fakes ownership on the bind mount. Bare-metal k3s
#    enforces real UIDs. The R2-backed emptyDir is prepared with fsGroup
#    10001, so the bot can write serversettings.json / youtubetoken.txt without
#    a host-path ownership migration.
#
# 3. This Deployment is managed by the GitHub Actions JMusicBot pipeline.
#    The pipeline publishes a multi-arch GHCR image and changes the image
#    reference. Do not reintroduce Keel or a local-only image authority.
#
# 4. The health probes below depend on the health-endpoint patch in
#    scripts/patches/jmusicbot-health-endpoint.patch. The published image below
#    is produced by the workflow with that patch applied.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmusicbot
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  # Recreate: JMusicBot writes serversettings.json / youtubetoken.txt in place
  # and the R2 sync sidecar mirrors that mutable state. RollingUpdate could
  # briefly create two Discord writers and two competing R2 sync loops.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jmusicbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jmusicbot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
      annotations:
        # Roll the pod automatically when config.txt changes. `kubectl create
        # secret ... --dry-run=client -o yaml | kubectl apply -f -` updates the
        # Secret, but a subPath mount (see below) never sees the update — bump
        # this value, or just `kubectl rollout restart`, to pick it up.
        homelab/config-revision: "1"
    spec:
      serviceAccountName: jmusicbot-sa
      # Zero Kubernetes API access required. No token is projected.
      automountServiceAccountToken: false
      # Both independent sites may run this Deployment, but only the site
      # holding the resource-scoped witness lease may open Discord. The other
      # pod waits without creating a JDA session until the lease is available.
      env:
        - name: JMUSICBOT_SITE
          valueFrom:
            secretKeyRef:
              name: jmusicbot-witness
              key: JMUSICBOT_SITE
        - name: JMUSICBOT_WITNESS_URL
          valueFrom:
            secretKeyRef:
              name: jmusicbot-witness
              key: JMUSICBOT_WITNESS_URL
        - name: JMUSICBOT_WITNESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jmusicbot-witness
              key: JMUSICBOT_WITNESS_SECRET
        - name: JMUSICBOT_WITNESS_RESOURCE
          value: "jmusicbot"
        - name: JMUSICBOT_LEASE_SECONDS
          value: "30"
      # java is PID 1 inside this image (verified: `docker top` shows only the
      # java process, so /app/entrypoint.sh exec's it), so SIGTERM reaches the
      # JVM directly and 30s is ample for a clean Discord disconnect.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup makes the kubelet chgrp+setgid the restored state directory to
        # 10001 on mount, ensuring the bot can write its mutable state.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # ===================================================================
      # R2 backup/restore for the `config` emptyDir (HA-EXPANSION.md, #191)
      # ===================================================================
      # `config` used to be the jmusicbot-config PVC. local-path PVCs pin a
      # pod to whichever node created them, which blocks cross-node
      # scheduling -- the same reason pantry-bot moved off a PVC (see its
      # 40-deployment.yaml "STEP B"). This mirrors that pattern, but for
      # plain files (serversettings.json, youtubetoken.txt, ...) instead of
      # a SQLite db, so it uses rclone sync/copy against R2 instead of
      # Litestream (which is SQLite-specific and doesn't apply here).
      #
      # Reuses pantry-bot's existing R2 account (same bucket,
      # `pantry-bot-backups`, under a `jmusicbot/` prefix) rather than
      # standing up new object storage -- approved 2026-09-08. Credentials
      # are a copy of pantry-bot-litestream's, stored as the jmusicbot-r2
      # Secret in this namespace.
      #
      # config.txt and its numbered .bak files are deliberately excluded
      # from both directions: config.txt is delivered read-only from the
      # jmusicbot-config-txt Secret (already durable, no PVC involvement),
      # and the .bak files are JMusicBot's own internal churn with no
      # standalone value.
      initContainers:
        - name: restore-state
          image: rclone/rclone:1.69.1
          # A first-ever deploy has nothing at this R2 prefix yet -- `rclone
          # copy` against a path that doesn't exist on the remote just
          # copies zero files and exits 0, so this is safe on a fresh
          # namespace too, not just a real restore.
          command:
            - sh
            - -c
            - rclone copy r2:pantry-bot-backups/jmusicbot/ /musicbot/ --exclude '.jmusicbot-lease-owner' --config=/dev/null
          env: &r2-env
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Cloudflare
            - name: RCLONE_CONFIG_R2_ENDPOINT
              value: https://0d22ee71e5473142b1678cb7005f80f8.r2.cloudflarestorage.com
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: jmusicbot-r2
                  key: R2_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jmusicbot-r2
                  key: R2_SECRET_ACCESS_KEY
          volumeMounts:
            - name: config
              mountPath: /musicbot
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: jmusicbot
          # Published multi-arch image. GitHub Actions updates this immutable
          # tag on each approved release; keep this value usable for restore.
          # `potok` adds ytpotoken/ytvisitordata support (Web client poToken,
          # see scripts/patches/jmusicbot-potoken.patch) — k8s-homelab#41.
          image: ghcr.io/chayzx/jmusicbot:upstream-0.7.0-3e3116039c64
          imagePullPolicy: IfNotPresent  # see header note 1 — do not change
          # Health endpoint: a JDK-built-in HttpServer on
          # 9091 in the patched image. /health returns 200 only after the bot
          # has logged into Discord; /live returns 200 whenever the JVM is
          # alive. Named port so the probes and the Service can reference it.
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
          # Readiness: GET /health — 503 while the bot is still starting or
          # can't log in, 200 once StartupLifecycleListener sees the Discord
          # ReadyEvent. While 503 the pod stays NotReady (no Service endpoints,
          # Kuma sees the monitor as down).
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: GET /live — 200 whenever the JVM is alive. Deliberately
          # NOT /health: a Discord auth/connect failure or a slow login must
          # not make the kubelet restart the pod (JMusicBot retries the login
          # itself). The liveness probe only catches a wedged/dead process.
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          # NOTE — JVM heap sizing changes under a memory limit.
          # The JVM reads the cgroup limit and defaults MaxRAMPercentage to 25%,
          # so limits.memory=1Gi gives a ~256Mi max heap. Today the container is
          # unlimited inside the Docker Desktop VM (3.7GiB) and uses ~285MiB
          # RSS with a much larger heap available. If you see GC thrash or an
          # OOMKill after cutover, prefer tuning the JVM over raising the limit:
          #   env:
          #     - name: JAVA_OPTS
          #       value: "-XX:MaxRAMPercentage=70"
          # (Confirm the image's entrypoint honours JAVA_OPTS before relying on
          # it; if it does not, raise limits.memory instead.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem is NOT set: the JVM writes to /tmp and
            # lavaplayer buffers there. Enabling it needs an emptyDir at /tmp.
          volumeMounts:
            - name: config
              mountPath: /musicbot
            # config.txt is delivered from a Secret and mounted as a single
            # file INTO the R2-restored state directory. Two consequences to know:
            #  * subPath mounts do not receive Secret updates — the file is
            #    snapshotted at pod start. Restart the pod to apply changes.
            #  * the file is read-only. JMusicBot reads config.txt and writes
            #    its mutable state to serversettings.json (synchronized to R2), so this
            #    is fine. If a future version needs to rewrite config.txt, see
            #    the initContainer alternative documented in README.md.
            - name: config-txt
              mountPath: /musicbot/config.txt
              subPath: config.txt
              readOnly: true
        - name: r2-sync
          image: rclone/rclone:1.69.1
          # Periodic, not continuous: unlike pantry-bot's SQLite (which
          # Litestream streams change-by-change), these are plain files that
          # change rarely (serversettings.json on a config change,
          # youtubetoken.txt on OAuth refresh) -- a 5-minute sync loop is
          # more than tight enough and far simpler than an inotify watcher.
          # Only the Java owner writes .jmusicbot-lease-owner after acquiring
          # the witness lease. A standby therefore restores but never syncs
          # its stale state back into the shared R2 prefix.
          command:
            - sh
            - -c
            - |
              while true; do
                if [ -f /musicbot/.jmusicbot-lease-owner ]; then
                  rclone sync /musicbot r2:pantry-bot-backups/jmusicbot/ \
                    --exclude 'config.txt' --exclude 'config.txt.bak*' \
                    --exclude '.jmusicbot-lease-owner' \
                    --config=/dev/null --quiet
                fi
                sleep 300
              done
          env: *r2-env
          volumeMounts:
            - name: config
              mountPath: /musicbot
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          # Was a PersistentVolumeClaim (jmusicbot-config, local-path) --
          # switched to emptyDir + R2 restore/sync above so this pod isn't
          # pinned to whichever node happens to hold the PVC. See the
          # initContainers comment above for the full rationale.
          emptyDir: {}
        - name: config-txt
          secret:
            secretName: jmusicbot-config-txt
            # 0440 (not 0400): with fsGroup the file is owned root:10001, so
            # the group bit is what makes it readable by the bot.
            defaultMode: 0440
            items:
              - key: config.txt
                path: config.txt
