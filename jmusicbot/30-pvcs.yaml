# Persistent storage for the jmusicbot namespace.
#
# storageClassName is pinned explicitly to `local-path` rather than relying on
# the default-StorageClass annotation — if the default ever changes, a PVC that
# silently binds somewhere else is a very quiet way to lose state.
#
# accessModes RWO is correct and sufficient: single node, and every consuming
# Deployment uses `strategy: Recreate` so the old pod fully terminates and
# releases the volume before the replacement mounts it.
#
# local-path provisions with `WaitForFirstConsumer`, so these PVCs will sit in
# Pending until their Deployment schedules a pod. That is expected, not a fault.
#
# `jmusicbot-config` (serversettings.json, youtubetoken.txt, etc.) was
# removed from here 2026-09-08 -- a local-path PVC pins the pod to whichever
# node created it, blocking cross-node scheduling. jmusicbot/
# 40-deployment-jmusicbot.yaml now uses an emptyDir there instead, restored
# from and synced to R2 on every start (see that file's comments). Any
# PersistentVolume/PVC left over from the old `jmusicbot-config` claim can
# be deleted once the new emptyDir path is verified working.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jmusicbot-notifier-data
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot-release-notifier
    app.kubernetes.io/part-of: homelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      # Replaces /home/chase/docker/jmusicbot/release-notifier-data -> /data.
      # Contains exactly one file: last_release.json (17 bytes).
      storage: 256Mi
