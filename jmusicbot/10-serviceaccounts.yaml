# Dedicated ServiceAccount per app, least privilege.
#
# Neither of these workloads talks to the Kubernetes API — jmusicbot talks to
# Discord/YouTube, the notifier talks to GitHub and a Discord webhook. So both
# get a ServiceAccount with NO Role/RoleBinding attached at all (an SA with no
# bindings can do nothing except authenticate), and both pods additionally set
# `automountServiceAccountToken: false` so no token is even projected into the
# container filesystem.
#
# `automountServiceAccountToken: false` is set here on the ServiceAccount too,
# as defence in depth: if someone later adds a pod in this namespace and forgets
# the pod-level flag, it still will not get a token by default.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jmusicbot-sa
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jmusicbot-release-notifier-sa
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot-release-notifier
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
