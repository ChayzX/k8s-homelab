# Oracle physical standby for Authentik's home PostgreSQL authority.
#
# This is a warm standby only. It must not receive Authentik application
# traffic or writes until the external fencing/promotion procedure changes its
# role and endpoint. Secret values are provisioned out of band.
apiVersion: v1
kind: Service
metadata:
  name: auth-postgresql-standby
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-postgresql-standby
    app.kubernetes.io/part-of: authentik
    authentik.postgres/role: standby
spec:
  selector:
    app.kubernetes.io/name: auth-postgresql-standby
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgresql-standby
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-postgresql-standby
    app.kubernetes.io/part-of: authentik
    authentik.postgres/role: standby
spec:
  serviceName: auth-postgresql-standby
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-postgresql-standby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-postgresql-standby
        app.kubernetes.io/part-of: authentik
        authentik.postgres/role: standby
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: basebackup
          image: postgres:17.10-bookworm
          envFrom:
            - secretRef:
                name: auth-postgresql-standby
          command: ["sh", "-ec"]
          args:
            - |
              if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
                exit 0
              fi
              until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER"; do sleep 3; done
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /tmp/pgpass
              chmod 600 /tmp/pgpass
              PGPASSFILE=/tmp/pgpass pg_basebackup \
                -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER" \
                -D /var/lib/postgresql/data -Fp -Xs -P -R -S "$PRIMARY_SLOT_NAME"
              printf "primary_conninfo = 'host=%s port=%s user=%s password=%s application_name=auth-oracle-standby'\nprimary_slot_name = '%s'\n" \
                "$PRIMARY_HOST" "$PRIMARY_PORT" "$REPLICATION_USER" "$REPLICATION_PASSWORD" "$PRIMARY_SLOT_NAME" \
                >> /var/lib/postgresql/data/postgresql.auto.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17.10-bookworm
          args:
            - -c
            - hot_standby=on
            - -c
            - wal_receiver_timeout=10s
            - -c
            - max_connections=500
          envFrom:
            - secretRef:
                name: auth-postgresql-standby
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
