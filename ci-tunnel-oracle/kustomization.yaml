apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../ci-tunnel
patches:
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared
      namespace: ci-tunnel
  - path: service-patch.yaml
    target:
      version: v1
      kind: Service
      name: cloudflared
      namespace: ci-tunnel
