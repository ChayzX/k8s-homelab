# =============================================================================
# pantry-bot — Twitch bot + Express HTTP/WS server + SQLite
# =============================================================================
# THIS IS THE CANONICAL SOURCE (k8s-homelab-0br). A deploy-time copy lives at
# pantry-bot repo's k8s/deployment.yaml, applied by that repo's deploy.yml --
# no automated sync, whenever this file changes, copy it there too.
#
# Replaces the `bot` service in
# /home/chase/Downloads/pantry-bot/docker-compose.prod.yml
#
# -----------------------------------------------------------------------------
# DEPLOY PIPELINE (k8s-homelab-oiv, cut over 2026-08-13)
# -----------------------------------------------------------------------------
# CI pushes to main -> GitHub Actions publishes ghcr.io/chayzx/pantry-bot:latest
# (publish.yml, automatic) -> a human clicks "Run workflow" on deploy.yml,
# which reaches this cluster's private API through a dedicated Cloudflare
# Tunnel + Access route (../k8s-homelab/ci-tunnel/) and runs `kubectl set
# image` + `rollout restart` + `rollout status`, with `rollout undo` on
# failure. Manual-click by design -- GitHub's paid-only "required reviewers"
# environment protection isn't available on this private repo's free plan,
# so a workflow_dispatch-only deploy workflow is the substitute: build
# feedback stays automatic, nothing touches the cluster unattended.
#
# Previously Keel (poll-based, fully automatic, `keel.sh/*` annotations here)
# filled this role -- retired after a real incident (k8s-homelab-9nb: Keel's
# separate registry credential silently expired, deploys stopped for a full
# day with zero alerting) exposed its main weakness: a background process
# whose failure nobody watches. Manual-click means whoever deploys directly
# sees the GitHub Actions result in real time. `keel` namespace/manifests
# removed from this repo; see k8s-homelab-oiv.6.
#
# -----------------------------------------------------------------------------
# `imagePullSecrets: ghcr-pull-secret` (below) is used by the KUBELET to PULL
# the image. Without it: ImagePullBackOff. ghcr.io/chayzx/pantry-bot is
# private (verified: anonymous manifest fetch returns HTTP 403).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pantry-bot
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-bot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  # Recreate: RWO PVC holding a live SQLite database in WAL mode. A rolling
  # update would overlap two writers on one DB file — the exact corruption
  # hazard the migration plan calls out.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-bot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: pantry-bot-sa
      # Zero Kubernetes API access required.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      # 60s (not the 30s default): give the process time to close SQLite
      # cleanly and checkpoint the WAL back into pantry.db on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID 1000 = the `node` user baked into the image. Verified against the
        # running container (`docker top pantry-bot-bot-1 -o user,group`), not
        # assumed from the base image. The extracted volume contents must be
        # chowned to 1000:1000 — see README.md.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bot
          image: ghcr.io/chayzx/pantry-bot:latest
          # Always: mutable `:latest` tag. Keel patches the pod spec with a
          # digest-pinned reference on update, but on a manual restart Always is
          # what guarantees the newest build is fetched rather than a stale
          # cached layer set.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ws
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pantry-bot-config
            # TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET — see SECRETS.md.
            - secretRef:
                name: pantry-bot-twitch
            # DISCORD_ALERT_WEBHOOK_URL — optional (bot degrades gracefully
            # without it, see src/discordAlert.ts). Not required: create it
            # only if you want operational alerts (fatal errors, lost
            # Twitch connections) posted to a Discord channel. See SECRETS.md.
            - secretRef:
                name: pantry-bot-discord-alerts
                optional: true

          # ===================================================================
          # PROBES — read this before "simplifying" them to httpGet
          # ===================================================================
          # The Compose healthcheck was:
          #   node -e "require('http').get('http://localhost:3000/',
          #            r => process.exit(0)).on('error', () => process.exit(1))"
          # and its own comment says a response "even a 404" proves the server
          # is alive. That is not a stylistic note — it is load-bearing.
          #
          # VERIFIED: GET / on this app returns **404**. Checked through the
          # live tunnel; the response carries `x-powered-by: Express`, so the
          # 404 is generated by this Express app, not by Cloudflare. There is
          # no /health or /healthz either (both 404); /oauth/callback returns
          # 400, confirming the origin is what is answering.
          #
          # Kubernetes httpGet probes succeed ONLY on HTTP 200-399. A
          # `httpGet: path: /, port: 3000` probe would therefore fail on every
          # single check: readiness would pin the pod NotReady forever, and
          # liveness would restart it every ~30s into permanent
          # CrashLoopBackOff. On a healthy app. This is the single most
          # dangerous line in the whole pantry-bot migration.
          #
          # So the probe below replicates the proven Compose check exactly —
          # same one-liner, same image, same semantics ("any response = alive").
          # `node` is guaranteed present (this is a Node app) and the image has
          # no curl or wget, which is why the original used node in the first
          # place.
          #
          # PREFERRED FIX (do this in the app, then switch the probes):
          # add a route returning 200:
          #     app.get('/healthz', (_req, res) => res.status(200).send('ok'))
          # then replace both probes with the far cheaper:
          #     httpGet: {path: /healthz, port: http}
          # Until that route exists and has been verified to return 200, keep
          # the exec probes.
          # ===================================================================

          # Replaces Compose's `start_period: 15s`. Until this succeeds the
          # liveness probe is not armed, so a slow start cannot cause a restart
          # loop. 10 x 3s = up to 30s of startup grace.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/', r => process.exit(0)).on('error', () => process.exit(1))"
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/', r => process.exit(0)).on('error', () => process.exit(1))"
            # k8s-homelab-5gt: this only proves "HTTP server responds," not
            # "Twitch chat/EventSub actually connected" -- eventSub.connect()
            # in bot/index.ts is fire-and-forget, not awaited, so the HTTP
            # server can be up well before the bot is functionally ready.
            # initialDelaySeconds forces a stabilization window post-startup
            # before the Service marks this pod Ready and Recreate's old pod
            # (already gone) gets replaced with traffic flowing here -- cheap,
            # zero app-code risk. Does not eliminate Recreate's downtime gap
            # (deliberate, SQLite WAL corruption risk with concurrent
            # writers), just avoids stretching it with a falsely-ready pod.
            initialDelaySeconds: 15
            periodSeconds: 30      # matches Compose `interval: 30s`
            timeoutSeconds: 5      # matches Compose `timeout: 5s`
            failureThreshold: 3    # matches Compose `retries: 3`

          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/', r => process.exit(0)).on('error', () => process.exit(1))"
            periodSeconds: 30
            timeoutSeconds: 5
            # 5, not 3: a liveness failure kills the pod and, with Recreate +
            # an RWO PVC, means real downtime. Readiness already pulls the pod
            # out of the Service after 90s; liveness should be the slower,
            # more certain signal.
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pantry-bot-data
