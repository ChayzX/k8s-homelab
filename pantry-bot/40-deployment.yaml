# =============================================================================
# pantry-bot — Twitch bot + Express HTTP/WS server + SQLite
# =============================================================================
# THIS IS THE CANONICAL SOURCE (k8s-homelab-0br). A deploy-time copy lives at
# pantry-bot repo's k8s/deployment.yaml, applied by that repo's deploy.yml --
# no automated sync, whenever this file changes, copy it there too.
#
# Replaces the `bot` service in
# /home/chase/Downloads/pantry-bot/docker-compose.prod.yml
#
# -----------------------------------------------------------------------------
# DEPLOY PIPELINE (single consolidated workflow, see k8s-homelab-os2)
# -----------------------------------------------------------------------------
# A merge to `main` IS the production approval -- one "PantryBot CI/CD"
# workflow (pantry-bot's .github/workflows/deploy.yml) builds+publishes
# ghcr.io/chayzx/pantry-bot:latest, reaches this cluster's private API
# through a dedicated Cloudflare Tunnel + Access route
# (../k8s-homelab/ci-tunnel/), and runs `kubectl apply` on this manifest +
# `kubectl set image` + `rollout restart` + `rollout status`, with
# `rollout undo` on failure -- all in the same run, on every push to main
# (docs-only changes excepted via paths-ignore). No second click:
# see k8s-homelab/DEPLOYING.md's trigger matrix. (This superseded an
# earlier two-stage design -- automatic publish.yml, then a manual
# workflow_dispatch-only deploy.yml -- from k8s-homelab-oiv's 2026-08-13
# cutover; that stage split is retired, not the current behavior.)
#
# Previously Keel (poll-based, fully automatic, `keel.sh/*` annotations here)
# filled this role -- retired after a real incident (k8s-homelab-9nb: Keel's
# separate registry credential silently expired, deploys stopped for a full
# day with zero alerting) exposed its main weakness: a background process
# whose failure nobody watches. The current pipeline means whoever merges
# sees the GitHub Actions result in real time. `keel` namespace/manifests
# removed from this repo; see k8s-homelab-oiv.6.
#
# -----------------------------------------------------------------------------
# `imagePullSecrets: ghcr-pull-secret` (below) is used by the KUBELET to PULL
# the image. Without it: ImagePullBackOff. ghcr.io/chayzx/pantry-bot is
# private (verified: anonymous manifest fetch returns HTTP 403).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pantry-bot
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-bot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  # Retired legacy single-process bot. The split PostgreSQL-backed roles in
  # 61-66 are the production application; keep this object declaratively
  # stopped so a broad apply cannot resurrect the old SQLite path.
  replicas: 0
  # Recreate remains documented for isolated restore/recovery use only.
  # Originally this guarded against two pods sharing one RWO PVC; as of STEP B
  # (data now lives on an emptyDir restored from R2 on every start, not a
  # PVC -- see the restore-db initContainer and k8s-homelab-0br's follow-up)
  # the hazard is the same but the storage underneath it changed: Recreate is
  # what guarantees the old pod's litestream sidecar has fully stopped
  # writing before the new pod's restore reads the replica, not just what
  # prevents two pods mounting the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-bot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: pantry-bot-sa
      # Zero Kubernetes API access required.
      automountServiceAccountToken: false
      # No node affinity/selector, deliberately: pinning to one node just
      # relocates the single point of failure instead of removing it. Real
      # cross-node continuity depends on the control plane having quorum
      # somewhere other than the node that died (see HA-EXPANSION.md) --
      # this pod is free to land wherever the scheduler puts it.
      #
      # Default NoExecute tolerations for not-ready/unreachable are 300s;
      # shortened here so a real node loss reschedules in ~20s instead of
      # 5 minutes once a live control plane can act on it. This has no
      # effect on a home outage while minecraftmachine is the sole k3s
      # server -- there's no API server left to reschedule anything until
      # that changes.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 20
      imagePullSecrets:
        - name: ghcr-pull-secret
      # ===================================================================
      # STEP B: restore-on-start (k8s-homelab-0br follow-up, see #177)
      # ===================================================================
      # Runs before the `bot` container starts. `data` below is an emptyDir,
      # not a PVC -- it starts empty every time this pod is scheduled,
      # whether that's the same node as last time or a different one after a
      # node failure. This restore is what actually makes cross-node
      # failover work; without it, a rescheduled pod would just start with
      # an empty database.
      #
      # Verified against the real replica before this went in (not assumed
      # from replication looking healthy): a manual `litestream restore` into
      # a scratch file reproduced the exact same `users` row count as the
      # live database. Restoring is fundamentally different from replicating
      # and either can be broken independently -- see #177's discussion.
      initContainers:
        - name: restore-db
          image: litestream/litestream:0.3.13
          # -if-db-not-exists: makes this a no-op if /data/pantry.db is
          # already present. emptyDir survives a plain container restart
          # within the same pod (only a full pod reschedule wipes it), so
          # without this flag a crash-loop on the bot container would
          # re-run this restore every time and clobber whatever the running
          # instance had already written locally with an older snapshot.
          command:
            - litestream
            - restore
            - -config
            - /etc/litestream.yml
            - -if-db-not-exists
            - /data/pantry.db
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-litestream
                  key: LITESTREAM_ACCESS_KEY_ID
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-litestream
                  key: LITESTREAM_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # 60s (not the 30s default): give the process time to close SQLite
      # cleanly and checkpoint the WAL back into pantry.db on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID 1000 = the `node` user baked into the image. Verified against the
        # running container (`docker top pantry-bot-bot-1 -o user,group`), not
        # assumed from the base image. The extracted volume contents must be
        # chowned to 1000:1000 — see README.md.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bot
          image: ghcr.io/chayzx/pantry-bot:latest
          # Always: mutable `:latest` tag. Keel patches the pod spec with a
          # digest-pinned reference on update, but on a manual restart Always is
          # what guarantees the newest build is fetched rather than a stale
          # cached layer set.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ws
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pantry-bot-config
            # TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET / OAUTH_ADMIN_PASSWORD.
            - secretRef:
                name: pantry-bot-twitch
            # DISCORD_ALERT_WEBHOOK_URL — optional (bot degrades gracefully
            # without it, see src/discordAlert.ts). Not required: create it
            # only if you want operational alerts (fatal errors, lost
            # Twitch connections) posted to a Discord channel. See SECRETS.md.
            - secretRef:
                name: pantry-bot-discord-alerts
                optional: true
            # AUTHENTIK_ENROLLMENT_WEBHOOK_SECRET — optional (src/enrollment/webhook.ts
            # returns 503 and ignores the request until this is set, see #92).
            # Shared secret Authentik's NotificationTransport sends as the
            # `x-webhook-secret` header on POST /internal/authentik-enrollment.
            # Create the Secret in the pantry-bot namespace with a single key
            # named AUTHENTIK_ENROLLMENT_WEBHOOK_SECRET before this does
            # anything; see SECRETS.md for how the sibling secrets above are
            # provisioned.
            - secretRef:
                name: pantry-bot-authentik-webhook
                optional: true

          # ===================================================================
          # PROBES — read this before "simplifying" them to httpGet
          # ===================================================================
          # The Compose healthcheck was:
          #   node -e "require('http').get('http://localhost:3000/',
          #            r => process.exit(0)).on('error', () => process.exit(1))"
          # and its own comment says a response "even a 404" proves the server
          # is alive. That is not a stylistic note — it is load-bearing.
          #
          # Startup and liveness intentionally remain shallow process checks:
          # any HTTP response proves Express is accepting connections, and
          # missing Twitch credentials should not cause a restart loop.
          # Readiness uses /ready so the OAuth recovery routes remain reachable
          # even when Twitch credentials are absent. /health separately reports
          # missing integrations as degraded for monitoring and alerting.
          # ===================================================================

          # Replaces Compose's `start_period: 15s`. Until this succeeds the
          # liveness probe is not armed, so a slow start cannot cause a restart
          # loop. 10 x 3s = up to 30s of startup grace.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/', r => process.exit(0)).on('error', () => process.exit(1))"
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            # The stabilization delay gives the HTTP/SQLite service time to settle.
            # initialDelaySeconds forces a stabilization window post-startup
            # before the Service marks this pod Ready and Recreate's old pod
            # (already gone) gets replaced with traffic flowing here -- cheap,
            # zero app-code risk. Does not eliminate Recreate's downtime gap
            # (deliberate, SQLite WAL corruption risk with concurrent
            # writers), just avoids stretching it with a falsely-ready pod.
            initialDelaySeconds: 15
            periodSeconds: 30      # matches Compose `interval: 30s`
            timeoutSeconds: 5      # matches Compose `timeout: 5s`
            failureThreshold: 3    # matches Compose `retries: 3`

          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/', r => process.exit(0)).on('error', () => process.exit(1))"
            periodSeconds: 30
            timeoutSeconds: 5
            # 5, not 3: a liveness failure kills the pod and, with Recreate +
            # an RWO PVC, means real downtime. Readiness already pulls the pod
            # out of the Service after 90s; liveness should be the slower,
            # more certain signal.
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data

        # ===================================================================
        # litestream — continuous SQLite backup to R2 (STEP A, see
        # 25-configmap-litestream.yaml header comment for the full context).
        # Reads the same /data the bot writes to (now an emptyDir restored by
        # the initContainer above, as of STEP B), ships changes to R2.
        # ===================================================================
        - name: litestream
          image: litestream/litestream:0.3.13
          args: ["replicate", "-config", "/etc/litestream.yml"]
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-litestream
                  key: LITESTREAM_ACCESS_KEY_ID
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-litestream
                  key: LITESTREAM_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # emptyDir, not a PVC (as of STEP B, #177) -- node-local and
        # disposable by design. The restore-db initContainer above populates
        # it from the R2 replica on every pod start; the litestream sidecar
        # keeps shipping changes back out continuously. This is what lets the
        # pod actually reschedule onto a different node (a PVC using
        # `local-path` storage is pinned to whichever node created it and
        # would leave a rescheduled pod stuck Pending forever).
        - name: data
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: pantry-bot-litestream-config
