# Oracle PantryBot primary. This file is installed on the retained PostgreSQL
# PVC by the reviewed procedure in docs/recovery/PANTRYBOT-POSTGRES-ACCESS-412.md.
# Kubernetes manifest apply does not update the live pg_hba.conf.

# Database health checks and operator recovery use the local Unix socket.
local   pantry          pantry                                  trust

# All serving apps and PostgreSQL maintenance jobs use the Oracle pod CIDR.
host    pantry          pantry          10.42.0.0/24            scram-sha-256

# Home Grafana uses its dedicated read-only role over the Tailnet route.
host    pantry          pantry_grafana  100.84.89.87/32         scram-sha-256

# No remote replication clients remain; reject all other TCP paths.
host    replication     all             0.0.0.0/0               reject
host    replication     all             ::/0                    reject
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
