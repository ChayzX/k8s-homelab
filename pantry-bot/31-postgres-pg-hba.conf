# Candidate for the Oracle PantryBot primary only. See
# docs/recovery/PANTRYBOT-POSTGRES-ACCESS-412.md before installing this file.
# This file is not mounted by the StatefulSet; applying Kubernetes manifests
# does not change the live PVC's pg_hba.conf.

# Unix-socket health checks and operator access inside the database container.
# Do not trust 127.0.0.1 TCP: with hostNetwork, Oracle host processes also
# reach that listener.
local   pantry          pantry                                  trust

# Oracle k3s pod CIDR, verified on 2026-10-10. App roles and both maintenance
# CronJobs use the pantry-postgres Service and authenticate as pantry.
host    pantry          pantry          10.42.0.0/24            scram-sha-256

# Home Grafana's current superuser connection is retained only until #414
# verifies the dedicated pantry_grafana role. Remove the pantry rule in a
# reviewed second HBA reload before #415 rotates its password.
host    pantry          pantry          100.84.89.87/32         scram-sha-256
host    pantry          pantry_grafana  100.84.89.87/32         scram-sha-256

# No remote replication clients remain. Deny all other network connections,
# including the retired Canada, Home, and Docker bridge replication paths.
host    replication     all             0.0.0.0/0               reject
host    replication     all             ::/0                    reject
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
