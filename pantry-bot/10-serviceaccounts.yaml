# Dedicated ServiceAccount per app, least privilege.
#
# Neither workload in this namespace needs Kubernetes API access:
#   * pantry-bot talks to Twitch and its own SQLite file.
#   * cloudflared talks to Cloudflare's edge and to pantry-bot over ClusterIP.
# Both therefore get an SA with NO Role/RoleBinding attached, and both pods set
# `automountServiceAccountToken: false`.
#
# Note on Keel: Keel does NOT use these ServiceAccounts. It runs under its own
# SA in the `keel` namespace and reaches in here via a cluster-wide ClusterRole
# (see ../keel/). Nothing in this namespace needs to grant Keel anything.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantry-bot-sa
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-bot
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-sa
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
---
# Dedicated identity for the public commands tunnel. It has no Role or
# RoleBinding and is deliberately separate from the shared tunnel identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: commands-cloudflared-sa
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: commands-cloudflared
    app.kubernetes.io/part-of: pantry-bot
automountServiceAccountToken: false
