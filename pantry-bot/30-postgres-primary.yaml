# PantryBot's PostgreSQL primary on Oracle.
#
# Renamed from postgres-authority-standby-oracle-v2 on 2026-09-25. The old name
# carried "standby" while being the primary, and that cost real time twice
# during the migration: once working out which database was authoritative, and
# once when a Service selector pinned a StatefulSet name that no longer matched,
# leaving the replication NodePort with zero endpoints while replication still
# reported healthy lag on an already-open connection.
#
# The Service selects on pantrybot.postgres/role=primary ALONE, deliberately. A
# selector naming a StatefulSet breaks silently the moment the database is
# renamed or replaced, and a Service that must be hand-edited on every rename is
# one that will be forgotten -- which is exactly what happened.
#
# There is no initContainer: this is the primary, not a standby seeded by
# pg_basebackup. PantryBot is single-site, so the recovery path is the nightly
# dump to R2 (k8s/ha/base/postgres-backup-cronjob.yaml in the pantry-bot repo),
# not replication.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: pantry-postgres
    homelab/production: 'true'
    pantrybot.postgres/role: standby
  name: pantry-postgres
  namespace: pantry-bot
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres
  serviceName: pantry-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres
        pantrybot.postgres/role: primary
    spec:
      containers:
      - args:
        - -c
        - hot_standby=on
        - -c
        - wal_receiver_timeout=10s
        envFrom:
        - secretRef:
            name: pantry-bot-postgres-standby
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test "$(psql -U pantry -d pantry -Atc "select (not pg_is_in_recovery())
              or exists(select 1 from pg_stat_wal_receiver where status='streaming')")"
              = t
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
      storageClassName: local-path
      volumeMode: Filesystem
    status:
      phase: Pending
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: pantry-postgres
    app.kubernetes.io/part-of: pantrybot
  name: pantry-postgres
  namespace: pantry-bot
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    pantrybot.postgres/role: primary
  type: ClusterIP
