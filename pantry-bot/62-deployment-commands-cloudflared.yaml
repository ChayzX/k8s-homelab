# Dedicated connector for commands.greeniespantry.uk only.
#
# Apply this same manifest once to the home cluster and once to the independent
# Oracle cluster. Each environment gets one connector for the same remotely
# managed tunnel. The tunnel's control-plane ingress must contain only:
#
#   commands.greeniespantry.uk ->
#     http://pantry-commands-site.pantry-bot.svc.cluster.local:3000
#   catch-all -> http_status:404
#
# The token is provisioned out of band as the Kubernetes Secret named below.
# This file must never contain a token value. The shared `cloudflared`
# Deployment and `cloudflared-tunnel` Secret are intentionally untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commands-cloudflared
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: commands-cloudflared
    app.kubernetes.io/part-of: pantry-bot
    app.kubernetes.io/component: public-tunnel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: commands-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commands-cloudflared
        app.kubernetes.io/part-of: pantry-bot
        app.kubernetes.io/component: public-tunnel
    spec:
      serviceAccountName: commands-cloudflared-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: cloudflared
          # Pinned multi-architecture image shared with the established
          # connector manifest; no tag-only production pull.
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: commands-cloudflared-tunnel-token
                  key: TUNNEL_TOKEN
            # HTTP/2 is the proven transport for the home network; using the
            # same setting in both environments avoids QUIC/UDP idle timeout
            # behavior changing during failover.
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
