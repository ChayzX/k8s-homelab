# Reversible home-side physical standby used while Oracle is the current
# PantryBot writer. It deliberately has a new StatefulSet/PVC name so the
# stranded ChaseBot-local failback volume remains intact and recoverable.
#
# Create the Secret out of band with the current PantryBot authority and
# replication credentials. Do not commit values:
#   pantry-bot-postgres-home-return
#
# This is a standby only. Do not attach it to postgres-authority or point
# application writers at it until the old Oracle writer is fenced and the
# promotion runbook is being executed.
apiVersion: v1
kind: Service
metadata:
  name: postgres-authority-home-return
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-home-return
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/role: standby
spec:
  selector:
    app.kubernetes.io/name: pantry-postgres-authority-home-return
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authority-home-return
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-home-return
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/failback: home
    pantrybot.postgres/role: standby
spec:
  serviceName: postgres-authority-home-return
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres-authority-home-return
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres-authority-home-return
        app.kubernetes.io/part-of: pantrybot
        homelab/production: "true"
        pantrybot.postgres/failback: home
        pantrybot.postgres/role: standby
    spec:
      nodeSelector:
        kubernetes.io/hostname: minecraftmachine
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: basebackup
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-home-return
          command: ["sh", "-ec"]
          args:
            - |
              if [ -n "$(find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                exit 0
              fi
              until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER"; do sleep 3; done
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /tmp/pgpass
              chmod 600 /tmp/pgpass
              PGPASSFILE=/tmp/pgpass pg_basebackup \
                -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER" \
                -D /var/lib/postgresql/data -Fp -Xs -P -R -C -S "$PRIMARY_SLOT_NAME"
              printf "primary_conninfo = 'host=%s port=%s user=%s password=%s application_name=pantry-home-return'\nprimary_slot_name = '%s'\n" \
                "$PRIMARY_HOST" "$PRIMARY_PORT" "$REPLICATION_USER" "$REPLICATION_PASSWORD" "$PRIMARY_SLOT_NAME" \
                >> /var/lib/postgresql/data/postgresql.auto.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "hot_standby=on", "-c", "wal_receiver_timeout=10s"]
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-home-return
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
        storageClassName: local-path
