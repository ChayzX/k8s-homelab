# PRODUCTION BOOTSTRAP PATH — applied only after the external-secret escrow
# gate passed. Migration, replication, and promotion remain separate gates.
#
# This is a single home PostgreSQL authority only. It contains the PostgreSQL
# WAL prerequisites for a future externally transported standby, but no
# replication client, promotion, or fencing resources. The legacy PantryBot
# Deployment and Minecraft placement are not part of this manifest.
apiVersion: v1
kind: Service
metadata:
  name: postgres-authority
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/authority: home
spec:
  type: ClusterIP
  # Selects on the role alone, deliberately. Pinning app.kubernetes.io/name
  # too silently breaks the moment the authority moves to a differently-named
  # StatefulSet, which is exactly what happened: the live primary is
  # postgres-authority-standby-home-canada, so a selector naming
  # pantry-postgres-authority matched nothing. See the note on the
  # replication Service below.
  selector:
    pantrybot.postgres/role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-authority-replication
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/transport: replication
spec:
  type: NodePort
  # Role-only for the same reason, and here it mattered enormously.
  #
  # This Service had zero endpoints and NodePort 30432 was closed, because it
  # named pantry-postgres-authority while the live primary is labelled
  # pantry-postgres-authority-standby-home-canada. Replication was still
  # reporting 0.13s lag -- on a TCP connection opened back when the names did
  # match. It could not have re-established. One pod restart, node reboot or
  # eviction and the standby would have been lost silently, with every
  # dashboard still green. It was found only by trying to rebuild a standby
  # during the 2026-09-25 cutover attempt.
  #
  # A Service that has to be edited whenever the authority is renamed is a
  # Service that will be forgotten. The role label already moves with
  # promotion, so follow that and nothing else.
  selector:
    pantrybot.postgres/role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-authority-hba
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
data:
  pg_hba.conf: |
    local all all trust
    host all all 127.0.0.1/32 trust
    host all all ::1/128 trust
    local replication all trust
    host replication all 127.0.0.1/32 trust
    host replication pantry_replicator 192.168.40.200/32 scram-sha-256
    host replication pantry_replicator 10.42.0.0/16 scram-sha-256
    # A standby reaching us through the replication NodePort arrives SNATed to
    # the node's own LAN address, not its Tailscale one -- so the Tailscale
    # entries below are not sufficient on their own. pg_basebackup failed with
    # "no pg_hba.conf entry for replication connection from host
    # 192.168.40.208" until this was added (2026-09-25).
    host replication pantry_replicator 192.168.40.208/32 scram-sha-256
    # The standby and the primary node, reached directly over Tailscale.
    host replication pantry_replicator 100.84.89.87/32 scram-sha-256
    host replication pantry_replicator 100.78.181.15/32 scram-sha-256
    host all all 0.0.0.0/0 scram-sha-256
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authority
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/authority: home
spec:
  serviceName: postgres-authority
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres-authority
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres-authority
        app.kubernetes.io/part-of: pantrybot
        homelab/production: "true"
        pantrybot.postgres/authority: home
        pantrybot.postgres/role: primary
    spec:
      nodeSelector:
        kubernetes.io/hostname: chasebot
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: hba
          configMap:
            name: postgres-authority-hba
      containers:
        - name: postgres
          # Verified multi-architecture manifest digest on 2026-09-10.
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          # These settings only prepare WAL for a future standby. They do not
          # expose PostgreSQL, create a replication role, or authorize a
          # promotion while the old writer may still be reachable.
          args:
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - wal_keep_size=256MB
            - -c
            - max_slot_wal_keep_size=1GB
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-postgres-authority
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-postgres-authority
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pantry-bot-postgres-authority
                  key: POSTGRES_PASSWORD
          securityContext:
            # The official image entrypoint starts as root to fix ownership
            # on a fresh local-path PVC, then drops to the postgres user via
            # gosu before launching the server. Keep the pod non-privileged;
            # grant only the ownership capabilities required during init.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
