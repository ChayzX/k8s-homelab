# Persistent Oracle standby for PantryBot's home PostgreSQL authority.
#
# This manifest is intentionally not part of the normal application overlay.
# It keeps an Oracle database copy in hot standby and is a manual-promotion
# target only until an independent old-writer fence is proven.
apiVersion: v1
kind: Secret
metadata:
  name: pantry-bot-postgres-standby
  namespace: pantry-bot
  labels:
    homelab/production: "true"
    pantrybot.postgres/role: standby
type: Opaque
# Create this Secret out-of-band on Oracle. Never commit values.
stringData:
  POSTGRES_USER: replace-at-apply
  POSTGRES_DB: replace-at-apply
  POSTGRES_PASSWORD: replace-at-apply
  REPLICATION_USER: replace-at-apply
  REPLICATION_PASSWORD: replace-at-apply
  PRIMARY_HOST: "100.78.181.15"
  PRIMARY_PORT: "25432"
  PRIMARY_SLOT_NAME: pantry_oracle_standby
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-authority-standby
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-standby
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/role: standby
spec:
  selector:
    app.kubernetes.io/name: pantry-postgres-authority-standby
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authority-standby
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-standby
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/role: standby
spec:
  serviceName: postgres-authority-standby
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres-authority-standby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres-authority-standby
        app.kubernetes.io/part-of: pantrybot
        homelab/production: "true"
        pantrybot.postgres/role: standby
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: basebackup
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-standby
          command: ["sh", "-ec"]
          args:
            - |
              if [ -n "$(find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                exit 0
              fi
              until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER"; do sleep 3; done
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /tmp/pgpass
              chmod 600 /tmp/pgpass
              PGPASSFILE=/tmp/pgpass pg_basebackup \
                -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER" \
                -D /var/lib/postgresql/data -Fp -Xs -P -R -S "$PRIMARY_SLOT_NAME"
              # Keep the passfile on the standby PVC; never embed the
              # replication password in postgresql.auto.conf.
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /var/lib/postgresql/data/.pgpass
              chmod 600 /var/lib/postgresql/data/.pgpass
              sed -i 's#/tmp/pgpass#/var/lib/postgresql/data/.pgpass#g' /var/lib/postgresql/data/postgresql.auto.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - hot_standby=on
            - -c
            - wal_receiver_timeout=10s
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-standby
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
