# Disposable Oracle-side logical-replication rehearsal only.
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-bot-repl-oracle-20260910
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: pantry-bot-repl-oracle-20260910
type: Opaque
stringData:
  POSTGRES_USER: pantry
  POSTGRES_DB: pantry
  POSTGRES_PASSWORD: replace-at-apply
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pantry-bot-repl-oracle-20260910
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pantry-bot-repl-oracle-20260910
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
          envFrom:
            - secretRef:
                name: postgres
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 384Mi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
