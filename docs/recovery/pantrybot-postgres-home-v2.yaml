apiVersion: v1
kind: Service
metadata:
  name: postgres-authority-home-v2
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-home-v2
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/role: standby
spec:
  selector:
    app.kubernetes.io/name: pantry-postgres-authority-home-v2
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authority-home-v2
  namespace: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-postgres-authority-home-v2
    app.kubernetes.io/part-of: pantrybot
    homelab/production: "true"
    pantrybot.postgres/role: standby
spec:
  serviceName: postgres-authority-home-v2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres-authority-home-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres-authority-home-v2
        app.kubernetes.io/part-of: pantrybot
        homelab/production: "true"
        pantrybot.postgres/role: standby
    spec:
      nodeSelector:
        kubernetes.io/hostname: minecraftmachine
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: hba
          configMap:
            name: postgres-authority-hba
      initContainers:
        - name: basebackup
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-home-failback
          env:
            - name: PRIMARY_HOST
              value: "100.78.181.15"
            - name: PRIMARY_PORT
              value: "5432"
          command: ["sh", "-ec"]
          args:
            - |
              if [ -n "$(find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                if [ -f /var/lib/postgresql/data/standby.signal ]; then exit 0; fi
                test -f /var/lib/postgresql/data/PG_VERSION || {
                  echo 'refusing to start: existing PVC is not PostgreSQL data' >&2
                  exit 1
                }
                echo 'using existing PostgreSQL primary data'
                exit 0
              fi
              until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER"; do sleep 3; done
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /tmp/pgpass
              chmod 600 /tmp/pgpass
              PGPASSFILE=/tmp/pgpass pg_basebackup \
                -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER" \
                -D /var/lib/postgresql/data -Fp -Xs -P -R -C -S pantry_home_v2
              printf "primary_conninfo = 'host=%s port=%s user=%s password=%s application_name=pantry-home-v2'\nprimary_slot_name = 'pantry_home_v2'\n" \
                "$PRIMARY_HOST" "$PRIMARY_PORT" "$REPLICATION_USER" "$REPLICATION_PASSWORD" \
                >> /var/lib/postgresql/data/postgresql.auto.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          args:
            - -c
            - hot_standby=on
            - -c
            - wal_receiver_timeout=10s
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          envFrom:
            - secretRef:
                name: pantry-bot-postgres-home-failback
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
