# Apply only to an independent restore target after an operator has created
# empty placeholder Secrets with these exact names and keys. This manifest is
# intentionally under docs/recovery, not a bootstrap directory, so normal home
# cluster applies do not grant a recovery identity access to live credentials.
#
# The restore identity cannot list, create, delete, or read arbitrary Secrets.
# The one-time placeholder creation is an explicit operator action; after that,
# this Role can update only the two Secrets needed by the first JMusicBot move.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jmusicbot-secret-restore
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot-secret-restore
    app.kubernetes.io/part-of: homelab-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jmusicbot-secret-restore
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot-secret-restore
    app.kubernetes.io/part-of: homelab-recovery
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - jmusicbot-config-txt
      - jmusicbot-r2
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jmusicbot-secret-restore
  namespace: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot-secret-restore
    app.kubernetes.io/part-of: homelab-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jmusicbot-secret-restore
subjects:
  - kind: ServiceAccount
    name: jmusicbot-secret-restore
    namespace: jmusicbot
