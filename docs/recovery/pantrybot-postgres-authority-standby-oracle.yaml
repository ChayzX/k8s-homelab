# Disposable PostgreSQL authority rehearsal only.
# Apply only to a temporary, non-production namespace after the home primary
# NodePort is reachable from Oracle. This standby is not production.
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-bot-authority-rehearsal-oracle
  labels:
    homelab/rehearsal: pantrybot-postgres-authority
    homelab/production: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-authority-rehearsal
  namespace: pantry-bot-authority-rehearsal-oracle
type: Opaque
stringData:
  POSTGRES_USER: pantry
  POSTGRES_DB: pantry
  POSTGRES_PASSWORD: replace-at-apply
  REPLICATION_USER: replicator
  REPLICATION_PASSWORD: replace-at-apply
  PRIMARY_HOST: replace-with-home-reachable-address
  PRIMARY_PORT: "30442"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-authority
  namespace: pantry-bot-authority-rehearsal-oracle
  labels:
    homelab/rehearsal: pantrybot-postgres-authority
spec:
  selector:
    app.kubernetes.io/name: pantry-postgres-authority
    pantrybot.postgres/role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-authority
  namespace: pantry-bot-authority-rehearsal-oracle
  labels:
    homelab/rehearsal: pantrybot-postgres-authority
spec:
  serviceName: postgres-authority
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry-postgres-authority
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry-postgres-authority
        pantrybot.postgres/role: standby
        homelab/rehearsal: pantrybot-postgres-authority
    spec:
      initContainers:
        - name: basebackup
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-authority-rehearsal
          command: ["sh", "-ec"]
          args:
            - |
              test -z "$(find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -print -quit)"
              until pg_isready -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER"; do sleep 3; done
              printf '%s:*:*:%s:%s\n' "$PRIMARY_HOST" "$REPLICATION_USER" "$REPLICATION_PASSWORD" > /tmp/pgpass
              chmod 600 /tmp/pgpass
              PGPASSFILE=/tmp/pgpass pg_basebackup \
                -h "$PRIMARY_HOST" -p "$PRIMARY_PORT" -U "$REPLICATION_USER" \
                -D /var/lib/postgresql/data -Fp -Xs -P -R
              printf "primary_conninfo = 'host=%s port=%s user=%s password=%s application_name=oracle-rehearsal'\n" \
                "$PRIMARY_HOST" "$PRIMARY_PORT" "$REPLICATION_USER" "$REPLICATION_PASSWORD" \
                >> /var/lib/postgresql/data/postgresql.auto.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - hot_standby=on
            - -c
            - wal_receiver_timeout=10s
          envFrom:
            - secretRef:
                name: postgres-authority-rehearsal
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
