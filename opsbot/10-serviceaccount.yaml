# Dedicated ServiceAccount, least privilege — per-workload-SA pattern (see
# ../pantry-bot/10-serviceaccounts.yaml and ../keel/10-serviceaccount.yaml).
#
# Unlike pantry-bot's SA (no API access, automountServiceAccountToken: false),
# opsbot IS one of this repo's rare exceptions: its entire job is to call the
# Kubernetes API on the user's behalf (pod/deployment status, rollout
# restart), so it needs a projected token. See 40-deployment.yaml for where
# automountServiceAccountToken is set to true, and why.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsbot-sa
  namespace: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
