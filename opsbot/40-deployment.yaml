# =============================================================================
# opsbot — Discord bot: Deployment status/restart + Minecraft RCON console
# =============================================================================
# Full design rationale is tracked in the k8s-homelab GitHub Issues and Project
# board; issue tracking is centralized there (see AGENTS.md).
# Short version: Discord's own
# mobile app is the phone UI, so the bot only ever makes an OUTBOUND
# connection to Discord's gateway — zero new inbound network exposure, same
# trust model jmusicbot/pantry-bot already use in this cluster.
#
# Built and pushed to GHCR by .github/workflows/opsbot-deploy.yml, same
# pattern as pantry-bot -- CI runs on a plain GitHub-hosted runner, no Docker
# or local side-loading into this node's containerd required. This replaced
# an earlier local-sideload flow (`docker build` + `k3s ctr images import`)
# used only because no registry was set up for this bot yet; that reasoning
# no longer applies. ghcr.io/chayzx/opsbot is private, so imagePullSecrets
# (below) is required for the kubelet to pull it -- see SECRETS.md.
#
# Stateless: no PVC, default RollingUpdate strategy is fine (contrast with
# pantry-bot/jmusicbot-release-notifier's Recreate, which exists only because
# those have a live SQLite/marker file on an RWO PVC — opsbot has neither).
#
# /bug GitHub Issues (k8s-homelab-cq8): the bug-report command files a
# GitHub issue on the repo that owns the affected bot via the GitHub REST
# API (gh_ops.py). The pod needs ONLY an outbound HTTPS connection to
# api.github.com — no hostPath mounts, no local DB, no uid-1000-equals-owner
# coupling. The fine-grained PAT is injected via the opsbot-github Secret
# (env GITHUB_TOKEN); create it per SECRETS.md. The pod has no local tracker mounts
# removes the ONLY reason this manifest was single-node-bound; the pod is
# now portable to any node.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsbot
  namespace: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsbot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: opsbot-sa
      # TRUE — the opposite of pantry-bot/jmusicbot's SAs, and deliberately
      # so. Every other bot in this repo sets this to `false` because it has
      # nothing to say to the Kubernetes API (pantry-bot talks to Twitch +
      # SQLite, the release-notifier talks to GitHub + Discord webhooks).
      # opsbot's entire purpose is to call the Kubernetes API on the
      # allowlisted user's behalf (pod/deployment status, rollout restart via
      # 20-rbac.yaml's Role grants), so it genuinely needs the projected
      # ServiceAccount token mounted — same reasoning as ../keel's SA, which
      # is this repo's only other `true`.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid/gid 1000 created explicitly in the Dockerfile (groupadd/
        # useradd) and verified there; /app is chowned to it. Kept from the
        # retained from the original image layout; still correct today -- the
        # image's non-root default.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsbot
          image: ghcr.io/chayzx/opsbot:latest
          # Always: mutable `:latest` tag, so a real pull is needed each time
          # rather than trusting a stale cached layer set -- same reasoning
          # as pantry-bot's own imagePullPolicy.
          imagePullPolicy: Always
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsbot-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_USER_ID
              valueFrom:
                secretKeyRef:
                  name: opsbot-discord
                  key: DISCORD_USER_ID
            # /bug's GitHub token (gh_ops.py). Create per SECRETS.md: a
            # fine-grained PAT scoped to ChayzX/k8s-homelab + ChayzX/pantry-bot
            # with Issues: Read+Write. Without it /bug reports "GITHUB_TOKEN
            # is not set"; with it the pod writes issues over outbound HTTPS.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsbot-github
                  key: GITHUB_TOKEN
            # Open /bug to any Discord user (the point of cq8); set "false"
            # to restrict to DISCORD_USER_ID.
            - name: REPORT_OPEN_ACCESS
              value: "true"
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
          # Readiness: GET /health -- 503 while bot/health.py's `_ready` flag
          # is unset (not yet logged into Discord), 200 once on_ready fires.
          # While 503 the pod stays NotReady (no Service endpoints, Kuma sees
          # the monitor as down). Same pattern as jmusicbot's health endpoint
          # (the health endpoint is tracked in GitHub Issues).
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: GET /live -- 200 whenever the process is alive.
          # Deliberately NOT /health: a Discord auth/connect failure must not
          # make the kubelet restart the pod (discord.py retries the login
          # itself). Liveness only catches a wedged/dead process.
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # Limits sized for a lightweight Discord bot. The old /bug used
          # The old local tracker shellout had starved on the old 250m limit;
          # /bug now calls the GitHub REST API (gh_ops.py), so steady-state
          # CPU is back to near-idle; the generous limits are kept as
          # headroom and should be revisited before any resource squeeze.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
