# =============================================================================
# opsbot — Discord bot: Deployment status/restart + Minecraft RCON console
# =============================================================================
# Full design rationale: `bd show k8s-homelab-bi6` (epic) and
# `bd show k8s-homelab-bi6.2` (RBAC design). Short version: Discord's own
# mobile app is the phone UI, so the bot only ever makes an OUTBOUND
# connection to Discord's gateway — zero new inbound network exposure, same
# trust model jmusicbot/pantry-bot already use in this cluster.
#
# Built and pushed to GHCR by .github/workflows/opsbot-deploy.yml, same
# pattern as pantry-bot -- CI runs on a plain GitHub-hosted runner, no Docker
# or local side-loading into this node's containerd required. This replaced
# an earlier local-sideload flow (`docker build` + `k3s ctr images import`)
# used only because no registry was set up for this bot yet; that reasoning
# no longer applies. ghcr.io/chayzx/opsbot is private, so imagePullSecrets
# (below) is required for the kubelet to pull it -- see SECRETS.md.
#
# Stateless: no PVC, default RollingUpdate strategy is fine (contrast with
# pantry-bot/jmusicbot-release-notifier's Recreate, which exists only because
# those have a live SQLite/marker file on an RWO PVC — opsbot has neither).
#
# /report beads mounts (k8s-homelab-cq8): the bug-report command files beads
# by running `bd create` inside this pod against the project's beads databases
# (bd_ops.py). Each volume is a hostPath to the LIVE `.beads/` dir of a board
# -- this single-node cluster runs ON the workstation where those repos live
# (verified: node "minecraftmachine" hosts /home/chase/...), and the pod runs
# as uid 1000 == the owner of those dirs, so no chmod/secrets are needed. The
# embedded Dolt backend serializes writers with an exclusive lock, so pod and
# host sharing the DB is safe; bd_ops.py retries on lock contention. These
# mounts are the ONLY reason this manifest is single-node-bound -- a
# multi-node move needs PVC-backed copies + `bd dolt pull` instead.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsbot
  namespace: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsbot
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: bot
    spec:
      serviceAccountName: opsbot-sa
      # TRUE — the opposite of pantry-bot/jmusicbot's SAs, and deliberately
      # so. Every other bot in this repo sets this to `false` because it has
      # nothing to say to the Kubernetes API (pantry-bot talks to Twitch +
      # SQLite, the release-notifier talks to GitHub + Discord webhooks).
      # opsbot's entire purpose is to call the Kubernetes API on the
      # allowlisted user's behalf (pod/deployment status, rollout restart via
      # 20-rbac.yaml's Role grants), so it genuinely needs the projected
      # ServiceAccount token mounted — same reasoning as ../keel's SA, which
      # is this repo's only other `true`.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        # ponytail: no verified UID yet — opsbot/bot/ doesn't exist, so unlike
        # pantry-bot's runAsUser: 1000 (verified against a running container)
        # this is an assumption. Revisit once the image is built: either
        # confirm 1000 is correct for the base image chosen, or drop
        # runAsUser and rely on the image's own non-root default the way
        # jmusicbot-release-notifier does for its (verified root) image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsbot
          image: ghcr.io/chayzx/opsbot:latest
          # Always: mutable `:latest` tag, so a real pull is needed each time
          # rather than trusting a stale cached layer set -- same reasoning
          # as pantry-bot's own imagePullPolicy.
          imagePullPolicy: Always
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsbot-discord
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_USER_ID
              valueFrom:
                secretKeyRef:
                  name: opsbot-discord
                  key: DISCORD_USER_ID
            # Beads checkouts /report writes into (bd_ops.py / util.py). The
            # defaults in code already match these mount paths; the env vars
            # exist so a future path change is a manifest edit, not a code
            # edit.
            - name: BEADS_CHECKOUT_K8S_HOMELAB
              value: /boards/k8s-homelab
            - name: BEADS_CHECKOUT_PANTRY_BOT
              value: /boards/pantry-bot
            # Open /report to any Discord user (the point of cq8); set "false"
            # to restrict to DISCORD_USER_ID.
            - name: REPORT_OPEN_ACCESS
              value: "true"
          ports:
            - name: health
              containerPort: 9091
              protocol: TCP
          # Readiness: GET /health -- 503 while bot/health.py's `_ready` flag
          # is unset (not yet logged into Discord), 200 once on_ready fires.
          # While 503 the pod stays NotReady (no Service endpoints, Kuma sees
          # the monitor as down). Same pattern as jmusicbot's health endpoint
          # (bd k8s-homelab-aos).
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: GET /live -- 200 whenever the process is alive.
          # Deliberately NOT /health: a Discord auth/connect failure must not
          # make the kubelet restart the pod (discord.py retries the login
          # itself). Liveness only catches a wedged/dead process.
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # Limits sized for a lightweight Discord bot originally; /report
          # (k8s-homelab-cq8) added `bd` shellouts, which is a Go binary
          # with an embedded Dolt engine, not lightweight. Confirmed via
          # cgroup cpu.stat: throttled 4888/6066 periods (~80%), ~465s
          # accumulated throttle time -- bd never became slow, it was
          # starved to the point `bd --help` (pure local, no I/O) couldn't
          # complete in 45s. Bumped limits; requests stay low since the pod
          # idles except during a /report call.
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Live beads databases for /report (see header comment) --
            # hostPath because the cluster node IS the workstation hosting
            # these repos; pod uid 1000 == the dir owner.
            - name: beads-k8s-homelab
              mountPath: /boards/k8s-homelab/.beads
            - name: beads-pantry-bot
              mountPath: /boards/pantry-bot/.beads
      volumes:
        - name: beads-k8s-homelab
          hostPath:
            path: /home/chase/k8s-homelab/.beads
            type: Directory
        - name: beads-pantry-bot
          hostPath:
            path: /home/chase/Downloads/pantry-bot/.beads
            type: Directory
