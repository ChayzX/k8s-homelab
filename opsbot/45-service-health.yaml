# ClusterIP Service exposing opsbot's health endpoint (bd k8s-homelab-aos
# follow-up -- opsbot had the same gap jmusicbot did: Discord-only, no
# listener, nothing on the network could check it was alive).
#
# bot/health.py runs an aiohttp server on port 9091 inside the pod (aiohttp
# is already a hard dependency of discord.py, no new package). This Service
# makes it reachable in-cluster without exposing anything to the node or the
# outside:
#
#     http://opsbot-health.opsbot.svc.cluster.local:9091/health
#     http://opsbot-health.opsbot.svc.cluster.local:9091/live
#
# Endpoints only exist while the pod is Ready (readiness probe -> /health),
# so Uptime Kuma and any other in-cluster consumer see a real down signal
# when the bot is NotReady or dead. Keep port, name, and selector in sync
# with 40-deployment.yaml (containerPort 9091, named "health").
#
# ClusterIP, not NodePort/LoadBalancer: health-checking is an internal concern.
apiVersion: v1
kind: Service
metadata:
  name: opsbot-health
  namespace: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsbot
  ports:
    - name: health
      port: 9091
      targetPort: health
      protocol: TCP
