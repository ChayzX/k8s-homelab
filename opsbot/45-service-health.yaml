# ClusterIP Service exposing opsbot's health endpoint. Opsbot had the same
# gap as JMusicBot: Discord-only, no
# listener, nothing on the network could check it was alive).
#
# bot/health.py runs an aiohttp server on port 9091 inside the pod (aiohttp
# is already a hard dependency of discord.py, no new package). This Service
# makes it reachable in-cluster without exposing anything to the node or the
# outside:
#
#     http://opsbot-health.opsbot.svc.cluster.local:9091/health
#     http://opsbot-health.opsbot.svc.cluster.local:9091/live
#
# Endpoints only exist while the pod is Ready (readiness probe -> /health),
# so the in-cluster watcher and any other in-cluster consumer see a real down signal
# when the bot is NotReady or dead. Keep port, name, and selector in sync
# with 40-deployment.yaml (containerPort 9091, named "health").
#
# Grafana alert relay: the same Service/port also carries
#
#     POST http://opsbot-health.opsbot.svc.cluster.local:9091/alerts/grafana
#
# (Bearer-token authenticated, see bot/alerts.py and SECRETS.md). Riding on
# the Ready-only endpoints is deliberate: Ready == holds the site lease and is
# connected to Discord, i.e. exactly when a DM can be delivered. While the pod
# is NotReady Grafana's webhook fails to connect and Grafana retries.
#
# ClusterIP, not NodePort/LoadBalancer: health-checking and alert delivery are
# internal concerns.
apiVersion: v1
kind: Service
metadata:
  name: opsbot-health
  namespace: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsbot
  ports:
    - name: health
      port: 9091
      targetPort: health
      protocol: TCP
