# bead-me-up-scotty — web UI for the beads (bd) tracker used by this repo.
#
# Single-node cluster, so a hostPath straight at the project's .beads dir is
# the direct equivalent of the README's `-v $BEADS_REPO:/data` docker run
# example — no PVC, no sync step. The image bundles its own `bd` binary
# (see Dockerfile), so nothing from the host's PATH needs to be mounted in.
#
# Mounted at /data/k8s-homelab (not bare /data): scotty's project registry
# seeds the displayed project name from basename(BEADS_REPO) on first run
# (lib/config.ts), so a bare /data mount showed up in the UI as "data".
#
# Runs as uid/gid 1000 to match the host's `chase:chase` ownership (700) on
# /home/chase/k8s-homelab/.beads — the README calls this out explicitly for
# permission errors on the mounted volume.
#
# User/auth model: scotty is single-user (one shared humanActor for all UI
# writes, humanAllowlist only for origin badges, no login). See scotty/README.md
# "User model TODAY" + options before adding any per-user behaviour.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scotty
  namespace: scotty
  labels:
    app.kubernetes.io/name: scotty
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scotty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scotty
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: minecraftmachine
      # DirectoryOrCreate makes kubelet own the hostPath leaf as root:root 755,
      # so the scotty container (uid 1000) can't write config.json and persist()
      # silently fails (best-effort). Chown it once as root before the app starts.
      initContainers:
        - name: fix-config-perms
          image: bead-me-up-scotty:local
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - mkdir -p /home/nextjs/.config/bead-me-up-scotty && chown -R 1000:1000 /home/nextjs/.config/bead-me-up-scotty
          volumeMounts:
            - name: scotty-config
              mountPath: /home/nextjs/.config/bead-me-up-scotty
      containers:
        - name: scotty
          image: bead-me-up-scotty:local
          imagePullPolicy: Never
          env:
            - name: BEADS_REPO
              value: /data/k8s-homelab
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: beads-repo
              mountPath: /data/k8s-homelab
            # Second project: pantry-bot got its own beads board (bd init,
            # 2026-08-12, per k8s-homelab-zcm) in its own git repo, separate
            # from this one. scotty can only see paths mounted into its own
            # container -- add the project via its own UI/API once this is
            # live, pointed at /data/pantry-bot (repoPath), the same way
            # /data/k8s-homelab was originally registered.
            - name: pantry-bot-repo
              mountPath: /data/pantry-bot
            # scotty keeps its project registry in a config.json under the
            # container home (~/.config/bead-me-up-scotty/config.json). Without
            # this mount the registry lives in the ephemeral container layer and
            # every pod restart loses the registered projects (seen after the
            # 2026-08-12 reboot). Dedicated dir, separate from the host scotty's
            # own registry, so the two instances can't clobber each other and
            # host-rooted paths never leak into the container.
            - name: scotty-config
              mountPath: /home/nextjs/.config/bead-me-up-scotty
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: beads-repo
          hostPath:
            path: /home/chase/k8s-homelab
            type: Directory
        - name: pantry-bot-repo
          hostPath:
            path: /home/chase/Downloads/pantry-bot
            type: Directory
        - name: scotty-config
          hostPath:
            path: /home/chase/.config/bead-me-up-scotty-k8s
            type: DirectoryOrCreate
