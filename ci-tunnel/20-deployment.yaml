# =============================================================================
# cloudflared — dedicated Cloudflare Tunnel connector for CI/CD kubectl access
# =============================================================================
# Byte-for-byte the same container/args/probes as
# ../pantry-bot/60-deployment-cloudflared.yaml -- same reasoning applies
# (token via env not argv, /ready metrics probe, RollingUpdate). Only the
# namespace, names, and TUNNEL_TOKEN Secret differ. See that file's header
# comments for the full "why" on each choice; not repeated here.
#
# What this tunnel actually routes is configured in Cloudflare's dashboard
# (dashboard-managed token model, same as every other tunnel in this repo) --
# NOT in this manifest. See ci-tunnel/MANUAL-SETUP.md for the exact hostname
# + origin config, including the CA/TLS-verification gotcha for proxying to
# kubernetes.default.svc specifically (its cert is signed by the cluster's
# internal CA, not a public one -- default cloudflared origin TLS
# verification will fail against it without that config).
#
# TUNNEL_TRANSPORT_PROTOCOL=http2 was added alongside the same change on the
# pantry-bot tunnel (see that file's header, change 3) after this connector
# was found showing the identical QUIC idle-timeout disconnect pattern in
# its own logs. See ChayzX/k8s-homelab#72.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ci-tunnel
  labels:
    app.kubernetes.io/name: ci-tunnel
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-tunnel
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/component: tunnel
    spec:
      serviceAccountName: ci-tunnel-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-tunnel-token
                  key: TUNNEL_TOKEN
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
