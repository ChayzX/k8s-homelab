# cloudflared only talks to Cloudflare's edge and to kubernetes.default.svc
# over the pod network as a plain TCP forward -- it never calls the
# Kubernetes API itself (the ci-deploy ServiceAccount in ../ci-deploy/ is
# what actually authenticates to the API, from inside the GitHub Actions job
# at the far end of the tunnel). No Role/RoleBinding needed here, same
# reasoning as pantry-bot/10-serviceaccounts.yaml's cloudflared-sa.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-tunnel-sa
  namespace: ci-tunnel
  labels:
    app.kubernetes.io/name: ci-tunnel
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
