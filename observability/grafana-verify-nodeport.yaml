# ============================================================
# VERIFICATION ONLY -- APPLY BEFORE CUTOVER, DELETE AFTER
# ============================================================
# Port 3002 cannot be claimed by the cluster until Docker Desktop's proxy
# releases it, i.e. until the old grafana container is stopped. That
# makes "verify the new instance before you commit to it" impossible over
# the real port.
#
# This NodePort is the workaround: it exposes the new Grafana on a port
# nothing else holds, so the whole Phase 1 functional check (datasources
# green, dashboards provisioned, historical Prometheus/Loki data visible,
# LogQL level="error" filter behaving) can be done while the old stack is
# still serving users on 3002.
#
# 30002 is inside the k3s default NodePort range 30000-32767. (Rev. 1 of
# the plan proposed out-of-range ports; those are rejected at apply time,
# not at runtime.)
#
#   APPLY:   kubectl apply -f grafana-verify-nodeport.yaml
#   BROWSE:  http://192.168.40.208:30002
#   DELETE:  kubectl delete -f grafana-verify-nodeport.yaml
#            ...immediately after the LoadBalancer Service in
#            grafana.yaml comes up with EXTERNAL-IP 192.168.40.208.
#
# Leaving this applied after cutover is not dangerous, just a second
# unauthenticated door onto the same Grafana. Delete it.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana-verify
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
    homelab.local/lifecycle: verification-only
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30002
      protocol: TCP
