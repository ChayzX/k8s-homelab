# Grafana deployment for the home observability stack.
# The Deployment spec is synchronized from the live cluster configuration.
# Database, OAuth, and Opsbot credentials use Kubernetes Secrets; secret
# values are never stored in this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
# Grafana never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '75'
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
  name: grafana
  namespace: observability
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        homelab.local/config-revision: '3'
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: observability
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: grafana-admin
              optional: true
        - name: OPSBOT_ALERT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: opsbot-alert-token
        - name: PANTRY_GRAFANA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: grafana-postgres-pantry
        - name: GF_SECURITY_COOKIE_NAME
          value: grafana_session_v3
        - name: GF_AUTH_LOGIN_COOKIE_NAME
          value: grafana_session_v4
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_SERVER_HTTP_PORT
          value: '3000'
        - name: GF_AUTH_PROXY_ENABLED
          value: 'true'
        - name: GF_AUTH_PROXY_HEADER_NAME
          value: X-authentik-username
        - name: GF_AUTH_PROXY_AUTO_SIGN_UP
          value: 'true'
        - name: GF_AUTH_PROXY_SYNC_TTL
          value: '60'
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'true'
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.greeniespantry.uk
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: Authentik
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: client-id
              name: grafana-oauth
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: grafana-oauth
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid profile email
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://auth.greeniespantry.uk/application/o/authorize/
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://auth.greeniespantry.uk/application/o/token/
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://auth.greeniespantry.uk/application/o/userinfo/
        - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: preferred_username
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
          value: email || join('', [preferred_username, '@users.authentik.local'])
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: contains(groups[*], 'authentik Admins') && 'GrafanaAdmin' || contains(groups[*], 'grafana-viewers')
            && 'Viewer'
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
          value: 'true'
        - name: GF_LOG_FILTERS
          value: authn:debug user.sync:debug auth.client.generic_oauth:debug oauthtoken:debug context:debug
        - name: GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP
          value: 'true'
        image: grafana/grafana:13.2.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: grafana
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/datasources
          name: provisioning-datasources
          readOnly: true
        - mountPath: /etc/grafana/provisioning/dashboards
          name: provisioning-dashboards
          readOnly: true
        - mountPath: /etc/grafana/provisioning/alerting
          name: provisioning-alerting
          readOnly: true
        - mountPath: /etc/grafana/dashboards
          name: dashboards
          readOnly: true
        - mountPath: /var/lib/grafana
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: grafana-sa
      serviceAccountName: grafana-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: grafana-provisioning-datasources
        name: provisioning-datasources
      - configMap:
          defaultMode: 420
          name: grafana-provisioning-dashboards
        name: provisioning-dashboards
      - configMap:
          defaultMode: 420
          name: grafana-provisioning-alerting
        name: provisioning-alerting
      - configMap:
          defaultMode: 420
          name: grafana-dashboards
        name: dashboards
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
---
# Grafana is published by a LoadBalancer on port 3002.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      # 3002 on the LAN, 3000 in the container -- same mapping the
      # Compose file published.
      port: 3002
      targetPort: http
      protocol: TCP
