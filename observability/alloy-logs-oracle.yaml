apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-logs
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
rules:
- apiGroups: [""]
  resources: [pods, pods/log, nodes, nodes/proxy]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-logs
subjects:
- kind: ServiceAccount
  name: alloy-logs
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: observability
data:
  config.alloy: |
    logging {
      level = "info"
      format = "logfmt"
    }
    discovery.kubernetes "pods" {
      role = "pod"
    }
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex = sys.env("NODE_NAME")
        action = "keep"
      }
    }
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }
    loki.process "pods" {
      forward_to = [loki.write.local.receiver]
      // Drop credential-bearing lines before they reach Loki. This is
      // defense in depth for upstream applications that log at DEBUG.
      stage.drop {
        expression = "(?i)(access token|refresh token|authorization: bearer)"
      }
      stage.regex {
        expression = "(?i)(?P<level>debug|info|warn(?:ing)?|error|fatal)"
      }
      stage.template {
        source = "level"
        template = "{{ ToLower .Value }}"
      }
      stage.labels {
        values = { level = "" }
      }
    }
    loki.write "local" {
      endpoint {
        url = "http://100.84.89.87:31100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-logs
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-logs
    spec:
      serviceAccountName: alloy-logs
      containers:
      - name: alloy
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: grafana/alloy:v1.8.3
        args: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/data]
        ports:
        - name: http
          containerPort: 12345
        readinessProbe:
          httpGet: {path: /-/ready, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /-/healthy, port: http}
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/alloy
      volumes:
      - name: data
        emptyDir: {}
      - name: config
        configMap:
          name: alloy-logs-config
