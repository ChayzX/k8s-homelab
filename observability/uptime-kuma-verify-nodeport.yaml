# ============================================================
# VERIFICATION ONLY -- APPLY BEFORE CUTOVER, DELETE AFTER
# ============================================================
# Port 3001 is held host-wide by Docker Desktop's proxy for the old
# uptime-kuma container and cannot be claimed by ServiceLB until that
# container stops. This NodePort gives the new pod a reachable address in
# the meantime.
#
# Use the window to do the work that has to happen before cutover:
#   * confirm the monitor list and history survived the datadir copy
#   * recreate every "Docker Container" monitor as an HTTP/TCP monitor
#     (the docker.sock mount is intentionally gone -- see uptime-kuma.yaml)
#   * confirm notification channels still fire
#
# 30001 is inside the k3s default NodePort range 30000-32767.
#
#   APPLY:   kubectl apply -f uptime-kuma-verify-nodeport.yaml
#   BROWSE:  http://192.168.40.208:30001
#   DELETE:  kubectl delete -f uptime-kuma-verify-nodeport.yaml
#            ...once the LoadBalancer Service in uptime-kuma.yaml reports
#            EXTERNAL-IP 192.168.40.208.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-verify
  namespace: observability
  labels:
    app: uptime-kuma
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/part-of: observability
    homelab.local/lifecycle: verification-only
spec:
  type: NodePort
  selector:
    app: uptime-kuma
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30001
      protocol: TCP
