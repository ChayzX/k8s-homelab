# /etc/systemd/system/pantry-bot-canada-metrics-tunnel.service.d/roles.conf (#191)
# Forward every Canada PantryBot role's metrics port (Canada binds them to
# 127.0.0.1 only) onto Home's LAN IP so Home Prometheus can scrape Canada
# while it is the active site. 13101 is the original api forward, kept for
# compatibility; 2310x are role-named: api 23100, gateway 23101,
# dispatcher 23102, worker 23103.
[Service]
ExecStart=
ExecStart=/usr/bin/ssh -NT -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/chase/.ssh/known_hosts -i /home/chase/.ssh/pantry-bot-canada-metrics -L 192.168.40.208:13101:127.0.0.1:13100 -L 192.168.40.208:23100:127.0.0.1:13100 -L 192.168.40.208:23101:127.0.0.1:13101 -L 192.168.40.208:23102:127.0.0.1:13102 -L 192.168.40.208:23103:127.0.0.1:13103 BotAdmin@100.104.83.28
