apiVersion: v1
kind: ServiceAccount
metadata:
  name: pantry-postgres-fencer
  namespace: pantry-bot
---
apiVersion: v1
kind: Secret
metadata:
  name: pantry-postgres-fencer-token
  namespace: pantry-bot
  annotations:
    kubernetes.io/service-account.name: pantry-postgres-fencer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pantry-postgres-fencer
  namespace: pantry-bot
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames:
      - postgres-authority
      - postgres-authority-home
      - postgres-authority-home-v2
      - postgres-authority-home-failback
      - postgres-authority-home-return
      - postgres-authority-standby-home-canada
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames:
      - postgres-authority-0
      - postgres-authority-home-0
      - postgres-authority-home-v2-0
      - postgres-authority-home-failback-0
      - postgres-authority-home-return-0
      - postgres-authority-standby-home-canada-0
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    resourceNames:
      - postgres-authority
      - postgres-authority-home
      - postgres-authority-home-v2
      - postgres-authority-home-failback
      - postgres-authority-home-return
      - postgres-authority-standby-home-canada
    verbs: ["get"]
  # Writer-domain fence (#191): DB-writing apps and the PantryBot-App tunnel
  # connector. Never cloudflared (shared tunnel 59569621), commands-cloudflared
  # or pantry-commands-site.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - pantry-private-api
      - pantry-overlay-delivery
      - pantry-twitch-gateway
      - pantry-twitch-dispatcher
      - pantry-chat-worker
      - pantry-private-site
      - app-cloudflared
      - pantry-bot
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pantry-postgres-fencer
  namespace: pantry-bot
subjects:
  - kind: ServiceAccount
    name: pantry-postgres-fencer
    namespace: pantry-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pantry-postgres-fencer
