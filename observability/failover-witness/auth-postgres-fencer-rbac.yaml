apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-postgres-fencer
  namespace: auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-postgres-fencer
  namespace: auth
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["auth-postgresql", "auth-postgresql-chasebot-standby"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["auth-postgresql-0", "auth-postgresql-chasebot-standby-0"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    resourceNames: ["auth-postgresql", "auth-postgresql-chasebot-standby"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-postgres-fencer
  namespace: auth
subjects:
  - kind: ServiceAccount
    name: auth-postgres-fencer
    namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-postgres-fencer
