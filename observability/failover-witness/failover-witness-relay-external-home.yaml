apiVersion: v1
kind: Service
metadata:
  name: failover-witness-relay-external
  namespace: observability
  annotations:
    pantrybot/purpose: Canada witness path independent of Oracle (#191)
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: failover-witness-relay
  externalTrafficPolicy: Local
  ports:
  - name: relay
    port: 18765
    targetPort: witness
    nodePort: 31421
    protocol: TCP

