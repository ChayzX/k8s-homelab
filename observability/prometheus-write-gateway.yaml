# Config for the write-gateway sidecar in
# windows-alloy-metrics-cloudflared.yaml, which receives metrics and logs from
# outside the cluster. It forwards only POST /api/v1/write and
# POST /loki/api/v1/push; queries, admin paths and /-/quit are refused.
# Requires --web.enable-remote-write-receiver on the Prometheus container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-write-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-write-gateway
    app.kubernetes.io/part-of: observability
data:
  default.conf: |
    server {
      listen 9090;
      client_max_body_size 32m;

      location = /api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://prometheus-origin.observability.svc.cluster.local:9090/api/v1/write;
        proxy_http_version 1.1;
        proxy_request_buffering off;
      }

      location = /loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_pass http://loki.observability.svc.cluster.local:3100/loki/api/v1/push;
        proxy_http_version 1.1;
        proxy_request_buffering off;
      }

      location / { return 404; }
    }

    server {
      listen 8081;
      location = /healthz { return 200 "ok\n"; }
      location / { return 404; }
    }
