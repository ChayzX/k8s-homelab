# The Cloudflare-managed metrics.greeniespantry.uk tunnel is configured with
# prometheus.observability.svc.cluster.local:9090 as its origin. The tunnel
# pod maps that exact hostname to its loopback write-gateway sidecar. The
# sidecar forwards only the remote-write POST to this separate origin Service,
# leaving Grafana's required http://prometheus:9090 datasource unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-write-gateway
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-write-gateway
    app.kubernetes.io/part-of: observability
data:
  default.conf: |
    server {
      listen 9090;
      client_max_body_size 32m;

      location = /api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://prometheus-origin.observability.svc.cluster.local:9090/api/v1/write;
        proxy_http_version 1.1;
        proxy_request_buffering off;
      }

      location / { return 404; }
    }

    server {
      listen 8081;
      location = /healthz { return 200 "ok\n"; }
      location / { return 404; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-origin
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
