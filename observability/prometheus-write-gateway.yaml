# Remote-write ingress for Home Prometheus (#191): lets Oracle's Prometheus
# push its series here so the Home dashboards keep showing PantryBot data
# while Oracle is the active site. Only POST /api/v1/write is forwarded;
# everything else (queries, admin, /-/quit from --web.enable-lifecycle) is
# refused, so exposing a NodePort does not expose Prometheus itself.
# Requires --web.enable-remote-write-receiver on the Prometheus container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-write-gateway
  namespace: observability
data:
  default.conf: |
    server {
      listen 8080;
      client_max_body_size 32m;
      location = /api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://prometheus.observability.svc.cluster.local:9090;
        proxy_http_version 1.1;
      }
      location = /healthz { return 200 "ok\n"; }
      location / { return 403; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-write-gateway
  namespace: observability
  labels: {app.kubernetes.io/name: prometheus-write-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus-write-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus-write-gateway}
    spec:
      nodeSelector: {kubernetes.io/hostname: minecraftmachine}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports: [{containerPort: 8080, name: http}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: conf, configMap: {name: prometheus-write-gateway}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-write-gateway
  namespace: observability
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: prometheus-write-gateway}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 31090}]
