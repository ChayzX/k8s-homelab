# Dedicated Cloudflare Tunnel connector for Windows Alloy remote-write ingest.
# The tunnel token is injected only from the Kubernetes Secret created by the
# deployment workflow; it is never committed to this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windows-alloy-metrics-cloudflared
  namespace: observability
  labels:
    app.kubernetes.io/name: windows-alloy-metrics-cloudflared
    app.kubernetes.io/part-of: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-alloy-metrics-cloudflared
  namespace: observability
  labels:
    app.kubernetes.io/name: windows-alloy-metrics-cloudflared
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: remote-write-tunnel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windows-alloy-metrics-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windows-alloy-metrics-cloudflared
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: remote-write-tunnel
    spec:
      serviceAccountName: windows-alloy-metrics-cloudflared
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: windows-alloy-metrics-tunnel
                  key: TUNNEL_TOKEN
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: write-gateway
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          imagePullPolicy: IfNotPresent
          ports:
            - name: write
              containerPort: 9090
              protocol: TCP
            - name: gateway-health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway-health
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: write-gateway-config
              mountPath: /etc/nginx/conf.d
            - name: write-gateway-tmp
              mountPath: /tmp
      volumes:
        - name: write-gateway-config
          configMap:
            name: prometheus-write-gateway
        - name: write-gateway-tmp
          emptyDir: {}
