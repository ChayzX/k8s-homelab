# Dedicated Cloudflare Tunnel connector for Windows Alloy remote-write ingest.
# The tunnel token is injected only from the Kubernetes Secret created by the
# deployment workflow; it is never committed to this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windows-alloy-metrics-cloudflared
  namespace: observability
  labels:
    app.kubernetes.io/name: windows-alloy-metrics-cloudflared
    app.kubernetes.io/part-of: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-alloy-metrics-cloudflared
  namespace: observability
  labels:
    app.kubernetes.io/name: windows-alloy-metrics-cloudflared
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: remote-write-tunnel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windows-alloy-metrics-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windows-alloy-metrics-cloudflared
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/component: remote-write-tunnel
    spec:
      serviceAccountName: windows-alloy-metrics-cloudflared
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: windows-alloy-metrics-tunnel
                  key: TUNNEL_TOKEN
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]