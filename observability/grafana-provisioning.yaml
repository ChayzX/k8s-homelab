          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: 100 * (1 - avg by (instance, site) (rate(windows_cpu_time_total{job="integrations/windows",instance="TRUFFLES",role="streaming-laptop",mode="idle"}[5m])))
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 85
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: CPU utilization has remained above 85% for 10 minutes. Microsoft documents >85% sustained CPU
            as a bottleneck in Windows Server Performance Monitor troubleshooting and uses >85% for 10 minutes as a
            Windows Admin Center server alert default. These are Windows Server guidance, not PC-specific limits. https://learn.microsoft.com/en-us/troubleshoot/windows-server/support-tools/troubleshoot-issues-performance-monitor
            https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/configure-azure-monitor
          summary: Truffles stream PC CPU above 85% for 10m
        labels:
          severity: warning
        isPaused: false
