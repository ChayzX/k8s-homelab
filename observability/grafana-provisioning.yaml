# Grafana provisioning ConfigMaps.
#
# WHY ONE ConfigMap PER SUBDIRECTORY AND NOT ONE BIG ONE: Grafana expects
# /etc/grafana/provisioning/{datasources,dashboards,plugins,alerting}/ as
# real subdirectories. ConfigMap keys cannot contain "/", so a single
# ConfigMap mounted at /etc/grafana/provisioning can only produce flat
# files there -- Grafana would find no providers at all and silently
# start with zero datasources and zero dashboards. Mounting each
# subdirectory from its own ConfigMap gives the right tree AND leaves the
# image's other provisioning subdirectories intact.
#
# The alerting ConfigMap (grafana-provisioning-alerting) below is mounted
# by grafana.yaml at /etc/grafana/provisioning/alerting. Alerting
# provisioning files are read ONCE, at Grafana startup -- they are not
# watched. See SECRETS.md in this directory for the opsbot-alert-token
# Secret that the alerting file references by env var.
#
# The DASHBOARD JSON itself is NOT here. It lives in a separate ConfigMap
# named `grafana-dashboards`, generated from
# /home/chase/k8s-homelab/dashboards/ by a separate agent, and is mounted
# at /etc/grafana/dashboards -- the path the provider below points at.
# See README.md for the generate command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  datasources.yaml: |
    apiVersion: 1

    # The uids MUST stay "Prometheus" and "Loki". Every existing
    # dashboard JSON references datasources by uid; changing them
    # detaches every panel.
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        # Same-namespace Service DNS. Identical to the Compose value, so
        # nothing in the dashboards has to change.
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          maxLines: 5000

      # Pantry Bot usage tables. Now read from ORACLE over Tailscale, because
      # PantryBot moved there on 2026-09-25 and Home runs no PantryBot
      # workload any more (ChayzX/pantry-bot#316).
      #
      # This used to point at pantry-postgres-local-read in Home's own
      # cluster -- a deliberately role-independent Service that survived
      # StatefulSet renames and promotions. That was the right design while
      # the database was local. It is simply no longer local: the Service
      # still exists on Home but has no backing pod, so every panel on the
      # Pantry Bot -- Usage (Postgres) dashboard would render empty with no
      # error that names the cause.
      #
      # Grafana stays on Home because it is reached through Authentik, which
      # stays on Home. So this is now a cross-site read. Two consequences
      # worth knowing before debugging a blank chart at 3am:
      #   - a panel here can fail for reasons unrelated to PantryBot's health
      #   - it is a dashboard dependency only; nothing PantryBot serves
      #     depends on this link
      #
      # 100.78.181.15 is Oracle's Tailscale address, and its PostgreSQL runs
      # with hostNetwork, so 5432 there is the database itself rather than a
      # Service. Verified reachable from Home before this change.
      #
      # The password is NOT in this repo -- it is injected from the
      # PANTRY_GRAFANA_DB_PASSWORD env var, which grafana.yaml sources from
      # the grafana-postgres-pantry Secret. Never commit it.
      - name: PantryPostgres
        uid: PantryPostgres
        type: postgres
        access: proxy
        url: 100.78.181.15:5432
        database: pantry
        user: pantry_grafana
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $PANTRY_GRAFANA_DB_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: default
        folder: ""
        type: file
        updateIntervalSeconds: 30
        # This path is why grafana.yaml MUST mount the grafana-dashboards
        # ConfigMap at /etc/grafana/dashboards. If that mount is missing,
        # Grafana logs a provisioning error and shows an empty dashboard
        # list -- this is the exact defect rev. 1 of the plan shipped.
        options:
          path: /etc/grafana/dashboards
        # ConfigMap-provisioned dashboards are read-only by definition:
        # the volume is immutable, so a user "Save" would be lost on the
        # next pod restart. Say so in the UI rather than letting people
        # lose work.
        allowUiUpdates: false
        # false = when a dashboard's JSON file is removed from the repo,
        # Grafana removes the dashboard too. With `true`, deleting a file
        # left the dashboard stranded in Grafana forever -- that is how the
        # retired "Apps" dashboard outlived its file by weeks. The repo is
        # the source of truth, so deletion has to flow through as well.
        disableDeletion: false
---
# Grafana Alerting provisioning -- Pantry-bot / Twitch-bot alerts to the
# owner's Discord DMs, delivered by opsbot.
#
# Mounted by grafana.yaml at /etc/grafana/provisioning/alerting. Read ONCE
# at Grafana startup (not watched): after changing this file you must
# restart the grafana pod for it to take effect.
#
# What this delivers, and what it deliberately does NOT:
#   * A `webhook` contact point (opsbot-dm) that POSTs Grafana's
#     notification JSON to opsbot's in-cluster relay
#     (http://opsbot-health.opsbot.svc.cluster.local:9091/alerts/grafana).
#     opsbot DMs the owner (DISCORD_USER_ID) with its own bot identity; there
#     is no Discord webhook. The Bearer token is NOT in this repo -- it is
#     interpolated from the OPSBOT_ALERT_TOKEN env var, which grafana.yaml
#     sources from the opsbot-alert-token Secret (same value as in the
#     opsbot namespace). See SECRETS.md here and ../opsbot/SECRETS.md.
#     opsbot answers 503 when it cannot deliver (standby/fenced, Discord
#     down) and Grafana retries; see ../opsbot/bot/alerts.py.
#   * A notification policy that routes pantry-bot/Twitch alert rules to
#     that contact point IN ADDITION to the existing root receiver
#     (continue: true), matched on the grafana_folder label (rules kept in
#     a "pantry-bot"/"twitch"-named folder) or on an app label.
#   * Provisioned alert rules for PantryBot on Oracle (folder "pantry-bot",
#     group "pantry-bot-oracle", see the `groups:` key below). Home Prometheus
#     has no Alertmanager or rule_files, so Grafana is the only evaluator.
#     The folder name matches the notification policy's grafana_folder route,
#     so no per-rule routing labels are needed (adding an app label as well
#     would match BOTH routes and risk a duplicate DM).
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-alerting
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  alerting.yaml: |
    # Grafana Alerting provisioning -- apiVersion 1 (see
    # pkg/services/provisioning/alerting in the Grafana source).
    apiVersion: 1

    # Pantry-bot / Twitch-bot contact point: opsbot's DM relay.
    #
    # Replaces the old `discord-pantry-twitch-dm` Discord-webhook contact
    # point (never loaded: it needed a webhook that will not be created).
    #
    # authorization_credentials is interpolated from the process environment
    # at provisioning-read time (the value here is a $VAR reference, never the
    # token). grafana.yaml wires OPSBOT_ALERT_TOKEN to a REQUIRED
    # secretKeyRef, so a missing Secret is a loud CreateContainerConfigError
    # rather than a contact point that silently gets 401s.
    #
    # `$` in rule annotations: write `{{ $labels.job }}` as-is. Grafana
    # interpolates env vars in contact-point settings (that is how
    # $OPSBOT_ALERT_TOKEN resolves) but stores rule annotations RAW; a `$$`
    # escape there is stored literally and breaks the template ("bad
    # character U+0024"), as observed live on 2026-09-29.
    contactPoints:
      - orgId: 1
        name: opsbot-dm
        receivers:
          - uid: opsbot-dm
            type: webhook
            disableResolveMessage: false
            settings:
              url: http://opsbot-health.opsbot.svc.cluster.local:9091/alerts/grafana
              httpMethod: POST
              authorization_scheme: Bearer
              # PLACEHOLDER -- resolved from the environment, not stored here.
              authorization_credentials: $OPSBOT_ALERT_TOKEN

    # Alert rules. Evaluated by Grafana against the home Prometheus, which
    # receives the Oracle series by remote_write. Only metric and job names
    # confirmed to exist in that Prometheus (2026-09-29) are used. There is no
    # outbox-backlog / dead_letter metric exported by PantryBot today, so no
    # rule exists for it; add one when the app exports such a metric.
    #
    # noDataState OK on the first three: `x == 0`, `increase(..) > 0` and
    # `absent()` all return an EMPTY result when healthy. Total loss of the
    # metrics is covered separately by the absent() rule.
    groups:
      - orgId: 1
        name: pantry-bot-oracle
        folder: pantry-bot
        interval: 1m
        rules:
          - uid: pantry-oracle-target-down
            title: PantryBot Oracle scrape target down
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: critical
            annotations:
              summary: "PantryBot {{ $labels.role }} target is down on Oracle"
              description: "up==0 for 5m on job {{ $labels.job }} (instance {{ $labels.instance }}). Empty result (all targets up) is treated as healthy."
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: 'up{job=~"pantry-bot-.*-oracle"} == 0'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: C
          - uid: pantry-oracle-runtime-failures
            title: PantryBot runtime failures
            condition: C
            for: 0s
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: warning
            annotations:
              summary: "PantryBot runtime failures on {{ $labels.job }}"
              description: "pantry_bot_runtime_failures_total increased in the last 15m on {{ $labels.job }}. Note: the counter only exists after the first failure, and Prometheus increase() does not count a series first appearing at its initial value, so the very first failure may not fire."
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: 'increase(pantry_bot_runtime_failures_total[15m]) > 0'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: C
          - uid: pantry-oracle-metrics-absent
            title: PantryBot metrics absent
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: critical
            annotations:
              summary: "PantryBot metrics have disappeared"
              description: "No pantry_bot_runtime_claims_total series from the Oracle pantry-bot jobs for 10m: the app is not exporting, Oracle Prometheus is down, or remote_write to home is broken."
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: 'absent(pantry_bot_runtime_claims_total{job=~"pantry-bot-.*-oracle"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: C
          - uid: pantry-postgres-backup-stale
            title: PantryBot Postgres backup older than 26h
            condition: C
            for: 0s
            noDataState: Alerting
            execErrState: Error
            isPaused: false
            labels:
              severity: critical
            annotations:
              summary: "PantryBot Postgres backup has not succeeded in over 26h"
              description: "CronJob postgres-backup (schedule daily 05:10 UTC) last succeeded more than 26h ago, or its metric is missing (kube-state-metrics-oracle down)."
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: 'time() - kube_cronjob_status_last_successful_time{job="kube-state-metrics-oracle",namespace="pantry-bot",cronjob="postgres-backup"}'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [93600]
                  refId: C

          - uid: pantry-oracle-disk-high
            title: Oracle disk usage high
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: warning
            annotations:
              summary: "Oracle root disk is {{ $values.B.Value | humanize }}% full"
              description: "Root filesystem (/) on the Oracle node has been above 85% for 10m. Check on the Oracle node: `docker system df` (images, containers, volumes, build cache), `docker volume prune` (an hourly cron also prunes; if the cron is failing the disk fills), and the CI runner work dirs. Kubelet starts evicting pods at ~95% (2026-09-30: 96% evicted every PantryBot pod and Postgres, ~37 min outage)."
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: '100 * (1 - node_filesystem_avail_bytes{site="oracle",mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [85]
                  refId: C
          - uid: pantry-oracle-disk-critical
            title: Oracle disk usage critical
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: critical
            annotations:
              summary: "Oracle root disk is {{ $values.B.Value | humanize }}% full - eviction imminent"
              description: "Root filesystem (/) on the Oracle node has been above 92% for 5m. ACT NOW. Check on the Oracle node: `docker system df` (images, containers, volumes, build cache), `docker volume prune` (an hourly cron also prunes; if the cron is failing the disk fills), and the CI runner work dirs. Kubelet starts evicting pods at ~95% (2026-09-30: 96% evicted every PantryBot pod and Postgres, ~37 min outage)."
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: '100 * (1 - node_filesystem_avail_bytes{site="oracle",mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [92]
                  refId: C
          - uid: pantry-oracle-disk-metrics-absent
            title: No Oracle disk metrics
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            isPaused: false
            labels:
              severity: warning
            annotations:
              summary: "Oracle node-exporter disk metrics have disappeared"
              description: "No node_filesystem_size_bytes{site=oracle,mountpoint=/} series for 10m, so the Oracle disk usage alerts cannot fire: node-exporter-oracle is down, Oracle Prometheus is down, or remote_write to home is broken. Distinct from PantryBot metrics absent, which watches app metrics only."
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: Prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: Prometheus
                  expr: 'absent(node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: C

    # Notification policy tree.
    #
    # WARNING: provisioning REPLACES the whole policy tree on startup, and
    # each top-level `policies` entry is a full tree (the last one applied
    # wins). So this file carries the COMPLETE tree: the root below
    # reproduces the pre-existing default (receiver grafana-default-email,
    # group_by [grafana_folder, alertname] -- confirmed from the live
    # grafana.db) and the nested routes are what this file actually adds.
    # Do not add a second top-level `policies` entry here.
    #
    # `continue: true` on each pantry/Twitch route is the "IN ADDITION to
    # the existing recipient" behaviour the card asks for: matched alerts
    # go to the opsbot DM contact point AND continue up to the root
    # receiver.
    policies:
      - orgId: 1
        receiver: grafana-default-email
        group_by:
          - grafana_folder
          - alertname
        routes:
          # Rules placed in a folder whose name matches pantry-bot / twitch
          # (Grafana labels every alert with the folder name as
          # grafana_folder).
          - receiver: opsbot-dm
            group_by:
              - grafana_folder
              - alertname
            object_matchers:
              - [grafana_folder, =~, "pantry-bot|pantry|twitch"]
            continue: true
          # Rules carrying an explicit app label (e.g. app="pantry-bot",
          # app="twitch") instead of a matching folder name.
          - receiver: opsbot-dm
            group_by:
              - grafana_folder
              - alertname
            object_matchers:
              - [app, =~, "pantry-bot|pantry|twitch"]
            continue: true
# NOTE: there is deliberately NO `grafana-dashboards` ConfigMap in this
# file. There used to be a `.placeholder`-only stub here, meant to let
# `kubectl apply -f .` produce a working Grafana before any dashboard JSON
# existed. It became a loaded gun: the real grafana-dashboards ConfigMap is
# generated into dashboards/dashboards-configmap.yaml, so applying this
# file would have REPLACED all 13 dashboards with an empty placeholder and
# emptied the Grafana dashboard list. It never fired only because the stub
# also carried an invalid label value ("homelab.local/generated-from:
# k8s-homelab/dashboards" -- label values cannot contain "/"), so the apply
# was rejected outright. Removed 2026-09-21. Dashboard CONTENT comes from
# dashboards/*.json via scripts/gen-dashboards-configmap.py; this file owns
# only the provisioning providers and datasources.
