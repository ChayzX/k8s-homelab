# Grafana provisioning ConfigMaps.
#
# WHY ONE ConfigMap PER SUBDIRECTORY AND NOT ONE BIG ONE: Grafana expects
# /etc/grafana/provisioning/{datasources,dashboards,plugins,alerting}/ as
# real subdirectories. ConfigMap keys cannot contain "/", so a single
# ConfigMap mounted at /etc/grafana/provisioning can only produce flat
# files there -- Grafana would find no providers at all and silently
# start with zero datasources and zero dashboards. Mounting each
# subdirectory from its own ConfigMap gives the right tree AND leaves the
# image's other provisioning subdirectories intact.
#
# The alerting ConfigMap is mounted by the active Grafana Deployment and
# provisioned at startup. Alerting routes and rules are kept in this source
# manifest so restarts preserve the live configuration.
#
# The DASHBOARD JSON itself is NOT here. It lives in a separate ConfigMap
# named `grafana-dashboards`, generated from
# /home/chase/k8s-homelab/dashboards/ and is mounted
# at /etc/grafana/dashboards -- the path the provider below points at.
# See README.md for the generate command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  datasources.yaml: |
    apiVersion: 1

    # The local Grafana instance keeps these UIDs for rollback. The migrated
    # Grafana Cloud dashboards use grafanacloud-prom and grafanacloud-logs
    # instead; see docs/recovery/GRAFANA-CLOUD-MIGRATION.md.
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        # Same-namespace Service DNS. Identical to the Compose value, so
        # nothing in the dashboards has to change.
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 15s

      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          maxLines: 5000

      # Pantry Bot usage tables, read from the home standby replica
      # (postgres-authority-home-return streams from the Oracle writer).
      # Read-only dashboard queries; standby lag is seconds. The password
      # is NOT in this repo -- it is injected from the
      # PANTRY_GRAFANA_DB_PASSWORD env var (grafana.yaml sources it from
      # the grafana-postgres-pantry Secret, created imperatively from the
      # existing pantry-bot-postgres-home-return Secret). Never commit it.
      - name: PantryPostgres
        uid: PantryPostgres
        type: postgres
        access: proxy
        url: postgres-authority-home-return.pantry-bot.svc.cluster.local:5432
        database: pantry
        user: pantry
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $PANTRY_GRAFANA_DB_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: default
        folder: ""
        type: file
        updateIntervalSeconds: 30
        # This path is why grafana.yaml MUST mount the grafana-dashboards
        # ConfigMap at /etc/grafana/dashboards. If that mount is missing,
        # Grafana logs a provisioning error and shows an empty dashboard
        # list -- this is the exact defect rev. 1 of the plan shipped.
        options:
          path: /etc/grafana/dashboards
        # ConfigMap-provisioned dashboards are read-only by definition:
        # the volume is immutable, so a user "Save" would be lost on the
        # next pod restart. Say so in the UI rather than letting people
        # lose work.
        allowUiUpdates: false
        disableDeletion: true
---
# Grafana Alerting provisioning -- active rules and notification routing.
# The default email address and rule definitions are committed here.
# The Opsbot bearer token remains injected from a Kubernetes Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-alerting
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: grafana-default-email
      receivers:
      - uid: eg0vsqklgy7swc
        type: email
        settings:
          addresses: hyperaimz28@gmail.com
        disableResolveMessage: false
    - orgId: 1
      name: opsbot-dm
      receivers:
      - uid: opsbot-dm
        type: webhook
        settings:
          authorization_credentials: $OPSBOT_ALERT_TOKEN
          authorization_scheme: Bearer
          httpMethod: POST
          url: http://opsbot-health.opsbot.svc.cluster.local:9091/alerts/grafana
        disableResolveMessage: false
    groups:
    - orgId: 1
      name: pantry-bot-oracle
      folder: pantry-bot
      interval: 1m
      rules:
      - uid: pantry-oracle-target-down
        title: PantryBot Oracle scrape target down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: up{job=~"pantry-bot-.*-oracle"} == 0
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: up==0 for 5m on job {{ $labels.job }} (instance {{ $labels.instance }}). Empty result (all targets
            up) is treated as healthy.
          summary: PantryBot {{ $labels.role }} target is down on Oracle
        labels:
          severity: critical
        isPaused: false
      - uid: pantry-oracle-runtime-failures
        title: PantryBot runtime failures
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 900
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: increase(pantry_bot_runtime_failures_total[15m]) > 0
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        annotations:
          description: 'pantry_bot_runtime_failures_total increased in the last 15m on {{ $labels.job }}. Note: the
            counter only exists after the first failure, and Prometheus increase() does not count a series first appearing
            at its initial value, so the very first failure may not fire.'
          summary: PantryBot runtime failures on {{ $labels.job }}
        labels:
          severity: warning
        isPaused: false
      - uid: pantry-oracle-metrics-absent
        title: PantryBot metrics absent
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: absent(pantry_bot_runtime_claims_total{job=~"pantry-bot-.*-oracle"})
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: 'No pantry_bot_runtime_claims_total series from the Oracle pantry-bot jobs for 10m: the app is
            not exporting, Oracle Prometheus is down, or remote_write to home is broken.'
          summary: PantryBot metrics have disappeared
        labels:
          severity: critical
        isPaused: false
      - uid: pantry-postgres-backup-stale
        title: PantryBot Postgres backup older than 26h
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 900
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: time() - kube_cronjob_status_last_successful_time{job="kube-state-metrics-oracle",namespace="pantry-bot",cronjob="postgres-backup"}
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 93600
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: Alerting
        execErrState: Error
        annotations:
          description: CronJob postgres-backup (schedule daily 05:10 UTC) last succeeded more than 26h ago, or its metric
            is missing (kube-state-metrics-oracle down).
          summary: PantryBot Postgres backup has not succeeded in over 26h
        labels:
          severity: critical
        isPaused: false
      - uid: pantry-oracle-disk-high
        title: Oracle disk usage high
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: 100 * (1 - node_filesystem_avail_bytes{site="oracle",mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 85
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: 'Root filesystem (/) on the Oracle node has been above 85% for 10m. Check on the Oracle node:
            `docker system df` (images, containers, volumes, build cache), `docker volume prune` (an hourly cron also
            prunes; if the cron is failing the disk fills), and the CI runner work dirs. Kubelet starts evicting pods
            at ~95% (2026-09-30: 96% evicted every PantryBot pod and Postgres, ~37 min outage).'
          summary: Oracle root disk is {{ $values.B.Value | humanize }}% full
        labels:
          severity: warning
        isPaused: false
      - uid: pantry-oracle-disk-critical
        title: Oracle disk usage critical
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: 100 * (1 - node_filesystem_avail_bytes{site="oracle",mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 92
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: 'Root filesystem (/) on the Oracle node has been above 92% for 5m. ACT NOW. Check on the Oracle
            node: `docker system df` (images, containers, volumes, build cache), `docker volume prune` (an hourly cron
            also prunes; if the cron is failing the disk fills), and the CI runner work dirs. Kubelet starts evicting
            pods at ~95% (2026-09-30: 96% evicted every PantryBot pod and Postgres, ~37 min outage).'
          summary: Oracle root disk is {{ $values.B.Value | humanize }}% full - eviction imminent
        labels:
          severity: critical
        isPaused: false
      - uid: pantry-oracle-disk-metrics-absent
        title: No Oracle disk metrics
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: absent(node_filesystem_size_bytes{site="oracle",mountpoint="/",fstype="ext4"})
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 0
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        dashboardUid: ''
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: 'No node_filesystem_size_bytes{site=oracle,mountpoint=/} series for 10m, so the Oracle disk usage
            alerts cannot fire: node-exporter-oracle is down, Oracle Prometheus is down, or remote_write to home is
            broken. Distinct from PantryBot metrics absent, which watches app metrics only.'
          summary: Oracle node-exporter disk metrics have disappeared
        labels:
          severity: warning
        isPaused: false
    - orgId: 1
      name: pc-health-obs
      folder: PC Health
      interval: 1m
      rules:
      - uid: pc-obs-render-drops
        title: 'Truffles OBS: render dropped frames above 5%'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: (100 * increase(streaming_obs_render_skipped_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              / increase(streaming_obs_render_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])) and on(instance,role)
              (streaming_obs_stream_active{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (streaming_obs_collection_success{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (time() - streaming_collector_timestamp_seconds{instance="TRUFFLES",role="streaming-laptop"} < 45) and
              on(instance,role) (increase(streaming_obs_render_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              > 0)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          description: OBS render dropped frames exceeded 5% of rendered frames during the rolling 1-minute window.
            Evaluates only while OBS streaming is active, metric collection succeeds, metrics are fresh, and frame count
            is nonzero. The 5% threshold is an operational choice, not a Microsoft-defined limit.
          summary: Truffles OBS render drops above 5% in 1m
        labels:
          severity: warning
        isPaused: false
      - uid: pc-obs-encode-drops
        title: 'Truffles OBS: encoder dropped frames above 5%'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: (100 * increase(streaming_obs_encode_skipped_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              / increase(streaming_obs_encode_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])) and on(instance,role)
              (streaming_obs_stream_active{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (streaming_obs_collection_success{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (time() - streaming_collector_timestamp_seconds{instance="TRUFFLES",role="streaming-laptop"} < 45) and
              on(instance,role) (increase(streaming_obs_encode_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              > 0)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          description: OBS encoder dropped frames exceeded 5% of encoded frames during the rolling 1-minute window.
            Evaluates only while OBS streaming is active, metric collection succeeds, metrics are fresh, and frame count
            is nonzero. The 5% threshold is an operational choice, not a Microsoft-defined limit.
          summary: Truffles OBS encoder drops above 5% in 1m
        labels:
          severity: warning
        isPaused: false
      - uid: pc-obs-network-drops
        title: 'Truffles OBS: network dropped frames above 5%'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: (100 * increase(streaming_obs_network_dropped_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              / increase(streaming_obs_stream_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])) and on(instance,role)
              (streaming_obs_stream_active{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (streaming_obs_collection_success{instance="TRUFFLES",role="streaming-laptop"} == 1) and on(instance,role)
              (time() - streaming_collector_timestamp_seconds{instance="TRUFFLES",role="streaming-laptop"} < 45) and
              on(instance,role) (increase(streaming_obs_stream_frames_total{instance="TRUFFLES",role="streaming-laptop"}[1m])
              > 0)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          description: OBS network dropped frames exceeded 5% of streamed frames during the rolling 1-minute window.
            Evaluates only while OBS streaming is active, metric collection succeeds, metrics are fresh, and frame count
            is nonzero. The 5% threshold is an operational choice, not a Microsoft-defined limit.
          summary: Truffles OBS network drops above 5% in 1m
        labels:
          severity: warning
        isPaused: false
    - orgId: 1
      name: pc-health-windows
      folder: PC Health
      interval: 1m
      rules:
      - uid: pc-cpu-greenies
        title: 'Greenie main PC: CPU above 85%'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: 100 * (1 - avg by (instance, site) (rate(windows_cpu_time_total{job="integrations/windows",site="windows-remote",mode="idle"}[5m])))
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 85
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: CPU utilization has remained above 85% for 10 minutes. Microsoft documents >85% sustained CPU
            as a bottleneck in Windows Server Performance Monitor troubleshooting and uses >85% for 10 minutes as a
            Windows Admin Center server alert default. These are Windows Server guidance, not PC-specific limits. https://learn.microsoft.com/en-us/troubleshoot/windows-server/support-tools/troubleshoot-issues-performance-monitor
            https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/configure-azure-monitor
          summary: Greenie main PC CPU above 85% for 10m
        labels:
          severity: warning
        isPaused: false
      - uid: pc-disk-greenies
        title: 'Greenie main PC: C drive above 85% used'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: 100 * (1 - windows_logical_disk_free_bytes{job="integrations/windows",site="windows-remote",volume="C:"}
              / windows_logical_disk_size_bytes{job="integrations/windows",site="windows-remote",volume="C:"})
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 85
                type: gt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: 'C: drive capacity has remained above 85% used for 10 minutes. This threshold is the Windows
            Admin Center default for Windows Server/Log Analytics monitoring, not a universal Windows PC danger limit.
            https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/configure-azure-monitor'
          summary: 'Greenie main PC C: drive above 85% used for 10m'
        labels:
          severity: warning
        isPaused: false
      - uid: pc-memory-greenies
        title: 'Greenie main PC: available memory below 100 MB'
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: Prometheus
          model:
            datasource:
              type: prometheus
              uid: Prometheus
            expr: windows_memory_available_bytes{job="integrations/windows",site="windows-remote"}
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            settings:
              mode: dropNN
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
            - evaluator:
                params:
                - 104857600.0
                type: lt
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          description: Available physical memory has remained below 100 MB for 10 minutes. This threshold is the Windows
            Admin Center default for Windows Server/Log Analytics monitoring, not a universal Windows PC danger limit.
            https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/configure-azure-monitor
          summary: Greenie main PC available memory below 100 MB for 10m
        labels:
          severity: warning
        isPaused: false
      - uid: pc-cpu-truffles
