    policies:
    - orgId: 1
      receiver: grafana-default-email
      group_by:
      - grafana_folder
      - alertname
      routes:
      - receiver: opsbot-dm
        group_by:
        - grafana_folder
        - alertname
        object_matchers:
        - - grafana_folder
          - =~
          - pantry-bot|pantry|twitch
        continue: true
      - receiver: opsbot-dm
        group_by:
        - grafana_folder
        - alertname
        object_matchers:
        - - app
