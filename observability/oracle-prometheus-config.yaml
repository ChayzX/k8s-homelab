apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-oracle-config
  namespace: observability
  labels:
    app: prometheus-oracle
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: pantry-bot-oracle
        node: pantry-bot-oracle
        site: oracle

    remote_write:
      - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
        basic_auth:
          username: "3548270"
          password_file: /etc/prometheus/secrets/password
        queue_config:
          capacity: 1500
          max_shards: 8
          min_shards: 1
          max_samples_per_send: 500
          batch_send_deadline: 5s
          min_backoff: 30ms
          max_backoff: 5s

    scrape_configs:
      - job_name: prometheus-oracle
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: node-oracle
        static_configs:
          - targets: ["node-exporter-oracle.observability.svc.cluster.local:9100"]

      - job_name: kube-state-metrics-oracle
        static_configs:
          - targets: ["kube-state-metrics.observability.svc.cluster.local:8080"]

      - job_name: kubernetes-kubelet-oracle
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-cadvisor-oracle
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
