apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-oracle-config
  namespace: observability
  labels:
    app: prometheus-oracle
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: pantry-bot-oracle
        node: pantry-bot-oracle
        site: oracle

    # Keep Oracle metrics local except for the small series set evaluated by
    # Home Grafana. Preserve the working on-prem remote-write endpoint.
    remote_write:
      - url: https://metrics.greeniespantry.uk/api/v1/write
        queue_config:
          capacity: 100
          max_shards: 1
          min_shards: 1
          max_samples_per_send: 100
          batch_send_deadline: 15s
        metadata_config:
          send: false
        # Send only PantryBot service health/usage and the Home dashboards'
        # existing backup/filesystem signals. Raw application and host series
        # stay on Oracle. Keep this allowlist aligned with Home Grafana queries.
        write_relabel_configs:
          - source_labels: [__name__, job, namespace, cronjob, mountpoint, fstype]
            separator: ";"
            regex: '(kube_cronjob_status_last_successful_time;kube-state-metrics-oracle;pantry-bot;postgres-backup;;|(up|pantry_bot_runtime_(claims|completions|failures)_total);pantry-bot-.*-oracle;;;;|pantry_bot_commands_total;pantry-bot-worker-oracle;;;;|node_filesystem_(avail|size)_bytes;node-oracle;;;/;ext4)'
            action: keep

    scrape_configs:
      - job_name: prometheus-oracle
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: node-oracle
        static_configs:
          - targets: ["node-exporter-oracle.observability.svc.cluster.local:9100"]

      - job_name: kube-state-metrics-oracle
        static_configs:
          - targets: ["kube-state-metrics.observability.svc.cluster.local:8080"]

      - job_name: pantry-bot-api-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-private-api.pantry-bot.svc.cluster.local:3000"]
            labels:
              site: oracle
              role: api

      - job_name: pantry-bot-gateway-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-twitch-gateway.pantry-bot.svc.cluster.local:3001"]
            labels:
              site: oracle
              role: gateway

      - job_name: pantry-bot-worker-oracle
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [pantry-bot]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: pantry-chat-worker
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: health
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: site
            replacement: oracle
          - target_label: role
            replacement: worker

      - job_name: pantry-bot-dispatcher-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-twitch-dispatcher.pantry-bot.svc.cluster.local:3001"]
            labels:
              site: oracle
              role: dispatcher

      - job_name: alloy-logs-oracle
        static_configs:
          - targets: ["alloy-logs.observability.svc.cluster.local:12345"]
            labels:
              site: oracle
              role: logs

      - job_name: kubernetes-kubelet-oracle
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-cadvisor-oracle
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
