apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-oracle-config
  namespace: observability
  labels:
    app: prometheus-oracle
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: pantry-bot-oracle
        node: pantry-bot-oracle
        site: oracle

    remote_write:
      - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
        basic_auth:
          username: "3548270"
          password_file: /etc/prometheus/secrets/password
        queue_config:
          capacity: 1500
          max_shards: 8
          min_shards: 1
          max_samples_per_send: 500
          batch_send_deadline: 5s
          min_backoff: 30ms
          max_backoff: 5s
        # Keep the local Prometheus complete, but send only operationally
        # useful series to the free Grafana Cloud stack. The kubelet and
        # cAdvisor endpoints are intentionally retained locally; their full
        # high-cardinality output is the primary source of Cloud overage.
        write_relabel_configs:
          - source_labels: [__name__]
            regex: 'up|node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_load1|node_network_receive_bytes_total|node_network_transmit_bytes_total|kube_node_status_condition|kube_pod_status_phase|kube_pod_container_status_ready|kube_pod_container_status_restarts_total|kube_deployment_status_replicas_available|kube_deployment_spec_replicas|kube_statefulset_status_replicas_ready|kube_daemonset_status_number_ready|kube_daemonset_status_desired_number_scheduled|prometheus_.*|promtail_.*|loki_.*|grafana_.*|pantry_.*|opsbot_.*|jmusicbot_.*|k3s_.*|minecraft_.*'
            action: keep

    scrape_configs:
      - job_name: prometheus-oracle
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: node-oracle
        static_configs:
          - targets: ["node-exporter-oracle.observability.svc.cluster.local:9100"]

      - job_name: kube-state-metrics-oracle
        static_configs:
          - targets: ["kube-state-metrics.observability.svc.cluster.local:8080"]

      - job_name: kubernetes-kubelet-oracle
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-cadvisor-oracle
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
