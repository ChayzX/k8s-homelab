apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-oracle-config
  namespace: observability
  labels:
    app: prometheus-oracle
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: pantry-bot-oracle
        node: pantry-bot-oracle
        site: oracle

    scrape_configs:
      - job_name: prometheus-oracle
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: node-oracle
        static_configs:
          - targets: ["node-exporter-oracle.observability.svc.cluster.local:9100"]

      - job_name: kube-state-metrics-oracle
        static_configs:
          - targets: ["kube-state-metrics.observability.svc.cluster.local:8080"]

      - job_name: pantry-bot-api-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-private-api.pantry-bot.svc.cluster.local:3000"]
            labels:
              site: oracle
              role: api

      - job_name: pantry-bot-gateway-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-twitch-gateway.pantry-bot.svc.cluster.local:3001"]
            labels:
              site: oracle
              role: gateway

      - job_name: pantry-bot-worker-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-chat-worker.pantry-bot.svc.cluster.local:3001"]
            labels:
              site: oracle
              role: worker

      - job_name: pantry-bot-dispatcher-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["pantry-twitch-dispatcher.pantry-bot.svc.cluster.local:3001"]
            labels:
              site: oracle
              role: dispatcher

      # Token-free authority telemetry from the neutral GCP witness, reached
      # through the existing private tunnel relay.
      - job_name: pantry-postgres-witness-oracle
        metrics_path: /metrics
        static_configs:
          - targets: ["failover-witness-relay.observability.svc.cluster.local:18765"]
            labels:
              site: oracle
              role: witness

      - job_name: alloy-logs-oracle
        static_configs:
          - targets: ["alloy-logs.observability.svc.cluster.local:12345"]
            labels:
              site: oracle
              role: logs

      - job_name: kubernetes-kubelet-oracle
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-cadvisor-oracle
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
