# promtail -- log shipper, DaemonSet.
#
# NO PVC AND THEREFORE NO chown STEP. promtail is stateless apart from
# its positions file, which lives on a hostPath (/var/lib/promtail) so a
# pod restart does not re-ship the tail of every log file into Loki as
# duplicate entries.
#
# THIS POD RUNS AS ROOT, DELIBERATELY. Container log files under
# /var/log/pods are written by containerd as root with restrictive
# directory permissions; a non-root promtail reads nothing and reports
# no error other than "0 targets active". This is the upstream-standard
# shape for a log-collector DaemonSet and is the reason this namespace
# is labelled pod-security enforce=privileged (see namespace.yaml).
#
# TWO HOSTPATH MOUNTS, BOTH REQUIRED:
#   /var/log/pods            -- standard Kubernetes container logs
#   /home/chase/minecraft/logs -- the native, non-containerised Minecraft
#                              server. Minecraft does not become a pod
#                              until Phase 4. Removing this mount would
#                              blackhole Minecraft logs for the entire
#                              Phase 1 -> Phase 4 window, which is
#                              exactly the regression the plan calls out.
#                              Do not "clean this up" early.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-sa
  namespace: observability
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: observability
# promtail DOES need the API: kubernetes_sd_configs (role: pod) for
# target discovery and for the pod metadata that becomes stream labels.
automountServiceAccountToken: true
---
# Read-only, and only the objects service discovery actually reads.
# Notably absent: secrets, configmaps, and any write verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-promtail
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: observability
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-promtail
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-promtail
subjects:
  - kind: ServiceAccount
    name: promtail-sa
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: observability
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: promtail
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: promtail
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: observability
      annotations:
        homelab.local/config-revision: "2"
    spec:
      serviceAccountName: promtail-sa
      automountServiceAccountToken: true
      securityContext:
        # See the root note at the top of this file.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # Single-node cluster today, but a control-plane toleration costs
      # nothing and prevents a silent "no logs at all" if the node is
      # ever tainted.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail-config.yaml
          ports:
            - name: http-metrics
              containerPort: 9080
              protocol: TCP
          env:
            # LOAD-BEARING. promtail discards any discovered target whose
            # __host__ label does not equal this value. The default
            # HOSTNAME inside a pod is the POD name, which never equals
            # __meta_kubernetes_pod_node_name, so without this override
            # promtail discovers every pod and then tails none of them --
            # a silent zero-target failure with no error in the logs.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Needed to read root-owned log files while the container
              # is otherwise stripped of capabilities.
              add: ["DAC_READ_SEARCH"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            # Positions file. Survives pod restarts.
            - name: positions
              mountPath: /run/promtail
            # Kubernetes container logs. The files under here are
            # symlink targets, so this must be the real directory, not
            # /var/log/containers alone.
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            # THE MINECRAFT MOUNT. See the header comment.
            - name: minecraft-logs
              mountPath: /var/log/minecraft
              readOnly: true
            # Host systemd journal (persistent storage; confirmed present
            # at /var/log/journal, journald.conf has Storage=auto). Read
            # via the same absolute path so promtail's journal reader
            # (go-systemd sdjournal) resolves it transparently. Existing
            # root + DAC_READ_SEARCH already covers the systemd-journal
            # group's file permissions -- no securityContext change needed.
            - name: host-journal
              mountPath: /var/log/journal
              readOnly: true
            # Grafana Cloud Loki push credential (see promtail-config.yaml's
            # second `clients` entry). Secret, not the ConfigMap, so the
            # password never sits in plaintext config.
            - name: grafana-cloud-loki-secret
              mountPath: /etc/promtail/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: DirectoryOrCreate
        - name: minecraft-logs
          hostPath:
            path: /home/chase/minecraft/logs
            # The Oracle node does not host Minecraft. DirectoryOrCreate lets
            # the DaemonSet run there while presenting an empty mount; the
            # home node already has the real log directory.
            type: DirectoryOrCreate
        - name: host-journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: grafana-cloud-loki-secret
          secret:
            secretName: grafana-cloud-loki
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: observability
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: observability
spec:
  # Exists so Prometheus has a stable address to scrape promtail's own
  # metrics (promtail_sent_entries_total, promtail_targets_active_total
  # -- watch the latter, a drop to 0 is the failure mode described in
  # the HOSTNAME comment above).
  type: ClusterIP
  selector:
    app: promtail
  ports:
    - name: http-metrics
      port: 9080
      targetPort: http-metrics
      protocol: TCP
