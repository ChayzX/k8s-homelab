# Namespaces for the application workloads owned by this directory set.
#
# Scope note: this file intentionally creates ONLY the three namespaces that
# the application/RBAC manifests in ../jmusicbot, ../pantry-bot and ../keel
# depend on. The `observability` and `minecraft` namespaces are owned by their
# own directories in this repo and are created there — do not add them here or
# you get two sources of truth for the same object.
#
# Apply this FIRST. Everything else in this repo assumes these exist.
---
apiVersion: v1
kind: Namespace
metadata:
  name: jmusicbot
  labels:
    app.kubernetes.io/name: jmusicbot
    app.kubernetes.io/part-of: homelab
    kubernetes.io/metadata.name: jmusicbot
---
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-bot
    app.kubernetes.io/part-of: homelab
    kubernetes.io/metadata.name: pantry-bot
---
apiVersion: v1
kind: Namespace
metadata:
  name: keel
  labels:
    app.kubernetes.io/name: keel
    app.kubernetes.io/part-of: homelab
    kubernetes.io/metadata.name: keel
