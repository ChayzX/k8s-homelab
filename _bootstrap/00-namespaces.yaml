# Namespaces for the application workloads owned by this directory set.
#
# Scope note: this file intentionally creates ONLY the namespaces that the
# application/RBAC manifests in ../pantry-bot and ../opsbot
# depend on. The `observability` and `minecraft` namespaces are owned by
# their own directories in this repo and are created there — do not add
# them here or you get two sources of truth for the same object.
#
# `keel` namespace removed 2026-08-13 (k8s-homelab-oiv.6) -- Keel itself was
# decommissioned, retired in favor of GitHub Actions deploy workflows
# (see the retired pantry-bot/40-deployment.yaml.retired header).
# Apply this before the pantry-bot and opsbot manifests. JMusicBot owns its
# namespace in jmusicbot/00-namespace.yaml.
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-bot
  labels:
    app.kubernetes.io/name: pantry-bot
    app.kubernetes.io/part-of: homelab
    kubernetes.io/metadata.name: pantry-bot
---
apiVersion: v1
kind: Namespace
metadata:
  name: opsbot
  labels:
    app.kubernetes.io/name: opsbot
    app.kubernetes.io/part-of: homelab
    kubernetes.io/metadata.name: opsbot
